plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
    id 'jacoco'
}

description = 'Internal Spring Boot pilot used to validate the framework quality pipeline.'

ext['httpclient5.version'] = providers.gradleProperty('httpClient5Version').get()
ext['httpcore5.version'] = providers.gradleProperty('httpCore5Version').get()
ext['jackson-bom.version'] = providers.gradleProperty('jackson3Version').get()
ext['log4j2.version'] = providers.gradleProperty('log4j2Version').get()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(
            ':spring-boot-service-framework-starters:spring-boot-service-framework-starter-actuator'
    )
    implementation project(
            ':spring-boot-service-framework-starters:spring-boot-service-framework-starter-logging'
    )
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = providers.gradleProperty('jacocoVersion').get()
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
