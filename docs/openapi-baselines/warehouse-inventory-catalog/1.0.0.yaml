openapi: 3.0.3
info:
  title: warehouse-inventory-catalog
  version: '1.0.0'
paths:
  /warehouses/{warehouseId}/items/{sku}:
    get:
      operationId: getWarehouseInventoryItem
      parameters:
        - name: warehouseId
          in: path
          required: true
          schema:
            type: string
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inventory item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'
components:
  schemas:
    InventoryStatus:
      type: string
      enum:
        - available
        - reserved
        - blocked
        - discontinued
    InventoryItemResponse:
      type: object
      required:
        - sku
        - status
        - quantity
        - warehouse
      properties:
        sku:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Z0-9-]+$'
        status:
          $ref: '#/components/schemas/InventoryStatus'
        quantity:
          type: integer
          format: int64
          minimum: 0
          maximum: 999999
        unitPrice:
          type: number
          minimum: 0.01
          maximum: 99999.99
        warehouse:
          $ref: '#/components/schemas/WarehouseSummary'
        tags:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        lifecycleState:
          type: string
          enum:
            - new
            - active
            - archived
    WarehouseSummary:
      type: object
      required:
        - warehouseId
        - country
      properties:
        warehouseId:
          type: string
          minLength: 2
          maxLength: 20
        country:
          type: string
          minLength: 2
          maxLength: 2
        openedOn:
          type: string
          format: date
