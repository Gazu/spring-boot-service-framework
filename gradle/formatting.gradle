spotless {
    encoding 'UTF-8'

    java {
        target fileTree(rootDir) {
            include '**/src/**/*.java'
            exclude '**/build/**'
        }
        importOrder(
                'java',
                'javax',
                'jakarta',
                'org',
                'com',
                '',
                '\\#java',
                '\\#javax',
                '\\#jakarta',
                '\\#org',
                '\\#com',
                '\\#'
        )
        removeUnusedImports()
        forbidWildcardImports()
        googleJavaFormat(googleJavaFormatVersion).aosp().reorderImports(false)
        formatAnnotations()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'projectFiles', {
        target fileTree(rootDir) {
            include(
                    '.editorconfig',
                    '.gitattributes',
                    '.gitignore',
                    'gradlew',
                    '**/*.gradle',
                    '**/*.json',
                    '**/*.md',
                    '**/*.properties',
                    '**/*.sh',
                    '**/*.txt',
                    '**/*.xml',
                    '**/*.yaml',
                    '**/*.yml'
            )
            exclude(
                    '**/.gradle/**',
                    '**/.idea/**',
                    '**/build/**',
                    'gradle/compatibility/contracts/**'
            )
        }
        trimTrailingWhitespace()
        endWithNewline()
    }
}

allprojects {
    tasks.withType(Javadoc).configureEach {
        mustRunAfter rootProject.tasks.named('spotlessJava')
    }
}
