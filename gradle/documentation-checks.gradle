tasks.register('validateOpenApiDocumentationDeduplication') {
    group = 'verification'
    description = 'Validates canonical OpenAPI documentation ownership and prevents parallel manuals.'

    def codegenOverview = file('docs/openapi-codegen.md')
    def artifactProcedure = file('docs/guides/openapi-generated-artifacts.md')
    def behaviorInventory = file('docs/openapi-behavior-inventory.md')
    def architectureFile = file('docs/openapi/documentation-architecture.md')
    def pluginReadme = file('build-logic/openapi-generator-plugin/README.md')
    def projectGeneratorReadme = file('spring-boot-service-framework-project-generator/README.md')
    def contractTestingReadme = file('spring-boot-service-framework-openapi-contract-testing/README.md')
    def openApiDocumentation = files(
            fileTree('docs') {
                include 'openapi/**/*.md'
                include 'openapi-*.md'
                include 'guides/*openapi*.md'
            },
            pluginReadme,
            file('build-logic/openapi-templates/README.md'),
            projectGeneratorReadme,
            contractTestingReadme
    )

    inputs.files(
            openApiDocumentation,
            architectureFile
    )

    doLast {
        def failures = []

        [
                'Capability Map',
                'Build-Time Boundary',
                'Runtime Boundary',
                'Workflow Boundaries',
                'Ownership',
                'Validation'
        ].each { section ->
            if (!codegenOverview.text.contains("## ${section}")) {
                failures << "OpenAPI code-generation overview must contain section ${section}"
            }
        }
        [
                '(openapi/plugin-reference.md)',
                '(openapi/generation.md)',
                '(openapi/validation.md)',
                '(openapi/publishing.md)',
                '(openapi/versioning.md)',
                '(openapi-contract-testing.md)',
                '(openapi/scaffolding.md)'
        ].each { link ->
            if (!codegenOverview.text.contains(link)) {
                failures << "OpenAPI code-generation overview must delegate to ${link}"
            }
        }
        if (codegenOverview.text.contains('```')) {
            failures << 'OpenAPI code-generation overview must not duplicate executable examples'
        }
        if (codegenOverview.readLines().size() > 100) {
            failures << 'OpenAPI code-generation overview must remain under 100 lines'
        }

        [
                '## 1. Add The Spec',
                '## 2. Register The Baseline',
                '## 3. Generate Artifacts',
                '## 4. Inspect The Result',
                '## 5. Validate',
                '## 6. Publish Locally',
                '## Expected Result'
        ].each { section ->
            if (!artifactProcedure.text.contains(section)) {
                failures << "generated-artifacts procedure must contain ${section}"
            }
        }
        [
                '```java',
                '```yaml',
                '@Component',
                '@HttpApiClient',
                'authentication-type:',
                'DefaultApiDelegate',
                'META-INF/smbtech/openapi/',
                'smbtechOpenApi {'
        ].each { duplicate ->
            if (artifactProcedure.text.contains(duplicate)) {
                failures << "generated-artifacts procedure must delegate implementation detail ${duplicate}"
            }
        }

        def uniqueOwners = [
                '| `smbtechOpenApi.groupId`'   : file('docs/openapi/plugin-reference.md'),
                '| `artifact.group`'           : behaviorInventory,
                'OPENAPI_REPOSITORY_USERNAME'  : file('docs/openapi/publishing.md'),
                'HexagonalArchitectureTest.java': file('docs/openapi/scaffolding.md')
        ]
        uniqueOwners.each { marker, owner ->
            def occurrences = openApiDocumentation.files.findAll { it.text.contains(marker) }
            if (occurrences.toSet() != ([owner] as Set)) {
                failures << "OpenAPI documentation marker ${marker} must be owned only by ${relativePath(owner)}; found ${occurrences.collect { relativePath(it) }.sort()}"
            }
        }

        def embeddedVersionedPath =
                'META-INF/smbtech/openapi/contracts/<name>/<version>/contract.yaml'
        def embeddedPathOwners = [
                behaviorInventory,
                file('docs/openapi/generation.md')
        ] as Set
        def embeddedPathOccurrences = openApiDocumentation.files.findAll {
            it.text.contains(embeddedVersionedPath)
        } as Set
        if (embeddedPathOccurrences != embeddedPathOwners) {
            failures << "versioned embedded contract path must remain only in generation.md and the compatibility inventory"
        }

        if (!behaviorInventory.text.contains(
                'It records only values protected by automated checks; canonical references own')) {
            failures << 'OpenAPI behavior inventory must declare its compatibility-snapshot boundary'
        }
        [pluginReadme, projectGeneratorReadme, contractTestingReadme].each { moduleReadme ->
            if (!moduleReadme.text.contains('OpenAPI Portal')) {
                failures << "${relativePath(moduleReadme)} must delegate navigation to the OpenAPI portal"
            }
        }
        [
                'smbtechOpenApiValidateSpecs',
                'build/reports/smbtech-openapi',
                'OpenAPI Diff with SemVer enforcement'
        ].each { duplicate ->
            if (pluginReadme.text.contains(duplicate)) {
                failures << "OpenAPI plugin README must delegate detailed behavior ${duplicate}"
            }
        }
        if (projectGeneratorReadme.text.contains('The generated project contains:')
                || projectGeneratorReadme.text.contains('Generate from a server API JAR:')) {
            failures << 'project-generator README must delegate output and input details to scaffolding.md'
        }

        if (!architectureFile.text.contains(
                'The behavior inventory is a compatibility snapshot, not a second usage')) {
            failures << 'OpenAPI documentation architecture must define the inventory duplication exception'
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    "OpenAPI documentation duplication issues found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('validateOpenApiDocumentationArchitecture') {
    group = 'verification'
    description = 'Validates canonical OpenAPI documentation ownership and module boundaries.'

