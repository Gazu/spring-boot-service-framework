tasks.register('validateChangelogAndReleaseDocs') {
    group = 'verification'
    description = 'Validates changelog and release process documentation.'

    inputs.files(
            file('CHANGELOG.md'),
            file('docs/releasing.md'),
            file('CONTRIBUTING.md')
    )

    doLast {
        def failures = []
        def currentVersion = rootProject.version.toString()
        def changelog = file('CHANGELOG.md').text
        def releasing = file('docs/releasing.md').text
        def contributing = file('CONTRIBUTING.md').text

        if (!changelog.startsWith('# Changelog')) {
            failures << 'CHANGELOG.md must start with "# Changelog"'
        }
        if (!changelog.contains('## Unreleased')) {
            failures << 'CHANGELOG.md must contain "## Unreleased"'
        }
        if (!(changelog =~ /(?m)^## ${java.util.regex.Pattern.quote(currentVersion)} - \d{4}-\d{2}-\d{2}$/).find()) {
            failures << "CHANGELOG.md must contain a dated section for ${currentVersion}"
        }
        if (!changelog.contains('[docs/releasing.md](docs/releasing.md)')) {
            failures << 'CHANGELOG.md must link to docs/releasing.md'
        }
        if (!releasing.contains("v${currentVersion}")) {
            failures << "docs/releasing.md must include tag examples for v${currentVersion}"
        }
        if (!releasing.contains('./gradlew documentationCheck') || !releasing.contains('./gradlew compatibilityCheck')) {
            failures << 'docs/releasing.md must include documentationCheck and compatibilityCheck'
        }
        if (!contributing.contains('[Releasing](docs/releasing.md)')) {
            failures << 'CONTRIBUTING.md must link to docs/releasing.md'
        }

        if (!failures.isEmpty()) {
            throw new GradleException("Changelog/release documentation issues found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('validateDocumentationVersions') {
    group = 'verification'
    description = 'Validates framework version references in documentation and examples.'

    inputs.files(fileTree(rootDir) {
        include 'README.md'
        include 'CHANGELOG.md'
        include 'docs/**/*.md'
        include 'examples/**/*.md'
        include 'examples/**/*.gradle'
        include 'spring-boot-service-framework-*/README.md'
        include 'spring-boot-service-framework-starters/*/README.md'
        include 'build.gradle'
        exclude '**/build/**'
    })

    doLast {
        def failures = []
        def currentVersion = rootProject.version.toString()
        def artifactPattern = ~/com\.smbtech:(spring-boot-service-framework-(actuator-core|commons|logging-core|http-client-core|mock-core|error-core|starter-actuator|starter-logging|starter-rest-client|starter-mock|starter-error-handling)):([0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?)/
        def versionAssignmentPattern = ~/version\s*=\s*['"]([0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?)['"]/
        def currentStatusPattern = ~/framework is in `([0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?)`/

        inputs.files.files.sort().each { source ->
            source.eachLine { line, number ->
                def artifactMatcher = line =~ artifactPattern
                artifactMatcher.each { match ->
                    def referencedVersion = match[3]
                    if (referencedVersion != currentVersion) {
                        failures << "${relativePath(source)}:${number}: expected framework version ${currentVersion}, found ${referencedVersion}"
                    }
                }

                if (source.name.endsWith('.gradle') || relativePath(source) == 'docs/releasing.md') {
                    def assignmentMatcher = line =~ versionAssignmentPattern
                    assignmentMatcher.each { match ->
                        def referencedVersion = match[1]
                        if (referencedVersion != currentVersion) {
                            failures << "${relativePath(source)}:${number}: expected framework version ${currentVersion}, found ${referencedVersion}"
                        }
                    }
                }

                def statusMatcher = line =~ currentStatusPattern
                statusMatcher.each { match ->
                    def referencedVersion = match[1]
                    if (referencedVersion != currentVersion) {
                        failures << "${relativePath(source)}:${number}: expected framework version ${currentVersion}, found ${referencedVersion}"
                    }
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("Documentation version issues found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('validateOpenApiBehaviorInventory') {
    group = 'verification'
    description = 'Validates the frozen OpenAPI behavior inventory against the plugin contract and implementation.'

    def inventoryFile = file('docs/openapi-behavior-inventory.md')
    def pluginReference = file('docs/openapi/plugin-reference.md')
    def extensionSource = file('build-logic/openapi-generator-plugin/src/main/java/com/smbtech/serviceframework/gradle/openapi/SmbtechOpenApiExtension.java')
    def specSource = file('build-logic/openapi-generator-plugin/src/main/java/com/smbtech/serviceframework/gradle/openapi/SmbtechOpenApiSpec.java')
    def artifactKindSource = file('build-logic/openapi-generator-plugin/src/main/java/com/smbtech/serviceframework/gradle/openapi/OpenApiArtifactKind.java')
    def generatorSource = file('build-logic/openapi-generator-plugin/src/main/java/com/smbtech/serviceframework/gradle/openapi/SmbtechOpenApiGenerateTask.java')
    def generationConfigurerSource = file('build-logic/openapi-generator-plugin/src/main/java/com/smbtech/serviceframework/gradle/openapi/OpenApiGenerationConfigurer.java')
    def metadataSource = file('build-logic/openapi-generator-plugin/src/main/java/com/smbtech/serviceframework/gradle/openapi/SmbtechOpenApiMetadataTask.java')
    def pluginSource = file('build-logic/openapi-generator-plugin/src/main/java/com/smbtech/serviceframework/gradle/openapi/SmbtechOpenApiGeneratorPlugin.java')
    def toolchainProperties = file('gradle.properties')

    inputs.files(
            inventoryFile,
            pluginReference,
            extensionSource,
            specSource,
            artifactKindSource,
            generatorSource,
            generationConfigurerSource,
            metadataSource,
            pluginSource,
            toolchainProperties
    )

    doLast {
        def failures = []
        def inventory = inventoryFile.text

        if (!inventory.contains('(openapi/plugin-reference.md)')) {
            failures << 'OpenAPI behavior inventory must delegate Gradle DSL and tasks to plugin-reference.md'
        }
        if (inventory.contains('### Global properties')
                || inventory.contains('### Per-contract properties')
                || inventory.contains('## Public Tasks')) {
            failures << 'OpenAPI behavior inventory must not duplicate the canonical plugin reference'
        }

        def metadataKeys = [
                'artifact.group',
                'artifact.id',
                'artifact.kind',
                'contract.id',
                'contract.sha256',
                'contract.title',
                'contract.version',
                'framework.version',
                'generator.name',
                'generator.version',
                'spring-boot.version'
        ]
        metadataKeys.each { key ->
            if (!metadataSource.text.contains("values.put(\"${key}\"")) {
                failures << "OpenAPI metadata implementation must contain ${key}"
            }
            if (!inventory.contains("`${key}`")) {
                failures << "OpenAPI behavior inventory must document metadata key ${key}"
            }
        }

        def artifactKinds = [
                MODELS   : 'models',
                SERVER_API: 'server-api',
                CLIENT   : 'client'
        ]
        artifactKinds.each { enumName, suffix ->
            if (!artifactKindSource.text.contains("${enumName}(\"${suffix}\")")) {
                failures << "OpenAPI artifact kind implementation must contain ${enumName}=${suffix}"
            }
            if (!inventory.contains("-`${suffix}`") && !inventory.contains("-${suffix}")) {
                failures << "OpenAPI behavior inventory must document artifact suffix ${suffix}"
            }
        }

        [
                'useSpringBoot4',
                'useJakartaEe',
                'useBeanValidation',
                'performBeanValidation',
                'useJackson3'
        ].each { option ->
            if (!generatorSource.text.contains("addAdditionalProperty(\"${option}\", true)")) {
                failures << "OpenAPI generator implementation must enable ${option}"
            }
            if (!inventory.contains("`${option}`")) {
                failures << "OpenAPI behavior inventory must document generator option ${option}"
            }
        }

        [
                'META-INF/smbtech/openapi/contract.yaml',
                'META-INF/smbtech/openapi/contract.properties',
                'META-INF/smbtech/openapi/contracts/<name>/<version>/contract.yaml',
                'META-INF/smbtech/openapi/contracts/<name>/<version>/contract.properties',
                'build/reports/smbtech-openapi',
                'build/libs/smbtech-openapi'
        ].each { path ->
            if (!inventory.contains(path)) {
                failures << "OpenAPI behavior inventory must document path ${path}"
            }
        }

        def versions = new Properties()
        toolchainProperties.withInputStream { versions.load(it) }
        [
                frameworkVersion       : 'Framework',
                springBootVersion      : 'Spring Boot',
                openApiGeneratorVersion: 'OpenAPI Generator',
                openApiDiffVersion     : 'OpenAPI Diff',
                jackson3Version        : 'Jackson build parser',
                handlebarsVersion      : 'Handlebars'
        ].each { propertyName, componentName ->
            def value = versions.getProperty(propertyName)
            if (value == null || value.isBlank()) {
                failures << "gradle.properties must define ${propertyName}"
            } else if (!inventory.contains("| ${componentName} | `${value}` | `${propertyName}` |")) {
                failures << "OpenAPI behavior inventory must document ${propertyName}=${value}"
            }
        }

        [
                [pluginSource, 'EXTENSION_NAME = "smbtechOpenApi"'],
                [generationConfigurerSource, 'task.dependsOn(ASSEMBLE_TASK_NAME)'],
                [generationConfigurerSource, 'task.dependsOn(jar)'],
                [extensionSource, 'convention("com.smbtech.contracts")'],
                [specSource, 'public abstract RegularFileProperty getInput()']
        ].each { expectation ->
            if (!expectation[0].text.contains(expectation[1])) {
                failures << "OpenAPI behavior implementation marker is missing: ${expectation[1]}"
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    "OpenAPI behavior inventory issues found:\n" + failures.join('\n'))
        }
    }
}

