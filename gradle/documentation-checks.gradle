                [contractReaderSource, 'info.version is required'],
                [contractReaderSource, 'paths must contain at least one operation'],
                [contractReaderSource, 'operationId is required'],
                [contractReaderSource, 'must be unique'],
                [generationConfigurerSource, 'task.dependsOn(\n                                            SmbtechOpenApiGeneratorPlugin.VALIDATE_SPECS_TASK_NAME)'],
                [compatibilityConfigurerSource, 'COMPATIBILITY_TASK_NAME = "smbtechOpenApiCompatibilityCheck"'],
                [compatibilityConfigurerSource, 'task.dependsOn(\n                                            breakingChange,\n                                            reproducibility,\n                                            migration,\n                                            consumerTest,\n                                            mockContract)']
        ].each { expectation ->
            if (!expectation[0].text.contains(expectation[1])) {
                failures << "OpenAPI validation implementation marker is missing: ${expectation[1]}"
            }
        }

        [
                'smbtechOpenApiBuildLogicCheck',
                'smbtechOpenApiValidateSpecs',
                'smbtechOpenApiCompatibilityCheck',
                'smbtechOpenApiBreakingChangeCheck',
                'smbtechOpenApiReproducibilityCheck',
                'smbtechOpenApiMigrationReport',
                'smbtechOpenApiConsumerTest',
                'smbtechOpenApiMockContractCheck'
        ].each { taskName ->
            if (!compatibilityContract.text.contains("task=${taskName}")) {
                failures << "OpenAPI compatibility contract must protect validation task ${taskName}"
            }
            if (tasks.findByName(taskName) == null) {
                failures << "documented OpenAPI validation task is not registered: ${taskName}"
            }
        }

        if (compatibilityConfigurerSource.text.contains('BUILD_LOGIC_CHECK_TASK_NAME')
                || compatibilityConfigurerSource.text.contains('VALIDATE_SPECS_TASK_NAME')) {
            failures << 'compatibility aggregate must remain distinct from configuration and spec validation'
        }
        if (!architectureFile.text.contains(
                '| Configuration, document, coordinate, and compatibility validation | `docs/openapi/validation.md` | Same validation reference |')) {
            failures << 'OpenAPI documentation architecture must assign build-time validation to validation.md'
        }
        [
                [portalFile, '(validation.md)'],
                [codegenFile, '(openapi/validation.md)'],
                [pluginReference, '(validation.md)'],
                [behaviorInventory, '(openapi/validation.md)'],
                [gettingStartedFile, '(validation.md)'],
                [generationFile, '(validation.md)'],
                [artifactGuide, '(../openapi/validation.md)']
        ].each { expectation ->
            if (!expectation[0].text.contains(expectation[1])) {
                failures << "${relativePath(expectation[0])} must link to validation.md"
            }
        }

        if (codegenFile.text.contains('uses Swagger Parser and rejects')) {
            failures << 'openapi-codegen.md must not duplicate document validation rules'
        }
        if (pluginReference.text.contains('rejects configuration when:')) {
            failures << 'plugin-reference.md must not duplicate configuration validation rules'
        }
        if (behaviorInventory.text.contains('discovers configured inputs and YAML')) {
            failures << 'OpenAPI behavior inventory must delegate validation rules to validation.md'
        }
        if (artifactGuide.text.contains('plugin configuration and contract naming;')) {
            failures << 'generated-artifacts procedure must not duplicate the compatibility checklist'
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    "OpenAPI validation documentation issues found:\n" + failures.join('\n'))
        }
    }
}

