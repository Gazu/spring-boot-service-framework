                'docs/openapi/validation.md',
                'docs/openapi/versioning.md',
                'docs/openapi/testing.md',
                'docs/openapi/scaffolding.md',
                'docs/openapi/examples.md',
                'docs/openapi/troubleshooting.md',
                'docs/adr/0001-openapi-generator-engine.md',
                'build-logic/openapi-generator-plugin/README.md',
                'build-logic/openapi-templates/README.md',
                'spring-boot-service-framework-openapi-contract-testing/README.md'
        ].each { owner ->
            if (!architecture.contains("`${owner}`")) {
                failures << "OpenAPI documentation architecture must classify ${owner}"
            }
        }

        [
                'validateOpenApiDocumentationCommands',
                'openApiDocumentationCheck',
                'build/reports/smbtech-openapi/documentation-check.txt',
                'openApiDocumentationCompatibilityCheck',
                'gradle/compatibility/contracts/openApiDocumentation.txt'
        ].each { marker ->
            if (!architecture.contains(marker)) {
                failures << "OpenAPI documentation architecture must document ${marker}"
            }
        }

        moduleLinks.each { path, target ->
            if (!file(path).text.contains("(${target})")) {
                failures << "${path} must link to ${target}"
            }
        }

        if (!behaviorInventory.text.contains('(openapi/documentation-architecture.md)')) {
            failures << 'OpenAPI behavior inventory must link to the documentation architecture'
        }
        if (!adrFile.text.contains('- Status: Accepted')) {
            failures << 'OpenAPI generator ADR must retain an explicit accepted status'
        }
        if (file('docs/openapi-evolution.md').exists()) {
            failures << 'completed docs/openapi-evolution.md roadmap must remain removed'
        }

        markdownDocumentationFiles().files.sort().each { source ->
            if (source != architectureFile && source.text.contains('openapi-evolution.md')) {
                failures << "${relativePath(source)} must not link to the completed OpenAPI evolution roadmap"
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    "OpenAPI documentation architecture issues found:\n" + failures.join('\n'))
        }
    }
