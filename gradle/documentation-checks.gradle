// Documentation and example safety checks extracted from the root build.

def markdownDocumentationFiles = {
    fileTree(rootDir) {
        include '**/*.md'
        exclude '**/.git/**'
        exclude '**/.gradle/**'
        exclude '**/build/**'
    }
}

String relativePath(File source) {
    rootDir.toPath().relativize(source.toPath()).toString()
}

String extractMarkdownTarget(String rawTarget) {
    def target = rawTarget.trim()
    if (target.startsWith('<') && target.contains('>')) {
        return target.substring(1, target.indexOf('>')).trim()
    }
    target.split(/\s+/, 2)[0].trim()
}

String markdownAnchor(String heading) {
    def anchor = java.text.Normalizer.normalize(heading, java.text.Normalizer.Form.NFD)
            .replaceAll(/\p{M}/, '')
            .replaceAll(/`([^`]+)`/, '$1')
            .replaceAll(/<[^>]+>/, '')
            .replaceAll(/\[([^\]]+)]\([^)]+\)/, '$1')
            .replaceAll(/#+\s*$/, '')
            .toLowerCase(Locale.ROOT)
            .replaceAll(/&[a-z0-9#]+;/, '')
            .replaceAll(/[^\p{Alnum}\s-]/, '')
            .trim()
            .replaceAll(/\s+/, '-')
            .replaceAll(/-+/, '-')
    anchor
}

Set<String> markdownAnchors(File source) {
    def anchors = [] as Set
    def counts = [:].withDefault { 0 }
    def inFence = false

    source.eachLine { line ->
        if (line.trim().startsWith('```')) {
            inFence = !inFence
        } else if (!inFence) {
            def matcher = line =~ /^(#{1,6})\s+(.+?)\s*$/
            if (matcher.matches()) {
                def baseAnchor = markdownAnchor(matcher[0][2])
                if (!baseAnchor.isBlank()) {
                    def count = counts[baseAnchor]
                    anchors << (count == 0 ? baseAnchor : "${baseAnchor}-${count}".toString())
                    counts[baseAnchor] = count + 1
                }
            }
        }
    }

    anchors
}

tasks.register('validateMarkdownLinks') {
    group = 'verification'
    description = 'Validates relative Markdown links and anchors in repository documentation.'

    inputs.files(markdownDocumentationFiles())

    doLast {
        def failures = []
        def linkPattern = ~/\[[^\]]+]\(([^)]+)\)/
        def anchorsByFile = [:]

        inputs.files.files.sort().each { source ->
            source.eachLine { line, number ->
                def matcher = line =~ linkPattern
                matcher.each { match ->
                    def rawTarget = match[1].trim()
                    def extractedTarget = extractMarkdownTarget(rawTarget)
                    def targetParts = extractedTarget.split('#', 2)
                    def target = targetParts[0].trim()
                    def anchor = targetParts.length > 1 ? targetParts[1].trim() : ''
                    def external = target.contains('://') || target.startsWith('mailto:')
                    if (!external) {
                        def destination = target.isBlank() ? source : new File(source.parentFile, target)
                        if (!destination.exists()) {
                            failures << "${relativePath(source)}:${number}: broken link -> ${rawTarget}"
                        } else if (!anchor.isBlank() && destination.name.endsWith('.md')) {
                            def destinationAnchors = anchorsByFile.computeIfAbsent(destination.canonicalFile) {
                                markdownAnchors(destination)
                            }
                            def normalizedAnchor = java.net.URLDecoder.decode(anchor, java.nio.charset.StandardCharsets.UTF_8)
                                    .toLowerCase(Locale.ROOT)
                            if (!destinationAnchors.contains(normalizedAnchor)) {
                                failures << "${relativePath(source)}:${number}: broken anchor -> ${rawTarget}"
                            }
                        }
                    }
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("Broken Markdown links found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('validateMarkdownStructure') {
    group = 'verification'
    description = 'Validates basic Markdown document structure.'

    inputs.files(markdownDocumentationFiles())

    doLast {
        def failures = []

        inputs.files.files.sort().each { source ->
            def h1Count = 0
            def inFence = false
            source.eachLine { line, number ->
                if (line.trim().startsWith('```')) {
                    inFence = !inFence
                } else if (!inFence && line ==~ /^#\s+.+/) {
                    h1Count++
                }
                if (line ==~ /.*\s+$/) {
                    failures << "${relativePath(source)}:${number}: trailing whitespace"
                }
            }
            if (h1Count != 1) {
                failures << "${relativePath(source)}: expected exactly one top-level '# ' heading, found ${h1Count}"
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("Markdown structure issues found:\n" + failures.join('\n'))
        }
    }
}

