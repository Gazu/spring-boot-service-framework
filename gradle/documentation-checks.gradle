                'Build Lifecycle Wiring',
                'Publication Integration',
                'Multiple Contracts',
                'Compatibility Contract'
        ].each { section ->
            if (!reference.contains("## ${section}")) {
                failures << "OpenAPI plugin reference must contain section ${section}"
            }
        }

        def contractMarkers = compatibilityContract.readLines()
                .findAll {
                    (it.startsWith('- Gradle plugin ') && it.contains('|'))
                            || it.startsWith('- task=')
                }
                .collect { line ->
                    def value = line.substring(2)
                    value.contains('|')
                            ? value.substring(value.lastIndexOf('|') + 1)
                            : value.substring('task='.length())
                }
                .toSet()
        contractMarkers.sort().each { marker ->
            if (!reference.contains("`${marker}`")) {
                failures << "OpenAPI plugin reference must document contract marker ${marker}"
            }
        }

        def versions = new Properties()
        versionProperties.withInputStream { versions.load(it) }
        def frameworkVersion = versions.getProperty('frameworkVersion')
        if (!reference.contains("version '${frameworkVersion}'")) {
            failures << "OpenAPI plugin reference must apply framework plugin version ${frameworkVersion}"
        }
        if (!reference.contains("openapi-gradle-plugin:${frameworkVersion}`")) {
            failures << "OpenAPI plugin reference must document artifact version ${frameworkVersion}"
        }

        [
                '| `smbtechOpenApi.groupId` | `Property<String>` | `com.smbtech.contracts` |',
                '| `smbtechOpenApi.outputDirectory` | `DirectoryProperty` | `build/generated/smbtech-openapi` |',
                '| `smbtechOpenApi.repositoryDirectory` | `DirectoryProperty` | `build/repository/openapi` |',
                '| `smbtechOpenApi.baselineDirectory` | `DirectoryProperty` | `src/main/openapi-baselines` |',
                '| `smbtechOpenApi.publicationRepositoryUrl` | `Property<String>` | Not configured |',
                '| `smbtechOpenApi.requireBaseline` | `Property<Boolean>` | `false` |',
                '| `smbtechOpenApi.failOnBreakingChanges` | `Property<Boolean>` | `false` |',
                '| `smbtechOpenApi.publishModels` | `Property<Boolean>` | `true` |',
                '| `smbtechOpenApi.publishServerApi` | `Property<Boolean>` | `true` |',
                '| `smbtechOpenApi.publishClient` | `Property<Boolean>` | `true` |',
                '| `smbtechOpenApi.specs.<name>.input` | `RegularFileProperty` | Required |',
                '| `smbtechOpenApi.specs.<name>.artifactBaseName` | `Property<String>` | Normalized `info.title` |',
                '| `smbtechOpenApi.specs.<name>.version` | `Property<String>` | `info.version` |',
                '| `smbtechOpenApi.specs.<name>.publishModels` | `Property<Boolean>` | Global `publishModels` |',
                '| `smbtechOpenApi.specs.<name>.publishServerApi` | `Property<Boolean>` | Global `publishServerApi` |',
                '| `smbtechOpenApi.specs.<name>.publishClient` | `Property<Boolean>` | Global `publishClient` |'
        ].each { row ->
            if (!reference.contains(row)) {
                failures << "OpenAPI plugin reference must preserve default row ${row}"
            }
        }

        [
                [pluginSource, 'apply("maven-publish")'],
                [pluginSource, 'EXTENSION_NAME = "smbtechOpenApi"'],
                [extensionSource, 'convention("com.smbtech.contracts")'],
                [extensionSource, 'dir("generated/smbtech-openapi")'],
                [extensionSource, 'dir("repository/openapi")'],
                [extensionSource, 'dir("src/main/openapi-baselines")'],
                [specSource, 'public abstract RegularFileProperty getInput()'],
                [generationConfigurerSource, 'task -> task.dependsOn(ASSEMBLE_TASK_NAME)'],
                [compatibilityConfigurerSource, 'task -> task.dependsOn(compatibility)'],
                [buildLogicCheckSource, 'must enable at least one generated artifact'],
                [buildLogicCheckSource, 'must enable models when server API or client generation is enabled']
        ].each { expectation ->
            if (!expectation[0].text.contains(expectation[1])) {
                failures << "OpenAPI plugin implementation marker is missing: ${expectation[1]}"
            }
        }

        [
                'build/reports/smbtech-openapi',
                '`assemble` depends on `smbtechOpenApiAssemble`',
                '`check` depends on `smbtechOpenApiCompatibilityCheck`'
        ].each { marker ->
            if (!reference.contains(marker)) {
                failures << "OpenAPI plugin reference must document ${marker}"
            }
        }

        if (!architectureFile.text.contains(
                '| Gradle DSL, defaults, and tasks | `docs/openapi/plugin-reference.md` | Same plugin reference |')) {
            failures << 'OpenAPI documentation architecture must assign plugin ownership to plugin-reference.md'
        }
        if (!portalFile.text.contains('(plugin-reference.md)')) {
            failures << 'OpenAPI portal must link to plugin-reference.md'
        }
        if (!gettingStartedFile.text.contains('(plugin-reference.md)')) {
            failures << 'OpenAPI getting started must link to plugin-reference.md'
        }
        if (!generationFile.text.contains('(plugin-reference.md)')) {
            failures << 'OpenAPI generation reference must link to plugin-reference.md'
        }
        if (!codegenFile.text.contains('(openapi/plugin-reference.md)')) {
            failures << 'openapi-codegen.md must delegate Gradle DSL and tasks to plugin-reference.md'
        }
        if (!pluginReadme.text.contains('(../../docs/openapi/plugin-reference.md)')) {
            failures << 'OpenAPI plugin README must link to plugin-reference.md'
        }
        if (!behaviorInventory.text.contains('(openapi/plugin-reference.md)')) {
            failures << 'OpenAPI behavior inventory must link to plugin-reference.md'
        }
        if (!reference.contains('(publishing.md)')) {
            failures << 'OpenAPI plugin reference must delegate publication to publishing.md'
        }

        if (codegenFile.text.contains('| `groupId` | global/spec |')) {
            failures << 'openapi-codegen.md must not duplicate the complete Gradle property table'
        }
        if (pluginReadme.text.contains('## Configuration API')) {
            failures << 'OpenAPI plugin README must not own the complete configuration reference'
        }
        if (behaviorInventory.text.contains('### Global properties')
                || behaviorInventory.text.contains('## Public Tasks')) {
            failures << 'OpenAPI behavior inventory must not duplicate the complete plugin reference'
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    "OpenAPI Gradle plugin reference issues found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('validateOpenApiPublishingDocumentation') {
