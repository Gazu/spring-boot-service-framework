            }
        }

        [
                'smbtechOpenApiBuildLogicCheck',
                'smbtechOpenApiValidateSpecs',
                'smbtechOpenApiAssemble',
                'smbtechOpenApiPublishToLocalRepository',
                'smbtechOpenApiCompatibilityCheck'
        ].each { taskName ->
            if (!guide.contains("./gradlew ${taskName}")
                    && !guide.contains(" ${taskName}")) {
                failures << "OpenAPI getting started must invoke ${taskName}"
            }
            if (tasks.findByName(taskName) == null) {
