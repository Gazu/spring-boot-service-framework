tasks.register('validateOpenApiGettingStarted') {
    group = 'verification'
    description = 'Validates the executable OpenAPI getting-started contract.'

    def gettingStartedFile = file('docs/openapi/getting-started.md')
    def portalFile = file('docs/openapi/index.md')
    def architectureFile = file('docs/openapi/documentation-architecture.md')
    def repositoryGuide = file('docs/guides/openapi-generated-artifacts.md')
