        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    "OpenAPI generation documentation issues found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('validateModuleReadmes') {
    group = 'verification'
    description = 'Validates the required module README convention.'

    def moduleReadmePaths = [
            'spring-boot-service-framework-platform/README.md',
            'spring-boot-service-framework-actuator-core/README.md',
            'spring-boot-service-framework-commons/README.md',
            'spring-boot-service-framework-logging-core/README.md',
            'spring-boot-service-framework-http-client-core/README.md',
            'spring-boot-service-framework-mock-core/README.md',
            'spring-boot-service-framework-error-core/README.md',
            'spring-boot-service-framework-openapi-contract-testing/README.md',
            'spring-boot-service-framework-starters/spring-boot-service-framework-starter-actuator/README.md',
            'spring-boot-service-framework-starters/spring-boot-service-framework-starter-logging/README.md',
            'spring-boot-service-framework-starters/spring-boot-service-framework-starter-rest-client/README.md',
            'spring-boot-service-framework-starters/spring-boot-service-framework-starter-mock/README.md',
            'spring-boot-service-framework-starters/spring-boot-service-framework-starter-error-handling/README.md'
    ]

    inputs.files(moduleReadmePaths.collect { file(it) })

    doLast {
        def failures = []
        def requiredSections = [
                'When to use',
                'Dependency',
                'Public API',
                'What this module does not do',
                'Main documentation',
                'Local validation'
        ]
        def currentVersion = rootProject.version.toString()

        moduleReadmePaths.each { path ->
            def source = file(path)
            if (!source.isFile()) {
                failures << "missing module README: ${path}"
                return
            }

            def lines = source.readLines()
            def h1Lines = []
            def h2Sections = [:]
            def firstH2Index = -1
            def inFence = false

            lines.eachWithIndex { line, index ->
                if (line.trim().startsWith('```')) {
                    inFence = !inFence
                } else if (!inFence) {
                    if (line ==~ /^#\s+.+/) {
                        h1Lines << index
                    } else {
                        def matcher = line =~ /^##\s+(.+?)\s*$/
                        if (matcher.matches()) {
                            if (firstH2Index < 0) {
                                firstH2Index = index
                            }
                            h2Sections[matcher[0][1]] = index
                        }
                    }
                }
            }

            if (h1Lines.size() != 1) {
                failures << "${path}: expected exactly one H1 heading, found ${h1Lines.size()}"
            }
            if (firstH2Index <= 1 || lines.subList(1, Math.max(1, firstH2Index)).join('\n').trim().isBlank()) {
                failures << "${path}: expected an introductory paragraph before the first H2"
            }

            def previousIndex = -1
            requiredSections.each { section ->
                def index = h2Sections[section]
                if (index == null) {
                    failures << "${path}: missing required section '## ${section}'"
                } else if (index <= previousIndex) {
                    failures << "${path}: section '## ${section}' must appear after the previous required section"
                } else {
                    previousIndex = index
                }
            }

            def text = source.text
            def artifactMatches = text =~ /com\.smbtech:[A-Za-z0-9_.-]+:([0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?)/
            if (!artifactMatches.find()) {
                failures << "${path}: dependency section must include a com.smbtech artifact version"
            } else {
                artifactMatches.reset()
                artifactMatches.each { match ->
                    if (match[1] != currentVersion) {
                        failures << "${path}: dependency version must be ${currentVersion}, found ${match[1]}"
                    }
                }
            }

            if (!text.contains('./gradlew')) {
                failures << "${path}: local validation section must include a Gradle command"
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("Module README convention issues found:\n" + failures.join('\n'))
        }
    }
}


tasks.register('validateExampleSecrets') {
    group = 'verification'
    description = 'Scans example documentation and configuration for accidentally committed secrets.'

    inputs.files(fileTree('examples') {
        include '**/*.md'
        include '**/*.gradle'
        include '**/*.properties'
        include '**/*.yml'
        include '**/*.yaml'
        exclude '**/.gradle/**'
        exclude '**/.idea/**'
        exclude '**/build/**'
    })

    doLast {
        def failures = []
        def rules = [
                [
                        name   : 'private key material',
                        pattern: ~/(?i)-----BEGIN (RSA |EC |OPENSSH |)?PRIVATE KEY-----/
                ],
                [
                        name   : 'internal endpoint',
                        pattern: ~/(?i)https?:\/\/[^\s'"]*smb-tech\.[^\s'"]*/
                ],
                [
                        name   : 'long inline secret-like value',
                        pattern: ~/(?i)^\s*([A-Z0-9_]*(PASSWORD|SECRET|TOKEN|KEYSTORE|PRIVATE_KEY|KEY)[A-Z0-9_]*|base64|password|key-password|client-secret)\s*[:=]\s*(?!\$\{)[A-Za-z0-9+\/=]{40,}\s*$/
                ],
                [
                        name   : 'literal secret property',
                        pattern: ~/(?i)^\s*(client-secret|password|key-password|value)\s*[:=]\s*(?!\$\{)(?!change-me\b)(?!example\b)[^#\s].*$/
                ]
        ]

        inputs.files.files.sort().each { source ->
            source.eachLine { line, number ->
                rules.each { rule ->
                    if ((line =~ rule.pattern).find()) {
                        failures << "${rootDir.toPath().relativize(source.toPath())}:${number}: ${rule.name}"
                    }
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("Potential secrets found in examples:\n" + failures.join('\n'))
        }
    }
}

tasks.register('validateExampleApplicationConfig') {
    group = 'verification'
    description = 'Ensures example application config files keep real values out of source control.'

    inputs.files(fileTree('examples') {
        include '**/src/main/resources/application*.properties'
        include '**/src/main/resources/application*.yml'
        include '**/src/main/resources/application*.yaml'
        exclude '**/build/**'
    })

    doLast {
        def failures = []
        def topLevelEnvironmentAssignment = ~/^[A-Z][A-Z0-9_]+:\s+(?!\$\{).+/
        def uuidClientId = ~/(?i)(client-id|CLIENT_ID)\s*[:=]\s*[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/

        inputs.files.files.sort().each { source ->
            source.eachLine { line, number ->
                if ((line =~ topLevelEnvironmentAssignment).find()) {
                    failures << "${rootDir.toPath().relativize(source.toPath())}:${number}: top-level environment value must not be committed"
                }
                if ((line =~ uuidClientId).find()) {
                    failures << "${rootDir.toPath().relativize(source.toPath())}:${number}: literal client id must use an environment placeholder"
                }
                if (line.length() > 500) {
                    failures << "${rootDir.toPath().relativize(source.toPath())}:${number}: oversized line may contain encoded secret material"
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("Unsafe example application config found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('validatePreOneMigrationDocumentation') {
    group = 'verification'
    description = 'Validates pre-1.0 binary exceptions and their consumer migration guidance.'

    def migrationGuide = file('docs/guides/migrate-public-names-and-properties.md')
    def apiPolicy = file('docs/pre-1.0-api-policy.md')
    def changelog = file('CHANGELOG.md')
    def approvedBreaks = file('gradle/compatibility/binary-breaking-changes.txt')

    inputs.files(migrationGuide, apiPolicy, changelog, approvedBreaks)

    doLast {
        def failures = []
        def guideText = migrationGuide.text
        def policyText = apiPolicy.text
        def changelogText = changelog.text
        def entries = approvedBreaks.readLines()
                .collect { it.trim() }
                .findAll { !it.isEmpty() && !it.startsWith('#') }

        def duplicates = entries.countBy { it }.findAll { entry, count -> count > 1 }.keySet()
        duplicates.each { entry ->
            failures << "duplicate binary compatibility exception: ${entry}"
        }

        entries.each { entry ->
            def separator = entry.indexOf('|')
            if (separator < 1 || separator == entry.length() - 1) {
                failures << "invalid binary compatibility exception: ${entry}"
                return
            }

            def member = entry.substring(separator + 1)
            def owner = member.contains('#') ? member.substring(0, member.indexOf('#')) : member
            def simpleName = owner.substring(owner.lastIndexOf('.') + 1)
            if (!guideText.contains("`${simpleName}`")) {
                failures << "migration guide must document binary exception owner ${simpleName}"
            }
        }

        [
                'tools.jackson',
                'JwtBearerTokenRequest',
                'ErrorReporter.composite',
                'NotificationAggregationPolicy.defaultPolicy',
                'RestClientBuilderCustomizer',
                'OpenApiArtifactKind',
                'HexagonalProjectGenerator.create',
                'FrameworkDiagnostics.from'
        ].each { marker ->
            if (!guideText.contains(marker)) {
                failures << "migration guide must document ${marker}"
            }
        }

        def migrationLink = '[Pre-1.0 Migration Guide](guides/migrate-public-names-and-properties.md)'
        if (!policyText.contains(migrationLink)) {
            failures << 'pre-1.0 API policy must link to the migration guide'
        }
        if (!changelogText.toLowerCase(Locale.ROOT).contains('pre-1.0 migration guide')) {
            failures << 'CHANGELOG.md must mention the pre-1.0 migration guide'
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    "Pre-1.0 migration documentation issues found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('validateOpenApiExamplesAndTroubleshooting') {
    group = 'verification'
    description = 'Validates OpenAPI examples and troubleshooting against repository fixtures and diagnostics.'

    def examplesFile = file('docs/openapi/examples.md')
    def troubleshootingFile = file('docs/openapi/troubleshooting.md')
    def generalTroubleshootingFile = file('docs/troubleshooting.md')
    def portalFile = file('docs/openapi/index.md')
    def architectureFile = file('docs/openapi/documentation-architecture.md')
    def rootBuildFile = file('build.gradle')
    def contracts = [
            [
                    name      : 'Merchant Order Status',
                    registration: 'merchantOrderStatus',
                    path      : 'docs/openapi/merchant-order-status.yaml',
                    baseline  : 'docs/openapi-baselines/merchant-order-status/1.1.0.yaml',
                    title     : 'merchant-order-status',
                    version   : '1.1.0',
                    operations: ['getOrderStatus']
            ],
            [
                    name      : 'Retail Loyalty Rewards',
                    registration: 'retailLoyaltyRewards',
                    path      : 'docs/openapi/retail-loyalty-rewards.yaml',
                    baseline  : 'docs/openapi-baselines/retail-loyalty-rewards/1.0.0.yaml',
                    title     : 'retail-loyalty-rewards',
                    version   : '1.0.0',
                    operations: ['getMemberRewardsSummary', 'getVoucher']
            ],
            [
                    name      : 'Warehouse Inventory Catalog',
                    registration: 'warehouseInventoryCatalog',
                    path      : 'docs/openapi/warehouse-inventory-catalog.yaml',
                    baseline  : 'docs/openapi-baselines/warehouse-inventory-catalog/1.0.0.yaml',
                    title     : 'warehouse-inventory-catalog',
                    version   : '1.0.0',
                    operations: ['getWarehouseInventoryItem']
            ]
    ]
    def diagnosticSources = [
            'build-logic/openapi-generator-plugin/src/main/java/com/smbtech/serviceframework/gradle/openapi/SmbtechOpenApiValidateSpecsTask.java',
            'build-logic/openapi-generator-plugin/src/main/java/com/smbtech/serviceframework/gradle/openapi/SmbtechOpenApiBreakingChangeTask.java',
            'build-logic/openapi-generator-plugin/src/main/java/com/smbtech/serviceframework/gradle/openapi/SmbtechOpenApiReproducibilityTask.java',
            'build-logic/openapi-generator-plugin/src/main/java/com/smbtech/serviceframework/gradle/openapi/SmbtechOpenApiConsumerCompatibilityTask.java',
            'build-logic/openapi-generator-plugin/src/main/java/com/smbtech/serviceframework/gradle/openapi/SmbtechOpenApiMockContractTask.java',
            'spring-boot-service-framework-project-generator/src/main/java/com/smbtech/serviceframework/project/generator/ContractDescriptorLoader.java',
            'spring-boot-service-framework-project-generator/src/main/java/com/smbtech/serviceframework/project/generator/DefaultHexagonalProjectGenerator.java',
            'spring-boot-service-framework-openapi-contract-testing/src/main/java/com/smbtech/serviceframework/openapi/contract/OpenApiContractViolationCode.java'
    ]

    inputs.files(
            examplesFile,
            troubleshootingFile,
            generalTroubleshootingFile,
            portalFile,
            architectureFile,
            rootBuildFile,
            contracts.collectMany { [file(it.path), file(it.baseline)] },
            file('docs/openapi-baselines/merchant-order-status/1.0.0.yaml'),
            diagnosticSources.collect { file(it) }
    )

    doLast {
        def failures = []
        def examples = examplesFile.text
        def troubleshooting = troubleshootingFile.text
        def generalTroubleshooting = generalTroubleshootingFile.text
        def implementation = diagnosticSources.collect { file(it).text }.join('\n')
        def rootBuild = rootBuildFile.text

        [
                'Example Matrix',
                'Run All Examples',
                'Merchant Order Status',
                'Retail Loyalty Rewards',
                'Warehouse Inventory Catalog',
                'Inspect Generated Artifacts',
                'Add An Example',
                'Validation'
        ].each { section ->
            if (!examples.contains("## ${section}")) {
                failures << "OpenAPI examples must contain section ${section}"
            }
        }

        contracts.each { contract ->
            def spec = file(contract.path)
            def baseline = file(contract.baseline)
            if (!examples.contains(contract.name)
                    || !examples.contains("(${spec.name})")
                    || !examples.contains(contract.version)) {
                failures << "OpenAPI examples must document ${contract.name} ${contract.version}"
            }
            if (!rootBuild.contains("register('${contract.registration}')")) {
                failures << "root build must register OpenAPI example ${contract.registration}"
            }
            if (!spec.text.contains("title: ${contract.title}")
                    || !spec.text.contains("version: '${contract.version}'")) {
                failures << "${contract.path} must preserve documented title and version"
            }
            contract.operations.each { operation ->
                if (!spec.text.contains("operationId: ${operation}")) {
                    failures << "${contract.path} must contain operation ${operation}"
                }
                if (!examples.contains(operation)) {
                    failures << "OpenAPI examples must document operation ${operation}"
                }
            }
            if (!java.util.Arrays.equals(spec.bytes, baseline.bytes)) {
                failures << "${contract.baseline} must be byte-identical to the current contract"
            }
        }

        def previousMerchant = file('docs/openapi-baselines/merchant-order-status/1.0.0.yaml').text
        def currentMerchant = file('docs/openapi/merchant-order-status.yaml').text
        if (previousMerchant.contains('updatedAt') || !currentMerchant.contains('updatedAt')) {
            failures << 'Merchant Order Status must demonstrate the documented optional updatedAt addition'
        }

        [
                'nine binary JARs and nine source JARs',
                'build/reports/smbtech-openapi/diff/merchant-order-status.md',
                'build/reports/smbtech-openapi/reproducibility.sha256',
                'build/reports/smbtech-openapi/consumer-test.txt',
                'build/reports/smbtech-openapi/mock-contracts.properties',
                './gradlew validateOpenApiExamplesAndTroubleshooting'
        ].each { marker ->
            if (!examples.contains(marker)) {
                failures << "OpenAPI examples must document ${marker}"
            }
        }

        [
                'Fast Triage',
                'Evidence Map',
                'Configuration Failures',
                'Document And Coordinate Failures',
                'Generation And Compilation Failures',
                'Baseline And SemVer Failures',
                'Reproducibility Failures',
                'Consumer And Mock Failures',
                'Publication Failures',
                'Scaffolding Failures',
                'Contract Test Failures',
                'CI Diagnostics',
                'Validation'
        ].each { section ->
            if (!troubleshooting.contains("## ${section}")) {
                failures << "OpenAPI troubleshooting must contain section ${section}"
            }
        }

        [
                'OpenAPI spec validation issues found:',
                'missing exact baseline for version',
                'contains duplicate entries',
                'generated JAR is missing',
                'mock server requires at least one numeric response',
                'embedded contract metadata is missing',
                'Refusing to replace unsafe output directory'
        ].each { marker ->
            if (!implementation.contains(marker)) {
                failures << "OpenAPI implementation diagnostic is missing: ${marker}"
            }
            if (!troubleshooting.contains(marker)) {
                failures << "OpenAPI troubleshooting must document diagnostic: ${marker}"
            }
        }

        [
                'UNKNOWN_OPERATION',
                'MISSING_TEST_CASE',
                'MISSING_PATH_PARAMETER',
                'MISSING_REQUEST_PARAMETER',
                'UNDECLARED_REQUEST_BODY',
                'UNDECLARED_REQUEST_CONTENT_TYPE',
                'INVALID_JSON_REQUEST',
                'REQUEST_SCHEMA_MISMATCH',
                'UNEXPECTED_STATUS',
                'UNDECLARED_STATUS',
                'UNDECLARED_CONTENT_TYPE',
                'INVALID_JSON_RESPONSE',
                'RESPONSE_SCHEMA_MISMATCH'
        ].each { code ->
            if (!implementation.contains(code) || !troubleshooting.contains(code)) {
                failures << "OpenAPI troubleshooting must track contract violation ${code}"
            }
        }

        if (!portalFile.text.contains('(examples.md)')
                || !portalFile.text.contains('(troubleshooting.md)')) {
            failures << 'OpenAPI portal must link to examples and troubleshooting'
        }
        if (!generalTroubleshooting.contains('(openapi/troubleshooting.md)')) {
            failures << 'General troubleshooting must delegate OpenAPI failures to the canonical guide'
        }
        [
                '`smbtechOpenApiValidateSpecs` fails',
                '`smbtechOpenApiBreakingChangeCheck` reports',
                '`smbtechOpenApiCompatibilityCheck` fails'
        ].each { duplicate ->
            if (generalTroubleshooting.contains(duplicate)) {
                failures << "General troubleshooting must not duplicate ${duplicate}"
            }
        }
        if (!architectureFile.text.contains(
                '| Executable repository examples and expected evidence | `docs/openapi/examples.md` | Same examples guide |')
                || !architectureFile.text.contains(
                '| OpenAPI-specific failure diagnosis | `docs/openapi/troubleshooting.md` | Same troubleshooting guide |')) {
            failures << 'OpenAPI documentation architecture must assign examples and troubleshooting ownership'
        }

        [
                'smbtechOpenApiBuildLogicCheck',
                'smbtechOpenApiValidateSpecs',
                'smbtechOpenApiAssemble',
                'smbtechOpenApiCompatibilityCheck',
                'smbtechOpenApiBreakingChangeCheck',
                'smbtechOpenApiReproducibilityCheck',
                'smbtechOpenApiConsumerTest',
                'smbtechOpenApiMockContractCheck'
        ].each { taskName ->
            if (tasks.findByName(taskName) == null) {
                failures << "documented OpenAPI task is not registered: ${taskName}"
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    "OpenAPI examples and troubleshooting issues found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('validateOpenApiDocumentationCommands') {
    group = 'verification'
    description = 'Validates every Gradle command published in canonical OpenAPI documentation.'

    def documentationFiles = files(
            fileTree('docs/openapi') {
                include '**/*.md'
            },
            file('docs/openapi-codegen.md'),
            file('docs/openapi-behavior-inventory.md'),
            file('docs/openapi-contract-testing.md'),
            fileTree('docs/guides') {
                include '*openapi*.md'
            },
            file('build-logic/openapi-generator-plugin/README.md'),
            file('build-logic/openapi-templates/README.md'),
            file('spring-boot-service-framework-openapi-contract-testing/README.md'),
            file('spring-boot-service-framework-project-generator/README.md')
    )
    def reportFile = layout.buildDirectory.file(
            'reports/smbtech-openapi/documentation-check.txt')
    def includedBuildSettings = file('build-logic/settings.gradle')

    inputs.files(documentationFiles, includedBuildSettings)
    outputs.file(reportFile)

    doLast {
        def failures = []
        def commands = []
        def checkedTasks = [] as Set

        documentationFiles.files.sort().each { source ->
            def lines = source.readLines()
            for (int lineIndex = 0; lineIndex < lines.size(); lineIndex++) {
                def line = lines[lineIndex]
                int wrapperIndex = line.indexOf('./gradlew')
                if (wrapperIndex < 0) {
                    continue
                }

                def command = line.substring(wrapperIndex)
                int inlineEnd = command.indexOf('`')
                if (inlineEnd >= 0) {
                    command = command.substring(0, inlineEnd)
                } else {
                    while (command.trim().endsWith('\\') && lineIndex + 1 < lines.size()) {
                        command = command.trim().substring(0, command.trim().length() - 1)
                        lineIndex++
                        command += ' ' + lines[lineIndex].trim()
                    }
                }
                commands << [source: source, line: lineIndex + 1, text: command.trim()]
            }
        }

        if (commands.isEmpty()) {
            failures << 'canonical OpenAPI documentation must contain executable Gradle commands'
        }

        commands.each { command ->
            def tokens = command.text.split(/\s+/) as List
            def projectDirectory = null
            for (int tokenIndex = 1; tokenIndex < tokens.size(); tokenIndex++) {
                def token = tokens[tokenIndex]
                        .replaceAll(/^[`'\"]+|[`'\".,;:]+$/, '')
                if (token in ['-p', '--project-dir']) {
                    if (tokenIndex + 1 >= tokens.size()) {
                        failures << "${relativePath(command.source)}:${command.line}: ${token} requires a directory"
                        break
                    }
                    projectDirectory = tokens[++tokenIndex]
                            .replaceAll(/^[`'\"]+|[`'\".,;]+$/, '')
                    continue
                }
                if (token.startsWith('-') || token.isBlank()) {
                    continue
                }

                if (projectDirectory != null) {
                    if (projectDirectory != 'build-logic') {
                        failures << "${relativePath(command.source)}:${command.line}: unsupported documented project directory ${projectDirectory}"
                        continue
                    }
                    int separator = token.lastIndexOf(':')
                    def projectPath = separator > 0 ? token.substring(0, separator) : ''
                    def taskName = separator >= 0 ? token.substring(separator + 1) : token
                    def assignmentPrefix = "project('${projectPath}').projectDir = file('"
                    def assignment = includedBuildSettings.readLines().find {
                        it.trim().startsWith(assignmentPrefix)
                    }
                    def projectFolder = projectPath.substring(1).replace(':', '/')
                    if (assignment != null) {
                        def assignedFolder = assignment.trim()
                                .substring(assignmentPrefix.length())
                        projectFolder = assignedFolder.substring(0, assignedFolder.indexOf("')"))
                    }
                    if (projectPath.isBlank()
                            || !file("build-logic/${projectFolder}/build.gradle").isFile()
                            || taskName != 'check') {
                        failures << "${relativePath(command.source)}:${command.line}: unknown included-build task ${token}"
                    } else {
                        checkedTasks << "build-logic${token}"
                    }
                    continue
                }

                if (token.startsWith(':')) {
                    int separator = token.lastIndexOf(':')
                    def projectPath = token.substring(0, separator)
                    def taskName = token.substring(separator + 1)
                    def targetProject = project.findProject(projectPath)
                    if (targetProject == null || targetProject.tasks.findByName(taskName) == null) {
                        failures << "${relativePath(command.source)}:${command.line}: unknown Gradle task ${token}"
                    } else {
                        checkedTasks << token
                    }
                } else if (token == 'test'
                        && relativePath(command.source).startsWith('docs/guides/')) {
                    checkedTasks << 'consumer:test'
                } else if (tasks.findByName(token) == null) {
                    failures << "${relativePath(command.source)}:${command.line}: unknown Gradle task ${token}"
                } else {
                    checkedTasks << token
                }
            }
        }

        def requiredTasks = [
                'documentationCheck',
                'openApiDocumentationCompatibilityCheck',
                'smbtechOpenApiBuildLogicCheck',
                'smbtechOpenApiValidateSpecs',
                'smbtechOpenApiAssemble',
                'smbtechOpenApiCompatibilityCheck',
                'smbtechOpenApiPublishToLocalRepository',
                ':spring-boot-service-framework-openapi-contract-testing:check',
                ':spring-boot-service-framework-project-generator:scaffoldingCompatibilityCheck'
        ]
        requiredTasks.each { taskName ->
            if (!checkedTasks.contains(taskName)) {
                failures << "canonical OpenAPI documentation must publish command ${taskName}"
            }
        }

        def report = reportFile.get().asFile
        report.parentFile.mkdirs()
        report.text = """\
status=${failures.isEmpty() ? 'compatible' : 'failed'}
documents=${documentationFiles.files.size()}
commands=${commands.size()}
tasks=${checkedTasks.size()}
${failures.collect { "failure=${it}" }.join('\n')}
"""

        if (!failures.isEmpty()) {
            throw new GradleException(
                    "OpenAPI documentation command issues found:\n" + failures.join('\n'))
        }
    }
}

