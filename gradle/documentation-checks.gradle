                'Contract Identity',
                'Baseline Layout',
                'Exact Baseline',
                'Previous Baseline Selection',
                'Semantic Version Policy',
                'Change Classification',
                'Strict Mode',
                'Contract Update Workflow',
                'Reports',
                'Failure Modes',
                'Current Limits',
                'Validation'
        ].each { section ->
            if (!reference.contains("## ${section}")) {
                failures << "OpenAPI versioning reference must contain section ${section}"
            }
        }

        [
                'info.version',
                'info.title',
                'smbtechOpenApi.specs.<name>.version',
                'artifactBaseName',
                'smbtechOpenApi.baselineDirectory',
                'smbtechOpenApi.requireBaseline',
                'smbtechOpenApi.failOnBreakingChanges',
                'src/main/openapi-baselines',
                'docs/openapi-baselines',
                'smbtechOpenApiBreakingChangeCheck',
                'smbtechOpenApiCompatibilityCheck',
                'openApiFailOnBreakingChanges',
                'build/reports/smbtech-openapi/diff/',
