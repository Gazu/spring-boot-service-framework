    def portalFile = file('docs/openapi/index.md')
    def codegenFile = file('docs/openapi-codegen.md')
    def pluginReference = file('docs/openapi/plugin-reference.md')
    def behaviorInventory = file('docs/openapi-behavior-inventory.md')
    def generationFile = file('docs/openapi/generation.md')
    def gettingStartedFile = file('docs/openapi/getting-started.md')
    def artifactGuide = file('docs/guides/openapi-generated-artifacts.md')

    inputs.files(
            publishingFile,
            compatibilityContract,
            pluginSource,
            generationConfigurerSource,
            buildLogicCheckSource,
            lifecycleSource,
            architectureFile,
            portalFile,
            codegenFile,
            pluginReference,
            behaviorInventory,
            generationFile,
            gettingStartedFile,
            artifactGuide
    )

    doLast {
        def failures = []
        def guide = publishingFile.text
        def generationSource = generationConfigurerSource.text

        [
                'Publication Contract',
                'Before Publishing',
                'Local Publication',
                'Consume Local Artifacts',
                'Remote Publication',
                'Credentials',
                'CI Publication',
                'Version Immutability',
                'Failure Modes',
                'Validation'
        ].each { section ->
            if (!guide.contains("## ${section}")) {
                failures << "OpenAPI publishing guide must contain section ${section}"
            }
        }

        [
                '<group>:<name>-models:<version>',
                '<group>:<name>-server-api:<version>',
                '<group>:<name>-client:<version>',
                'smbtechOpenApiPublishToLocalRepository',
                'smbtechOpenApiPublish',
                'smbtechOpenApiCompatibilityCheck',
                'smbtechOpenApi.repositoryDirectory',
                'smbtechOpenApi.publicationRepositoryUrl',
                'build/repository/openapi',
                'smbtechOpenApiLocal',
                'smbtechOpenApiRemote',
                'openApiRepositoryUsername',
                'OPENAPI_REPOSITORY_USERNAME',
                'openApiRepositoryPassword',
                'OPENAPI_REPOSITORY_PASSWORD',
                'OPENAPI_REPOSITORY_URL',
                'warehouse-inventory-catalog-models-1.0.0.jar',
                'warehouse-inventory-catalog-models-1.0.0-sources.jar',
                'warehouse-inventory-catalog-models-1.0.0.pom',
                'warehouse-inventory-catalog-models-1.0.0.module',
                '`.sha256`',
                '~/.gradle/gradle.properties',
                'file:///absolute/path/to/contract-project/build/repository/openapi',
                'publishLocalArtifacts'
        ].each { marker ->
            if (!guide.contains(marker)) {
                failures << "OpenAPI publishing guide must document ${marker}"
            }
        }

        [
                [pluginSource, 'apply("maven-publish")'],
                [generationConfigurerSource, 'PUBLISH_LOCAL_TASK_NAME = "smbtechOpenApiPublishToLocalRepository"'],
                [generationConfigurerSource, 'PUBLISH_REMOTE_TASK_NAME = "smbtechOpenApiPublish"'],
                [generationConfigurerSource, 'repository.setName("smbtechOpenApiLocal")'],
                [generationConfigurerSource, 'repository.setName("smbtechOpenApiRemote")'],
                [generationConfigurerSource, 'gradleProperty("openApiRepositoryUsername")'],
                [generationConfigurerSource, '"OPENAPI_REPOSITORY_USERNAME"'],
                [generationConfigurerSource, 'gradleProperty("openApiRepositoryPassword")'],
                [generationConfigurerSource, '"OPENAPI_REPOSITORY_PASSWORD"'],
                [generationConfigurerSource, 'publication.artifact(sourcesJar)'],
                [generationConfigurerSource, 'publication.getPom()'],
                [generationConfigurerSource, 'Apache License, Version 2.0'],
                [generationConfigurerSource, 'equals("smbtechOpenApiRemote")'],
                [generationConfigurerSource, 'publicationRepositoryUrl is required for remote publication'],
                [buildLogicCheckSource, 'publicationRepositoryUrl must be an absolute URI'],
                [lifecycleSource, "tasks.named('smbtechOpenApiPublishToLocalRepository')"]
        ].each { expectation ->
            if (!expectation[0].text.contains(expectation[1])) {
                failures << "OpenAPI publication implementation marker is missing: ${expectation[1]}"
            }
        }

        [
                'smbtechOpenApi.publicationRepositoryUrl',
                'smbtechOpenApi.repositoryDirectory',
                'smbtechOpenApiPublish',
                'smbtechOpenApiPublishToLocalRepository'
        ].each { marker ->
            if (!compatibilityContract.text.contains(marker)) {
                failures << "OpenAPI publication compatibility contract must protect ${marker}"
            }
        }

        if (generationSource.contains('smbtechOpenApiCompatibilityCheck')) {
            failures << 'publication task wiring must not silently absorb the explicit compatibility gate'
        }
        if (!guide.contains('it does not run\n`smbtechOpenApiCompatibilityCheck` automatically')) {
            failures << 'OpenAPI publishing guide must state that publication does not run compatibility automatically'
        }
        if (!guide.contains('1. Gradle project property.')
                || !guide.contains('2. Environment variable.')) {
            failures << 'OpenAPI publishing guide must document credential precedence'
        }

        if (!architectureFile.text.contains(
                '| Maven publication and credentials | `docs/openapi/publishing.md` | Same publishing guide |')) {
            failures << 'OpenAPI documentation architecture must assign publication to publishing.md'
        }
        [
                [portalFile, '(publishing.md)'],
                [codegenFile, '(openapi/publishing.md)'],
                [pluginReference, '(publishing.md)'],
                [behaviorInventory, '(openapi/publishing.md)'],
                [generationFile, '(publishing.md)'],
                [gettingStartedFile, '(publishing.md)'],
                [artifactGuide, '(../openapi/publishing.md)']
        ].each { expectation ->
            if (!expectation[0].text.contains(expectation[1])) {
                failures << "${relativePath(expectation[0])} must link to publishing.md"
            }
        }

        [codegenFile, pluginReference, behaviorInventory].each { secondary ->
            if (secondary.text.contains('openApiRepositoryUsername')
                    || secondary.text.contains('OPENAPI_REPOSITORY_PASSWORD')) {
                failures << "${relativePath(secondary)} must not duplicate publication credentials"
            }
        }
        if (codegenFile.text.contains('./gradlew smbtechOpenApiPublish')) {
            failures << 'openapi-codegen.md must delegate publication commands to publishing.md'
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    "OpenAPI publishing documentation issues found:\n" + failures.join('\n'))
        }
    }
}

