    inputs.files(
            gettingStartedFile,
            portalFile,
            architectureFile,
            repositoryGuide,
            contractFile,
            versionProperties
    )

    doLast {
        def failures = []
        def guide = gettingStartedFile.text
        def versions = new Properties()
        versionProperties.withInputStream { versions.load(it) }
        def frameworkVersion = versions.getProperty('frameworkVersion')

        [
                'Before You Start',
                '1. Create The Contract',
                '2. Apply And Configure The Plugin',
                '3. Validate The Contract',
                '4. Generate The Artifacts',
                '5. Publish Locally',
                '6. Implement The Server API',
                '7. Consume The HTTP Client',
                '8. Run The Compatibility Gate',
                'Expected Result'
        ].each { section ->
            if (!guide.contains("## ${section}")) {
                failures << "OpenAPI getting started must contain section ${section}"
            }
        }

        [
                'com.smbtech.service-framework.openapi-generator',
                "version '${frameworkVersion}'",
                'src/main/openapi/warehouse-inventory-catalog.yaml',
                "title: warehouse-inventory-catalog",
                "version: '1.0.0'",
                'operationId: getWarehouseInventoryItem',
                "register('warehouseInventoryCatalog')",
                'com.smbtech.contracts:warehouse-inventory-catalog-models:1.0.0',
                'com.smbtech.contracts:warehouse-inventory-catalog-server-api:1.0.0',
