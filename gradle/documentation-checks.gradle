                'OpenAPI compatibility checks passed',
                'No earlier baseline was found',
                'current contract differs from its immutable',
                'compatible additions require a minor or major version increase',
                'breaking changes require a major version increase',
                'strict mode rejects breaking changes',
                '0.4.0',
                '1.0.0',
                'Pre-release and build suffixes',
                'does not reject that divergence',
                'overrides are not used for baseline\n  identity or SemVer comparison'
        ].each { marker ->
            if (!reference.contains(marker)) {
                failures << "OpenAPI versioning reference must document ${marker}"
            }
        }

        [
                [contractReaderSource, 'ARTIFACT_VERSION'],
                [contractReaderSource, 'normalizeTitle(String title)'],
                [compatibilitySupportSource, 'SEMANTIC_VERSION'],
                [compatibilitySupportSource, 'exactBaseline(Path root'],
                [compatibilitySupportSource, 'previousBaseline(Path root'],
                [compatibilitySupportSource, 'baseline.version().compareTo(currentVersion) < 0'],
                [compatibilitySupportSource, 'sha256(Path source)'],
                [compatibilitySupportSource, 'boolean isMajorIncreaseFrom'],
                [compatibilitySupportSource, 'boolean isMinorOrMajorIncreaseFrom'],
                [breakingTaskSource, 'OpenApiCompatibilitySupport.sha256(exact)'],
                [breakingTaskSource, 'new MarkdownRender().render(difference, writer)'],
                [breakingTaskSource, 'No earlier baseline was found.'],
                [breakingTaskSource, 'currentVersion.isMajorIncreaseFrom(previousVersion)'],
                [breakingTaskSource, 'currentVersion.isMinorOrMajorIncreaseFrom(previousVersion)'],
                [breakingTaskSource, 'getFailOnBreakingChanges().get()'],
                [extensionSource, 'dir("src/main/openapi-baselines")'],
                [extensionSource, 'getRequireBaseline()'],
                [extensionSource, 'getFailOnBreakingChanges()'],
                [compatibilityConfigurerSource, 'reports/smbtech-openapi/diff'],
                [rootBuild, "gradleProperty('openApiFailOnBreakingChanges')"],
                [rootBuild, "dir('docs/openapi-baselines')"]
        ].each { expectation ->
            if (!expectation[0].text.contains(expectation[1])) {
                failures << "OpenAPI versioning implementation marker is missing: ${expectation[1]}"
            }
        }

        [
                'smbtechOpenApi.baselineDirectory',
                'smbtechOpenApi.requireBaseline',
                'smbtechOpenApi.failOnBreakingChanges',
                'smbtechOpenApiBreakingChangeCheck',
                'smbtechOpenApiCompatibilityCheck'
        ].each { marker ->
            if (!compatibilityContract.text.contains(marker)) {
                failures << "OpenAPI compatibility contract must protect versioning marker ${marker}"
            }
        }

        if (!architectureFile.text.contains(
                '| Coordinates, SemVer, baselines, and breaking changes | `docs/openapi/versioning.md` | Same versioning reference |')) {
            failures << 'OpenAPI documentation architecture must assign versioning to versioning.md'
        }
        [
                [portalFile, '(versioning.md)'],
                [codegenFile, '(openapi/versioning.md)'],
                [pluginReference, '(versioning.md)'],
                [publishingFile, '(versioning.md)'],
                [behaviorInventory, '(openapi/versioning.md)'],
                [gettingStartedFile, '(versioning.md)'],
                [breakingGuide, '(../openapi/versioning.md)'],
                [artifactGuide, '(../openapi/versioning.md)']
        ].each { expectation ->
            if (!expectation[0].text.contains(expectation[1])) {
                failures << "${relativePath(expectation[0])} must link to versioning.md"
            }
        }

        if (file('docs/openapi-breaking-changes.md').exists()) {
            failures << 'legacy docs/openapi-breaking-changes.md must remain removed'
        }
        markdownDocumentationFiles().files.sort().each { source ->
            if (source.text.contains('(openapi-breaking-changes.md)')
                    || source.text.contains('(../openapi-breaking-changes.md)')
                    || source.text.contains('(docs/openapi-breaking-changes.md)')) {
                failures << "${relativePath(source)} must not link to the retired versioning document"
            }
        }
        if (codegenFile.text.contains('A baseline is optional for a new contract')) {
            failures << 'openapi-codegen.md must not duplicate the canonical baseline policy'
        }
        if (behaviorInventory.text.contains('Baselines live under `smbtechOpenApi.baselineDirectory`')) {
            failures << 'OpenAPI behavior inventory must delegate baseline policy to versioning.md'
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    "OpenAPI versioning documentation issues found:\n" + failures.join('\n'))
        }
    }
}

