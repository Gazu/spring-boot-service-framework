            }
        }

        def repositoryContract = contractFile.text
        [
                'title: warehouse-inventory-catalog',
                "version: '1.0.0'",
                'operationId: getWarehouseInventoryItem'
        ].each { marker ->
            if (!repositoryContract.contains(marker)) {
                failures << "repository getting-started fixture must contain ${marker}"
            }
        }

        if (!portalFile.text.contains('(getting-started.md)')) {
            failures << 'OpenAPI portal must link to getting-started.md'
        }
        if (!repositoryGuide.text.contains('(../openapi/getting-started.md)')) {
            failures << 'generated-artifacts guide must link to OpenAPI getting started'
        }
        if (!architectureFile.text.contains(
                '| Minimal end-to-end adoption | `docs/openapi/getting-started.md` | Same getting-started guide |')) {
            failures << 'OpenAPI documentation architecture must assign minimal adoption to getting started'
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    "OpenAPI getting-started issues found:\n" + failures.join('\n'))
        }
    }
}

