            tasks.named('validateOpenApiMetadata'),
            tasks.named('validateOpenApiAdvancedModelGeneration'),
            tasks.named('validateOpenApiModelsJar'),
            tasks.named('validateOpenApiServerApiJar'),
            tasks.named('validateOpenApiClientJar'),
            tasks.named('validateOpenApiArtifactSeparation'),
            tasks.named('validateOpenApiReproducibleGeneration'),
            tasks.named('validateOpenApiCompilationTests'),
            tasks.named('openApiBreakingChangeCheck'),
            tasks.named('validateOpenApiTaskCompatibility'),
            tasks.named('validateExampleSecrets'),
            tasks.named('validateExampleApplicationConfig')
    )
}
