def renderOpenApiDocumentationCompatibilityContract = {
    def output = new StringBuilder()
    output << '# Generated by ./gradlew generateOpenApiDocumentationCompatibilityContract. Do not edit manually.\n'
    output << 'schema-version=1\n'
    output << 'contract=openapi-documentation\n'
    openApiDocumentationCompatibilityModel.each { section, values ->
        output << "\n${section}:\n"
        values.toSet().sort().each { value ->
            output << "- ${value}\n"
        }
    }
    output.toString()
}

def openApiDocumentationCompatibilityContract =
        file('gradle/compatibility/contracts/openApiDocumentation.txt')

tasks.register('generateOpenApiDocumentationCompatibilityContract') {
    group = 'build setup'
    description = 'Generates the reviewed OpenAPI documentation compatibility baseline.'
    outputs.file(openApiDocumentationCompatibilityContract)

    doLast {
        openApiDocumentationCompatibilityContract.parentFile.mkdirs()
        openApiDocumentationCompatibilityContract.setText(
                renderOpenApiDocumentationCompatibilityContract(),
                'UTF-8')
    }
}

tasks.register('validateOpenApiDocumentationCompatibilityContract') {
    group = 'verification'
    description = 'Validates the reviewed OpenAPI documentation compatibility baseline.'
    mustRunAfter tasks.named('generateOpenApiDocumentationCompatibilityContract')
    inputs.files(openApiDocumentationCompatibilityModel.documents.collect { file(it) })
    inputs.file(openApiDocumentationCompatibilityContract)
    inputs.files(
            file('gradle/documentation-checks.gradle'),
            file('gradle/lifecycle.gradle'),
            file('.github/workflows/pull-request.yml'))

    doLast {
        def failures = []
        if (!openApiDocumentationCompatibilityContract.isFile()) {
            failures << 'missing gradle/compatibility/contracts/openApiDocumentation.txt'
        } else {
            def expected = renderOpenApiDocumentationCompatibilityContract()
                    .replace('\r\n', '\n')
            def actual = openApiDocumentationCompatibilityContract
                    .getText('UTF-8')
                    .replace('\r\n', '\n')
            if (actual != expected) {
                failures << 'OpenAPI documentation compatibility contract changed; run ./gradlew generateOpenApiDocumentationCompatibilityContract and review the diff'
            }
        }

        openApiDocumentationCompatibilityModel.documents.each { path ->
            if (!file(path).isFile()) {
                failures << "protected OpenAPI document is missing: ${path}"
            }
        }
        openApiDocumentationCompatibilityModel.tasks.each { taskName ->
            if (tasks.findByName(taskName) == null) {
                failures << "protected OpenAPI documentation task is missing: ${taskName}"
            }
        }

        def workflow = file('.github/workflows/pull-request.yml').text
        openApiDocumentationCompatibilityModel.evidence.each { path ->
            if (!workflow.contains(path)) {
                failures << "pull request quality evidence must include ${path}"
            }
        }
        def lifecycle = file('gradle/lifecycle.gradle').text
        if (!lifecycle.contains("tasks.named('openApiDocumentationCompatibilityCheck')")) {
            failures << 'compatibilityCheck must depend on openApiDocumentationCompatibilityCheck'
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    "OpenAPI documentation compatibility issues found:\n" +
                            failures.join('\n'))
        }
    }
}

tasks.register('openApiDocumentationCompatibilityCheck') {
    group = 'verification'
    description = 'Validates the OpenAPI documentation contract and its rollout integrations.'
    dependsOn(
            tasks.named('validateOpenApiDocumentationCompatibilityContract'),
