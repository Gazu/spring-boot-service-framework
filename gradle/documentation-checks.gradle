        }
        if (!metadataSource.text.contains('resolve("contracts")')) {
            failures << 'OpenAPI metadata implementation must preserve collision-free contract paths'
        }
        if (!portalFile.text.contains('(generation.md)')) {
            failures << 'OpenAPI portal must link to generation.md'
        }
        if (!architectureFile.text.contains(
