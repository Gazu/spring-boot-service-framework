String kebabCase(String value) {
    value.replaceAll(/([a-z0-9])([A-Z])/, '$1-$2').toLowerCase(Locale.ROOT)
}

boolean isSimplePropertyType(Class<?> type) {
    type.isPrimitive()
            || Object == type
            || CharSequence.isAssignableFrom(type)
            || Number.isAssignableFrom(type)
            || Boolean == type
            || Character == type
            || Enum.isAssignableFrom(type)
            || Duration.isAssignableFrom(type)
            || Collection.isAssignableFrom(type)
}

String shortType(Type type) {
    String typeName = type.typeName
            .replace('java.lang.', '')
            .replace('java.time.', '')
            .replace('java.util.', '')
            .replace('com.smbtech.serviceframework.starter.restclient.autoconfigure.RestClientProperties$', '')
            .replace('com.smbtech.serviceframework.starter.logging.autoconfigure.LoggingProperties$Async$', '')
            .replace('com.smbtech.serviceframework.starter.logging.autoconfigure.LoggingProperties$', '')
            .replace('com.smbtech.serviceframework.starter.mock.autoconfigure.MockProperties$', '')
            .replace('com.smbtech.serviceframework.starter.errorhandling.autoconfigure.ErrorHandlingProperties$', '')
            .replace('com.smbtech.serviceframework.httpclient.domain.', '')
            .replace('com.smbtech.serviceframework.error.', '')
    typeName.replaceAll(/</, '&lt;').replaceAll(/>/, '&gt;')
}

String formatDefaultValue(Object value) {
    if (value == null) {
        return 'empty'
    }
    if (value instanceof String && value.isEmpty()) {
        return 'empty'
    }
    if (value instanceof Duration) {
        if (value == Duration.ZERO) {
            return '0ms'
        }
        if (value.toMillis() % 60000L == 0L) {
            return "${value.toMinutes()}m"
        }
        if (value.toMillis() % 1000L == 0L) {
            return "${value.seconds}s"
        }
        return "${value.toMillis()}ms"
    }
    if (value instanceof Set) {
        return value.isEmpty()
                ? 'empty'
                : '[' + value.collect { String.valueOf(it) }.sort().join(', ') + ']'
    }
    if (value instanceof Collection) {
        return value.isEmpty() ? 'empty' : value.toString()
    }
    if (value instanceof Map) {
        return value.isEmpty()
                ? 'empty'
                : '{' + value.entrySet()
                        .collect { "${it.key}=${it.value}" }
                        .sort()
                        .join(', ') + '}'
    }
    if (value instanceof Enum) {
        return value.name()
    }
    value.toString()
}

List<Field> bindableFields(Class<?> type) {
    List<Field> fields = []
    Class<?> current = type
    while (current != null && current != Object) {
        fields.addAll(current.declaredFields)
        current = current.superclass
    }
    fields.findAll { field ->
        !field.synthetic
                && !Modifier.isStatic(field.modifiers)
                && !Modifier.isTransient(field.modifiers)
    }.sort { a, b -> a.name <=> b.name }
}

String mapPlaceholder(String fieldName) {
    switch (fieldName) {
        case 'clients':
            return '<name>'
        case 'endpoints':
        case 'contracts':
            return '<key>'
        case 'clientAssertions':
        case 'jwtBearer':
            return '<registration-id>'
        case 'credentials':
        case 'keyStores':
            return '<id>'
        default:
            return '*'
    }
}

Class<?> mapValueClass(Field field) {
    if (!(field.genericType instanceof ParameterizedType)) {
        return null
    }
    Type valueType = field.genericType.actualTypeArguments[1]
    valueType instanceof Class<?> ? (Class<?>) valueType : null
}

Object newInstance(Class<?> type) {
    def constructor = type.getDeclaredConstructor()
    constructor.accessible = true
    constructor.newInstance()
}

Object fieldValue(Field field, Object instance) {
    field.accessible = true
    field.get(instance)
}

void collectProperties(
        Class<?> type,
        Object instance,
        String prefix,
        Map<String, String> descriptions,
        List<PropertyReferenceEntry> entries
) {
    bindableFields(type).each { field ->
        String propertyName = kebabCase(field.name)
        String fullName = prefix ? "${prefix}.${propertyName}" : propertyName
        Class<?> fieldClass = field.type
        Object value = fieldValue(field, instance)

        if (Map.isAssignableFrom(fieldClass)) {
            Class<?> valueClass = mapValueClass(field)
            String placeholder = mapPlaceholder(field.name)
            String mapEntryName = "${fullName}.${placeholder}".toString()

            if (valueClass != null && !isSimplePropertyType(valueClass) && !Map.isAssignableFrom(valueClass)) {
                collectProperties(
                        valueClass,
                        newInstance(valueClass),
                        mapEntryName,
                        descriptions,
                        entries
                )
            } else {
                entries << new PropertyReferenceEntry(
                        name: mapEntryName,
                        type: shortType(field.genericType),
                        defaultValue: formatDefaultValue(value),
                        description: descriptions.get(mapEntryName, 'Map entries configured by the consuming application.')
                )
            }
            return
        }

        if (!isSimplePropertyType(fieldClass) && !fieldClass.name.startsWith('java.')) {
            collectProperties(
                    fieldClass,
                    value ?: newInstance(fieldClass),
                    fullName,
                    descriptions,
                    entries
            )
            return
        }

        entries << new PropertyReferenceEntry(
                name: fullName,
                type: shortType(field.genericType),
                defaultValue: formatDefaultValue(value),
                description: descriptions.get(fullName, 'Generated configuration property.')
        )
    }
}

String generatePropertyReference(PropertyReferenceSpec spec) {
    URL[] urls = rootProject.subprojects
            .findAll { it.extensions.findByName('sourceSets') != null }
            .collectMany { subproject ->
                def mainSourceSet = subproject.extensions.getByName('sourceSets').findByName('main')
                mainSourceSet == null ? [] : mainSourceSet.output.classesDirs.files
            }
            .collect { it.toURI().toURL() } as URL[]
    URLClassLoader classLoader = new URLClassLoader(urls, this.class.classLoader)
    Class<?> propertiesClass = Class.forName(spec.configurationPropertiesClass, false, classLoader)

    List<PropertyReferenceEntry> entries = []
    collectProperties(propertiesClass, newInstance(propertiesClass), spec.prefix, spec.descriptions, entries)

    StringBuilder markdown = new StringBuilder()
    markdown << "# ${spec.title}\n\n"
    markdown << "${spec.intro}\n\n"
    markdown << "<!-- generated by ./gradlew generatePropertyReferences; do not edit this file manually. -->\n\n"
    markdown << "| Property | Type | Default | Description |\n"
    markdown << "|---|---|---|---|\n"
    entries.sort { a, b -> a.name <=> b.name }.each { entry ->
        markdown << "| `${entry.name}` | `${entry.type}` | `${entry.defaultValue}` | ${entry.description} |\n"
    }
    markdown.toString()
}

tasks.register('generatePropertyReferences') {
    group = 'documentation'
    description = 'Generates Markdown property references from Spring Boot configuration property classes.'
    dependsOn propertyReferenceSpecs.collect { "${it.projectPath}:classes" }

    doLast {
        propertyReferenceSpecs.each { spec ->
            File outputFile = file(spec.outputPath)
            outputFile.parentFile.mkdirs()
            outputFile.text = generatePropertyReference(spec)
        }
    }
}

tasks.register('validatePropertyReferences') {
    group = 'verification'
    description = 'Validates generated Markdown property references are up to date.'
    dependsOn propertyReferenceSpecs.collect { "${it.projectPath}:classes" }

    doLast {
        List<String> failures = []
        propertyReferenceSpecs.each { spec ->
            File outputFile = file(spec.outputPath)
            String expected = generatePropertyReference(spec)
            if (!outputFile.exists()) {
                failures << "${spec.outputPath}: missing generated property reference"
            } else if (outputFile.text != expected) {
                failures << "${spec.outputPath}: generated property reference is out of date; run ./gradlew generatePropertyReferences"
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("Property reference validation failed:\n" + failures.join('\n'))
        }
    }
}
