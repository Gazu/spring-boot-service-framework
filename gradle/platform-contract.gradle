// Framework platform contract shared by platform creation and compatibility checks.

def platformContract = [
        schemaVersion            : 2,
        coordinates              : [
                groupId   : 'com.smbtech',
                artifactId: 'spring-boot-service-framework-platform',
                version   : providers.gradleProperty('frameworkVersion').get()
        ].asImmutable(),
        versionProperty          : 'frameworkVersion',
        springBootBom            : [
                groupId   : 'org.springframework.boot',
                artifactId: 'spring-boot-dependencies',
                version   : providers.gradleProperty('springBootVersion').get()
        ].asImmutable(),
        springBootVersionProperty: 'springBootVersion',
        consumerImportMode       : 'platform',
        managedDependencyOverrides: [
                'org.apache.httpcomponents.client5:httpclient5':
                        providers.gradleProperty('httpClient5Version').get(),
                'org.apache.httpcomponents.core5:httpcore5':
                        providers.gradleProperty('httpCore5Version').get(),
                'org.apache.httpcomponents.core5:httpcore5-h2':
                        providers.gradleProperty('httpCore5Version').get(),
                'org.apache.logging.log4j:log4j-api':
                        providers.gradleProperty('log4j2Version').get(),
                'tools.jackson.core:jackson-databind':
                        providers.gradleProperty('jackson3Version').get(),
                'tools.jackson.dataformat:jackson-dataformat-yaml':
                        providers.gradleProperty('jackson3Version').get()
        ].asImmutable(),
        managedProjectPaths      : [
                ':spring-boot-service-framework-actuator-core',
                ':spring-boot-service-framework-commons',
                ':spring-boot-service-framework-error-core',
                ':spring-boot-service-framework-http-client-core',
                ':spring-boot-service-framework-logging-core',
                ':spring-boot-service-framework-mock-core',
                ':spring-boot-service-framework-openapi-contract-testing',
                ':spring-boot-service-framework-openapi-generator',
                ':spring-boot-service-framework-starters:spring-boot-service-framework-starter-error-handling',
                ':spring-boot-service-framework-starters:spring-boot-service-framework-starter-actuator',
                ':spring-boot-service-framework-starters:spring-boot-service-framework-starter-logging',
                ':spring-boot-service-framework-starters:spring-boot-service-framework-starter-mock',
                ':spring-boot-service-framework-starters:spring-boot-service-framework-starter-rest-client'
        ].asImmutable(),
        excludedCoordinateGroups : ['com.smbtech.openapi'].asImmutable()
].asImmutable()

rootProject.ext.serviceFrameworkPlatformContract = platformContract

def platformCompatibilityContractFile =
        layout.projectDirectory.file('gradle/compatibility/contracts/platform.txt')
def renderPlatformCompatibilityContract = {
    def output = new StringBuilder()
    output << '# Generated by ./gradlew generatePlatformCompatibilityContract. Do not edit manually.\n'
    output << "schema-version=${platformContract.schemaVersion}\n"
    output << 'coordinate='
    output << "${platformContract.coordinates.groupId}:"
    output << "${platformContract.coordinates.artifactId}:"
    output << "${platformContract.coordinates.version}\n"
    output << 'packaging=pom\n'
    output << "consumer-import-mode=${platformContract.consumerImportMode}\n"
    output << '\nimported-boms:\n'
    output << "- ${platformContract.springBootBom.groupId}:"
    output << "${platformContract.springBootBom.artifactId}:"
    output << "${platformContract.springBootBom.version}\n"
    output << '\nmanaged-constraints:\n'
    platformContract.managedProjectPaths.collect { managedProjectPath ->
        def managedProject = rootProject.project(managedProjectPath)
        "${managedProject.group}:${managedProject.name}:${managedProject.version}"
    }.sort().each { coordinate ->
        output << "- ${coordinate}\n"
    }
    output << '\nmanaged-dependency-overrides:\n'
    platformContract.managedDependencyOverrides.collect { coordinate, version ->
        "${coordinate}:${version}"
    }.sort().each { coordinate ->
        output << "- ${coordinate}\n"
    }
    output << '\nexcluded-coordinate-groups:\n'
    platformContract.excludedCoordinateGroups.toList().sort().each { coordinateGroup ->
        output << "- ${coordinateGroup}\n"
    }
    output.toString()
}

tasks.register('generatePlatformCompatibilityContract') {
    group = 'build setup'
    description = 'Generates the reviewed framework platform compatibility baseline.'
    inputs.property('platformContract', platformContract)
    outputs.file(platformCompatibilityContractFile)

    doLast {
        platformCompatibilityContractFile.asFile.parentFile.mkdirs()
        platformCompatibilityContractFile.asFile.setText(
                renderPlatformCompatibilityContract(),
                'UTF-8'
        )
    }
}

tasks.register('validatePlatformCompatibilityContract') {
    group = 'verification'
    description = 'Validates the reviewed framework platform compatibility baseline.'
    mustRunAfter tasks.named('generatePlatformCompatibilityContract')
    inputs.property('platformContract', platformContract)
    inputs.file(platformCompatibilityContractFile)

    doLast {
        if (!platformCompatibilityContractFile.asFile.isFile()) {
            throw new GradleException(
                    'Missing gradle/compatibility/contracts/platform.txt. '
                            + 'Run ./gradlew generatePlatformCompatibilityContract.'
            )
        }
        def expected = renderPlatformCompatibilityContract().replace('\r\n', '\n')
        def actual = platformCompatibilityContractFile.asFile
                .getText('UTF-8')
                .replace('\r\n', '\n')
        if (actual != expected) {
            throw new GradleException(
                    'Framework platform compatibility contract changed. '
                            + 'Run ./gradlew generatePlatformCompatibilityContract and review the contract diff.'
            )
        }
    }
}

tasks.register('validateFrameworkPlatformContract') {
    group = 'verification'
    description = 'Validates the coordinate, version, dependency, and exclusion policy of the framework platform.'

    inputs.property('schemaVersion', platformContract.schemaVersion)
    inputs.property('coordinates', platformContract.coordinates)
    inputs.property('versionProperty', platformContract.versionProperty)
    inputs.property('springBootBom', platformContract.springBootBom)
    inputs.property('springBootVersionProperty', platformContract.springBootVersionProperty)
    inputs.property('consumerImportMode', platformContract.consumerImportMode)
    inputs.property('managedDependencyOverrides', platformContract.managedDependencyOverrides)
    inputs.property('managedProjectPaths', platformContract.managedProjectPaths)
    inputs.property('excludedCoordinateGroups', platformContract.excludedCoordinateGroups)

    doLast {
        def failures = []

        if (platformContract.coordinates.groupId != rootProject.group.toString()) {
            failures.add(
                    "Platform group ${platformContract.coordinates.groupId} must match root group ${rootProject.group}."
            )
        }
        if (platformContract.coordinates.version != rootProject.version.toString()) {
            failures.add(
                    "Platform version ${platformContract.coordinates.version} must match framework version ${rootProject.version}."
            )
        }
        if (platformContract.consumerImportMode != 'platform') {
            failures.add('The supported Gradle consumer import mode must be platform.')
        }
        if (platformContract.managedProjectPaths.size()
                != platformContract.managedProjectPaths.toSet().size()) {
            failures.add('Managed framework project paths must be unique.')
        }

        platformContract.managedDependencyOverrides.each { coordinate, version ->
            if (!(coordinate ==~ /^[^:]+:[^:]+$/)) {
                failures.add("Managed dependency override has invalid coordinates: ${coordinate}.")
            }
            if (version.isBlank()) {
                failures.add("Managed dependency override ${coordinate} must declare a version.")
            }
        }

        platformContract.managedProjectPaths.each { projectPath ->
            def managedProject = rootProject.findProject(projectPath)
            if (managedProject == null) {
                failures.add("Managed framework project does not exist: ${projectPath}.")
                return
            }
            if (managedProject.group.toString() != platformContract.coordinates.groupId) {
                failures.add(
                        "Managed project ${projectPath} uses group ${managedProject.group}; "
                                + "expected ${platformContract.coordinates.groupId}."
                )
            }
            if (managedProject.version.toString() != platformContract.coordinates.version) {
                failures.add(
                        "Managed project ${projectPath} uses version ${managedProject.version}; "
                                + "expected ${platformContract.coordinates.version}."
                )
            }
        }

        def generatedOpenApiGroup = smbtechOpenApi.groupId.get()
        if (!platformContract.excludedCoordinateGroups.contains(generatedOpenApiGroup)) {
            failures.add(
                    "Generated OpenAPI group ${generatedOpenApiGroup} must be excluded from platform constraints."
            )
        }
        if (platformContract.excludedCoordinateGroups.contains(platformContract.coordinates.groupId)) {
            failures.add('The framework group cannot be excluded from platform constraints.')
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    'Invalid framework platform contract:\n' + failures.join('\n')
            )
        }
    }
}

tasks.register('platformCompatibilityCheck') {
    group = 'verification'
    description = 'Validates the framework platform contract, constraints, and published Maven model.'
    dependsOn(
            tasks.named('validateFrameworkPlatformContract'),
            tasks.named('validatePlatformCompatibilityContract'),
            ':spring-boot-service-framework-platform:check'
    )
}
