tasks.named('cyclonedxBom') {
    projectType = 'framework'
    componentGroup = project.group.toString()
    componentName = project.name
    componentVersion = project.version.toString()
    includeBomSerialNumber = false
    includeBuildSystem = false
    includeLicenseText = false
    jsonOutput.set(layout.buildDirectory.file('reports/bom.json'))
    xmlOutput.set(layout.buildDirectory.file('reports/bom.xml'))

    doLast {
        def sourceDateEpoch = providers.environmentVariable('SOURCE_DATE_EPOCH').orNull
        if (!sourceDateEpoch) {
            sourceDateEpoch = providers.exec {
                commandLine 'git', 'log', '-1', '--format=%ct'
                ignoreExitValue = true
            }.standardOutput.asText.get().trim() ?: '0'
        }
        def reproducibleTimestamp = Instant.ofEpochSecond(sourceDateEpoch.toLong()).toString()
        def jsonFile = jsonOutput.get().asFile
        def xmlFile = xmlOutput.get().asFile

        def bom = new JsonSlurper().parse(jsonFile)
        def rootReference = bom.metadata?.component?.'bom-ref'
        if (!rootReference) {
            throw new GradleException('CycloneDX metadata.component.bom-ref is required.')
        }

        def apacheLicense = [[license: [id: 'Apache-2.0']]]
        bom.metadata.component.licenses = apacheLicense
        (bom.components ?: []).findAll {
            it.group?.startsWith('com.smbtech')
        }.each {
            it.licenses = apacheLicense
        }

        def referencedComponents = (bom.dependencies ?: [])
                .collectMany { it.dependsOn ?: [] }
                .toSet()
        def aggregateDependencies = (bom.components ?: [])
                .collect { it.'bom-ref' }
                .findAll { it && !referencedComponents.contains(it) }
                .toSorted()

        def dependencies = bom.dependencies ?: []
        dependencies.removeAll { it.ref == rootReference }
        dependencies.add(0, [
                ref      : rootReference,
                dependsOn: aggregateDependencies
        ])
        bom.dependencies = dependencies
        bom.metadata.timestamp = reproducibleTimestamp
        jsonFile.setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(bom)) + System.lineSeparator(),
                'UTF-8'
        )

        def xml = new XmlParser(false, false).parse(xmlFile)
        xml.metadata.timestamp[0].value = reproducibleTimestamp
        def applyApacheLicense = { component ->
            component.licenses.each { component.remove(it) }
            def licenses = component.appendNode('licenses')
            licenses.appendNode('license').appendNode('id', 'Apache-2.0')
            component.children().remove(licenses)
            def purlIndex = component.children().findIndexOf {
                it instanceof Node && it.name() == 'purl'
            }
            component.children().add(
                    purlIndex >= 0 ? purlIndex : component.children().size(),
                    licenses
            )
        }
        applyApacheLicense(xml.metadata.component[0])
        xml.components.component.findAll {
            it.group.text().startsWith('com.smbtech')
        }.each(applyApacheLicense)
        def xmlDependencies = xml.dependencies[0]
        xmlDependencies.dependency
                .findAll { it.attributes()['ref'] == rootReference }
                .each { xmlDependencies.remove(it) }
        def rootDependency = xmlDependencies.appendNode(
                'dependency',
                [ref: rootReference]
        )
        aggregateDependencies.each {
            rootDependency.appendNode('dependency', [ref: it])
        }
        xmlFile.setText(XmlUtil.serialize(xml), 'UTF-8')
    }
}

