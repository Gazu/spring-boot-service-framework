def releaseArtifactEntries = {
    def entries = []
    releaseArtifactManifest.asFile.eachLine('UTF-8') { line ->
        def normalized = line.trim()
        if (!normalized || normalized.startsWith('#')) {
            return
        }
        def parts = normalized.split('\\|', -1)*.trim()
        if (parts.size() == 3) {
            entries.add([kind: parts[0], groupId: parts[1], artifactId: parts[2]])
        }
    }
    entries
}
def sha256 = { File source ->
    def digest = MessageDigest.getInstance('SHA-256')
    source.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().encodeHex().toString()
}

