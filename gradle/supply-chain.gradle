tasks.register('generateReleaseNotes') {
    group = 'publishing'
    description = 'Generates standalone release notes from the current CHANGELOG section.'
    inputs.file(changelogFile)
    inputs.property('frameworkVersion', project.version.toString())
    outputs.file(releaseNotesFile)

    doLast {
        def changelog = changelogFile.asFile.getText('UTF-8')
        def versionPattern = java.util.regex.Pattern.quote(project.version.toString())
        def headingPattern = java.util.regex.Pattern.compile(
                '(?m)^## ' + versionPattern + ' - (\\d{4}-\\d{2}-\\d{2})$'
        )
        def headingMatcher = headingPattern.matcher(changelog)
        if (!headingMatcher.find()) {
            throw new GradleException(
                    "CHANGELOG.md does not contain release notes for ${project.version}."
            )
        }
        def releaseDate = headingMatcher.group(1)
        def sectionStart = headingMatcher.end()
        if (headingMatcher.find()) {
            throw new GradleException(
                    "CHANGELOG.md contains duplicate release sections for ${project.version}."
            )
        }
        def nextHeading = java.util.regex.Pattern.compile('(?m)^## .+$')
                .matcher(changelog)
        def sectionEnd = changelog.length()
        if (nextHeading.find(sectionStart)) {
            sectionEnd = nextHeading.start()
        }
        def releaseBody = changelog.substring(sectionStart, sectionEnd).trim()
        if (!releaseBody || !releaseBody.contains('- ')) {
            throw new GradleException(
                    "CHANGELOG.md release ${project.version} must contain user-facing changes."
            )
        }

        releaseBody = releaseBody
                .replaceAll('(?m)^### ', '## ')
                .replace(
                        '](docs/',
                        "](${projectUrl}/blob/v${project.version}/docs/"
                )
        def output = releaseNotesFile.get().asFile
        output.parentFile.mkdirs()
        output.setText(
                "# Spring Boot Service Framework v${project.version}\n\n" +
                        "Released: ${releaseDate}\n\n${releaseBody}\n",
                'UTF-8'
        )
    }
}

tasks.register('validateReleaseNotes') {
    group = 'verification'
    description = 'Validates the standalone release notes prepared for the current version.'
    dependsOn tasks.named('generateReleaseNotes')
    inputs.file(releaseNotesFile)

    doLast {
        def notes = releaseNotesFile.get().asFile.getText('UTF-8')
        def failures = []
        if (!notes.startsWith("# Spring Boot Service Framework v${project.version}\n")) {
            failures.add('release notes title does not match frameworkVersion')
        }
        if (!(notes =~ /(?m)^Released: \d{4}-\d{2}-\d{2}$/).find()) {
            failures.add('release notes must contain a release date')
        }
        if (!notes.contains('## Highlights')) {
            failures.add('release notes must contain ## Highlights')
        }
        def changeCategories = [
                '## Added',
                '## Changed',
                '## Deprecated',
                '## Removed',
                '## Fixed',
                '## Security'
        ]
        if (!changeCategories.any { notes.contains(it) }) {
            failures.add('release notes must contain at least one change category')
        }
        if (notes.contains('## Removed') &&
                !notes.toLowerCase(Locale.ROOT).contains('migration guide')) {
            failures.add('release notes with removals must link to migration guidance')
        }
        if (notes.contains('## Unreleased') || notes.contains('No unreleased changes.')) {
            failures.add('release notes must contain only the released version')
        }
        if (notes.contains('](docs/')) {
            failures.add('release note links must resolve outside the repository checkout')
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'Invalid release notes:\n' + failures.join('\n')
            )
        }
    }
}

tasks.register('validateReleaseTag') {
    group = 'verification'
    description = 'Validates that a release build is running from its matching signed version tag.'

    onlyIf { releaseBuild }

    doLast {
        if (!signingKey.isPresent()) {
            throw new GradleException('Release builds require SIGNING_KEY and SIGNING_PASSWORD.')
        }

        def expectedTag = "v${project.version}"
        def actualTag = providers.environmentVariable('GITHUB_REF_NAME').orNull
        if (!actualTag) {
            actualTag = providers.exec {
                commandLine 'git', 'describe', '--tags', '--exact-match', 'HEAD'
                ignoreExitValue = true
            }.standardOutput.asText.get().trim()
        }
        if (actualTag != expectedTag) {
            throw new GradleException("Release version ${project.version} must be built from tag ${expectedTag}; found ${actualTag ?: 'no tag'}.")
        }
        providers.exec {
            commandLine 'git', 'verify-tag', expectedTag
        }.result.get().assertNormalExitValue()
    }
}

tasks.register('validateReproducibleArchives') {
    group = 'verification'
    description = 'Ensures every Gradle archive task uses reproducible ordering and timestamps.'

    doLast {
        def failures = []
        allprojects.each { candidateProject ->
            candidateProject.tasks.withType(AbstractArchiveTask).each { archiveTask ->
                if (archiveTask.preserveFileTimestamps) {
                    failures.add("${archiveTask.path}: preserveFileTimestamps must be false")
                }
                if (!archiveTask.reproducibleFileOrder) {
                    failures.add("${archiveTask.path}: reproducibleFileOrder must be true")
                }
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException('Non-reproducible archive configuration found:\n' + failures.sort().join('\n'))
        }
    }
}

def generatedPomTasks = providers.provider {
    allprojects.collectMany { candidateProject ->
        candidateProject.tasks.withType(GenerateMavenPom).toList()
    }
}

tasks.register('validatePublishedPomMetadata') {
    group = 'verification'
    description = 'Validates required Maven POM metadata for every publication.'
    dependsOn generatedPomTasks

    doLast {
        def failures = []
        generatedPomTasks.get().each { pomTask ->
            def pomFile = pomTask.destination
            def pom = new XmlSlurper().parse(pomFile)
            def coordinate = "${pom.groupId.text()}:${pom.artifactId.text()}"
            def requiredValues = [
                    name              : pom.name.text(),
                    description       : pom.description.text(),
                    url               : pom.url.text(),
                    licenseName       : pom.licenses.license.name.text(),
                    licenseUrl        : pom.licenses.license.url.text(),
                    developerId       : pom.developers.developer.id.text(),
                    scmConnection     : pom.scm.connection.text(),
                    scmDeveloper      : pom.scm.developerConnection.text(),
                    scmUrl            : pom.scm.url.text(),
                    issueManagementUrl: pom.issueManagement.url.text()
            ]
            requiredValues.findAll { !it.value?.trim() }.each { entry ->
                failures.add("${pomTask.path}: missing ${entry.key}")
            }
            def releaseCoordinate = releaseArtifactEntries().any { entry ->
                "${entry.groupId}:${entry.artifactId}" == coordinate
            }
            if (releaseCoordinate) {
                def distributionManagement = pom.distributionManagement
                def repositories = distributionManagement.repository
                def distributionChildren = distributionManagement.children().collect {
                    it.name()
                }
                if (repositories.size() != 1 ||
                        repositories.id.text() != distributionRepositoryId ||
                        repositories.name.text() != distributionRepositoryName ||
                        repositories.url.text() != distributionRepositoryUrl ||
                        distributionChildren != ['repository']) {
                    failures.add(
                            "${pomTask.path}: invalid distributionManagement for ${coordinate}"
                    )
                }
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException('Invalid Maven POM metadata found:\n' + failures.sort().join('\n'))
        }
    }
}

