def sbomJsonFile = layout.buildDirectory.file(
        'reports/bom.json'
)
def sbomXmlFile = layout.buildDirectory.file(
        'reports/bom.xml'
)

tasks.register('validateCycloneDxSbom') {
    group = 'verification'
    description = 'Validates the production CycloneDX SBOM before publication to Dependency-Track.'
    dependsOn tasks.named('cyclonedxBom')
    inputs.files(sbomJsonFile, sbomXmlFile)

    doLast {
        def jsonFile = sbomJsonFile.get().asFile
        def xmlFile = sbomXmlFile.get().asFile
        if (!jsonFile.isFile() || jsonFile.length() == 0 ||
                !xmlFile.isFile() || xmlFile.length() == 0) {
            throw new GradleException('CycloneDX JSON and XML SBOM files must both exist and be non-empty.')
        }

        def failures = []
        def cyclonedxClassLoader = tasks.named('cyclonedxBom').get().class.classLoader
        def bomParserFactory = cyclonedxClassLoader.loadClass(
                'org.cyclonedx.parsers.BomParserFactory'
        )
        [JSON: jsonFile, XML: xmlFile].each { format, source ->
            def parser = bomParserFactory.getMethod('createParser', File)
                    .invoke(null, source)
            def schemaErrors = parser.validate(source)
            if (!schemaErrors.isEmpty()) {
                failures.add("${format} does not conform to CycloneDX 1.6: " +
                        schemaErrors.collect { it.message }.join('; '))
            }
        }

        def bom = new JsonSlurper().parse(jsonFile)
        if (bom.bomFormat != 'CycloneDX') {
            failures.add('JSON bomFormat must be CycloneDX')
        }
        if (bom.specVersion != '1.6') {
            failures.add('JSON specVersion must be 1.6')
        }
        if (bom.serialNumber) {
            failures.add('JSON serialNumber must be omitted for reproducible output')
        }
        if (!bom.metadata?.timestamp) {
            failures.add('JSON metadata.timestamp is required')
        }

        def rootComponent = bom.metadata?.component
        def expectedRoot = [
                group  : project.group.toString(),
                name   : project.name,
                version: project.version.toString(),
                type   : 'framework'
        ]
        expectedRoot.each { key, value ->
            if (rootComponent?."${key}" != value) {
                failures.add("JSON metadata.component.${key} must be ${value}")
            }
        }

        def components = bom.components ?: []
        def dependencies = bom.dependencies ?: []
        if (components.isEmpty()) {
            failures.add('JSON components must not be empty')
        }
        if (dependencies.isEmpty()) {
            failures.add('JSON dependencies must not be empty')
        }
        def rootReference = rootComponent?.'bom-ref'
        if (!rootReference) {
            failures.add('JSON metadata.component.bom-ref is required')
        } else {
            def rootDependencies = dependencies.findAll { it.ref == rootReference }
            if (rootDependencies.size() != 1) {
                failures.add('JSON dependencies must contain the root component exactly once')
            } else if ((rootDependencies[0].dependsOn ?: []).isEmpty()) {
                failures.add('JSON root component must reference aggregate dependencies')
            }
        }

        def duplicateReferences = components
                .findAll { it.'bom-ref' }
                .groupBy { it.'bom-ref' }
                .findAll { ignored, matching -> matching.size() > 1 }
                .keySet()
        if (!duplicateReferences.isEmpty()) {
            failures.add("JSON contains duplicate component references: ${duplicateReferences.sort().join(', ')}")
        }

        def runtimeReleaseKinds = ['platform', 'library', 'starter'] as Set
        def expectedRuntimeCoordinates = releaseArtifactEntries()
                .findAll { runtimeReleaseKinds.contains(it.kind) }
                .collect { "${it.groupId}:${it.artifactId}" }
                .toSet()
        def localCoordinates = components.findAll {
            it.group?.startsWith('com.smbtech')
        }.collect {
            "${it.group}:${it.name}"
        }.toSet()
        def missingRuntimeComponents = expectedRuntimeCoordinates - localCoordinates
        if (!missingRuntimeComponents.isEmpty()) {
            failures.add('JSON is missing published runtime components: ' +
                    missingRuntimeComponents.sort().join(', '))
        }
        def unexpectedLocalComponents = localCoordinates - expectedRuntimeCoordinates
        if (!unexpectedLocalComponents.isEmpty()) {
            failures.add('JSON contains non-published local components: ' +
                    unexpectedLocalComponents.sort().join(', '))
        }

        def hasApacheLicense = { component ->
            (component?.licenses ?: []).any {
                it.license?.id == 'Apache-2.0' || it.expression == 'Apache-2.0'
            }
        }
        if (!hasApacheLicense(rootComponent)) {
            failures.add('JSON root component must declare Apache-2.0')
        }
        def localComponentsWithoutLicense = components.findAll {
            it.group?.startsWith('com.smbtech') && !hasApacheLicense(it)
        }.collect {
            "${it.group}:${it.name}:${it.version}"
        }
        if (!localComponentsWithoutLicense.isEmpty()) {
            failures.add('JSON local components missing Apache-2.0: ' +
                    localComponentsWithoutLicense.sort().join(', '))
        }

        def componentReferences = components.collect { it.'bom-ref' }.findAll().toSet()
        def knownReferences = componentReferences + ([rootReference] as Set)
        def duplicateDependencyReferences = dependencies
                .findAll { it.ref }
                .groupBy { it.ref }
                .findAll { ignored, matching -> matching.size() > 1 }
                .keySet()
        if (!duplicateDependencyReferences.isEmpty()) {
            failures.add('JSON contains duplicate dependency references: ' +
                    duplicateDependencyReferences.sort().join(', '))
        }
        def unknownDependencyReferences = dependencies.collectMany { dependency ->
            [dependency.ref] + (dependency.dependsOn ?: [])
        }.findAll {
            it && !knownReferences.contains(it)
        }.toSet()
        if (!unknownDependencyReferences.isEmpty()) {
            failures.add('JSON dependency graph contains unknown references: ' +
                    unknownDependencyReferences.sort().join(', '))
        }
        def dependenciesByReference = dependencies.findAll { it.ref }.collectEntries {
            [(it.ref): (it.dependsOn ?: [])]
        }
        def reachableReferences = [] as Set
        def pendingReferences = new ArrayDeque()
        pendingReferences.add(rootReference)
        while (!pendingReferences.isEmpty()) {
            def reference = pendingReferences.removeFirst()
            if (reachableReferences.add(reference)) {
                (dependenciesByReference[reference] ?: []).each {
                    pendingReferences.addLast(it)
                }
            }
        }
        def unreachableComponents = componentReferences - reachableReferences
        if (!unreachableComponents.isEmpty()) {
            failures.add('JSON dependency graph contains unreachable components: ' +
                    unreachableComponents.sort().join(', '))
        }

        def testDependencyGroups = [
                'com.tngtech.archunit',
                'net.bytebuddy',
                'org.awaitility',
                'org.assertj',
                'org.hamcrest',
                'org.junit',
                'org.junit.jupiter',
                'org.junit.platform',
                'org.mockito',
                'org.objenesis'
        ] as Set
        def testDependencies = components.findAll {
            testDependencyGroups.contains(it.group)
        }.collect {
            "${it.group}:${it.name}:${it.version}"
        }
        if (!testDependencies.isEmpty()) {
            failures.add('JSON contains test-only dependencies: ' + testDependencies.sort().join(', '))
        }

        def xml = new XmlSlurper(false, false).parse(xmlFile)
        if (xml.name() != 'bom') {
            failures.add('XML root element must be bom')
        }
        if (xml.@serialNumber.text()) {
            failures.add('XML serialNumber must be omitted for reproducible output')
        }
        if (!xml.metadata.timestamp.text()) {
            failures.add('XML metadata timestamp is required')
        }
        if (xml.metadata.component.group.text() != project.group.toString() ||
                xml.metadata.component.name.text() != project.name ||
                xml.metadata.component.version.text() != project.version.toString() ||
                xml.metadata.component.@type.text() != 'framework') {
            failures.add('XML root component identity does not match the Gradle project')
        }
        def xmlRootReference = xml.metadata.component.@'bom-ref'.text()
        def xmlRootDependencies = xml.dependencies.dependency.findAll {
            it.@ref.text() == xmlRootReference
        }
        if (!xmlRootReference) {
            failures.add('XML metadata component bom-ref is required')
        } else if (xmlRootDependencies.size() != 1) {
            failures.add('XML dependencies must contain the root component exactly once')
        } else if (xmlRootDependencies[0].dependency.isEmpty()) {
            failures.add('XML root component must reference aggregate dependencies')
        }
        if (xml.metadata.component.licenses.license.id.text() != 'Apache-2.0') {
            failures.add('XML root component must declare Apache-2.0')
        }
        def xmlLocalComponentsWithoutLicense = xml.components.component.findAll {
            it.group.text().startsWith('com.smbtech') &&
                    it.licenses.license.id.text() != 'Apache-2.0'
        }.collect {
            "${it.group.text()}:${it.name.text()}:${it.version.text()}"
        }
        if (!xmlLocalComponentsWithoutLicense.isEmpty()) {
            failures.add('XML local components missing Apache-2.0: ' +
                    xmlLocalComponentsWithoutLicense.sort().join(', '))
        }
        def xmlComponentReferences = xml.components.component.collect {
            it.@'bom-ref'.text()
        }.findAll().toSet()
        if (xmlComponentReferences != componentReferences) {
            failures.add('JSON and XML component references must match')
        }

        if (!failures.isEmpty()) {
            throw new GradleException('Invalid CycloneDX SBOM:\n' + failures.join('\n'))
        }
    }
}

