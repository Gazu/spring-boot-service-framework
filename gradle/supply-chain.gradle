tasks.register('validateDependencyVerificationMetadata') {
    group = 'verification'
    description = 'Ensures every standalone Gradle build enforces reviewed SHA-256 dependency metadata.'
    inputs.files(dependencyVerificationFiles)

    doLast {
        def failures = []
        dependencyVerificationFiles.files.sort().each { metadataFile ->
            if (!metadataFile.isFile()) {
                failures.add("${relativePath(metadataFile)}: missing dependency verification metadata")
                return
            }
            def metadata = new XmlSlurper().parse(metadataFile)
            if (metadata.configuration.'verify-metadata'.text() != 'true') {
                failures.add("${relativePath(metadataFile)}: verify-metadata must be true")
            }
            if (metadata.components.component.artifact.sha256.isEmpty()) {
                failures.add("${relativePath(metadataFile)}: no SHA-256 checksums found")
            }
            if (metadataFile != file('gradle/verification-metadata.xml')) {
                def trustedGroups = metadata.configuration.'trusted-artifacts'.trust.collect {
                    it.@group.text()
                }
                if (trustedGroups != ['com.smbtech']) {
                    failures.add("${relativePath(metadataFile)}: only locally built com.smbtech artifacts may be trusted")
                }
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException('Invalid dependency verification configuration:\n' + failures.join('\n'))
        }
    }
}

tasks.register('supplyChainCheck') {
    group = 'verification'
    description = 'Validates the production-only SBOM, release identity, reproducible archives, POM metadata, and coverage.'
    dependsOn(
            tasks.named('validateCycloneDxSbom'),
            tasks.named('validateDependencyVerificationMetadata'),
            tasks.named('validatePublishedPomMetadata'),
            tasks.named('releaseArtifactManifestCheck'),
            tasks.named('validateReleaseTag'),
            tasks.named('validateReproducibleArchives')
    )
}

tasks.register('stageReleaseRepository', Sync) {
    group = 'publishing'
    description = 'Stages only manifest-approved Maven artifacts in one release repository.'
    dependsOn(
            tasks.named('publishLocalArtifacts'),
            tasks.named('cyclonedxBom'),
            tasks.named('releaseArtifactManifestCheck')
    )
    into layout.buildDirectory.dir('release/repository')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude '**/maven-metadata.xml*'
    def releaseRepositoryIncludes = releaseArtifactEntries().collect { coordinate ->
        coordinate.groupId.replace('.', '/') + '/' + coordinate.artifactId +
                "/${project.version}/**"
    }
    from(file('build-logic/build/repository')) {
        include releaseRepositoryIncludes
    }
    subprojects.each { candidateProject ->
        from(candidateProject.layout.buildDirectory.dir('repository')) {
            include releaseRepositoryIncludes
        }
    }

    doLast {
        def requiredBuildLogicArtifacts = [
                'com/smbtech/spring-boot-service-framework-openapi-gradle-plugin/' +
                        "${project.version}/spring-boot-service-framework-openapi-gradle-plugin-" +
                        "${project.version}.jar",
                'com/smbtech/spring-boot-service-framework-openapi-templates/' +
                        "${project.version}/spring-boot-service-framework-openapi-templates-" +
                        "${project.version}.jar",
                'com/smbtech/service-framework/openapi-generator/' +
                        'com.smbtech.service-framework.openapi-generator.gradle.plugin/' +
                        "${project.version}/" +
                        'com.smbtech.service-framework.openapi-generator.gradle.plugin-' +
                        "${project.version}.pom"
        ]
        def missingArtifacts = requiredBuildLogicArtifacts.findAll { relativePath ->
            !new File(destinationDir, relativePath).isFile()
        }
        if (!missingArtifacts.isEmpty()) {
            throw new GradleException(
                    'Release repository is missing build-logic artifacts:\n' +
                            missingArtifacts.join('\n')
            )
        }
    }
}

tasks.register('generateReleaseBundleMetadata') {
    group = 'publishing'
    description = 'Generates the deterministic release manifest and payload checksums.'
    dependsOn(
            tasks.named('stageReleaseRepository'),
            tasks.named('cyclonedxBom'),
            tasks.named('validateReleaseNotes')
    )

    def stagedRepository = layout.buildDirectory.dir('release/repository')
    def metadataDirectory = layout.buildDirectory.dir('release/metadata')
    def releaseManifestFile = metadataDirectory.map { it.file('release-manifest.json') }
    def checksumsFile = metadataDirectory.map { it.file('SHA256SUMS') }
    inputs.dir(stagedRepository)
    inputs.files(
            releaseArtifactManifest,
            releaseLifecycleContract,
            releaseDocumentationFiles.collect { file(it) },
            releaseNotesFile,
            sbomJsonFile,
            sbomXmlFile
    )
    inputs.property('frameworkVersion', project.version.toString())
    inputs.property('springBootVersion', providers.gradleProperty('springBootVersion'))
    outputs.files(releaseManifestFile, checksumsFile)

    doLast {
        def outputDirectory = metadataDirectory.get().asFile
        delete outputDirectory
        outputDirectory.mkdirs()

        def coordinates = releaseArtifactEntries().collect { coordinate ->
            [
                    kind       : coordinate.kind,
                    group_id   : coordinate.groupId,
                    artifact_id: coordinate.artifactId,
                    version    : project.version.toString()
            ]
        }
        def manifest = [
                schema_version    : 1,
                name              : project.name,
                version           : project.version.toString(),
                spring_boot_version: providers.gradleProperty('springBootVersion').get(),
                java_version      : 21,
                repository        : projectUrl,
                tag               : "v${project.version}",
                artifacts         : coordinates,
                sbom              : ['sbom/bom.json', 'sbom/bom.xml'],
                release_notes     : 'documentation/RELEASE_NOTES.md'
        ]
        releaseManifestFile.get().asFile.setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n',
                'UTF-8'
        )

        def payloadFiles = [:]
        fileTree(stagedRepository).matching { include '**/*' }.files
                .findAll { it.isFile() }
                .each { source ->
                    def relative = stagedRepository.get().asFile.toPath()
                            .relativize(source.toPath()).toString().replace('\\', '/')
                    payloadFiles["repository/${relative}"] = source
                }
        payloadFiles['sbom/bom.json'] = sbomJsonFile.get().asFile
        payloadFiles['sbom/bom.xml'] = sbomXmlFile.get().asFile
        releaseDocumentationFiles.each { sourcePath ->
            payloadFiles["documentation/${new File(sourcePath).name}"] = file(sourcePath)
        }
        payloadFiles['documentation/RELEASE_NOTES.md'] = releaseNotesFile.get().asFile
        payloadFiles['metadata/release-artifacts.txt'] = releaseArtifactManifest.asFile
        payloadFiles['metadata/release-lifecycle.properties'] =
                releaseLifecycleContract.asFile
        payloadFiles['metadata/release-manifest.json'] = releaseManifestFile.get().asFile

        checksumsFile.get().asFile.setText(
                payloadFiles.keySet().sort().collect { path ->
                    "${sha256(payloadFiles[path])}  ${path}"
                }.join('\n') + '\n',
                'UTF-8'
        )
    }
}

tasks.register('releaseBundle', Zip) {
    group = 'publishing'
    description = 'Creates the complete reproducible framework release bundle.'
    dependsOn tasks.named('generateReleaseBundleMetadata')
    archiveFileName = "${project.name}-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.named('stageReleaseRepository')) {
        into 'repository'
    }
    from(sbomJsonFile) {
        into 'sbom'
    }
    from(sbomXmlFile) {
        into 'sbom'
    }
    from(releaseDocumentationFiles.collect { file(it) }) {
        into 'documentation'
    }
    from(releaseNotesFile) {
        into 'documentation'
    }
    from(releaseArtifactManifest) {
        into 'metadata'
    }
    from(releaseLifecycleContract) {
        into 'metadata'
    }
    from(layout.buildDirectory.dir('release/metadata')) {
        into 'metadata'
    }
}

tasks.register('generateReleaseBundleChecksum') {
    group = 'publishing'
    description = 'Generates the SHA-256 checksum for the complete release archive.'
    dependsOn tasks.named('releaseBundle')

    def archive = tasks.named('releaseBundle', Zip).flatMap { it.archiveFile }
    def checksum = archive.map { it.asFile.parentFile.toPath()
            .resolve("${it.asFile.name}.sha256").toFile() }
    inputs.file(archive)
    outputs.file(checksum)

    doLast {
        def archiveFile = archive.get().asFile
        checksum.get().setText(
                "${sha256(archiveFile)}  ${archiveFile.name}\n",
                'UTF-8'
        )
    }
}

tasks.named('releaseBundle') {
    finalizedBy tasks.named('generateReleaseBundleChecksum')
}
