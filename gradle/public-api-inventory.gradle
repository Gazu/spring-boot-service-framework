    doLast {
        def configured = publicApiArtifacts.collectMany { it.infrastructureTypes }.toSet()
        def documented = technicalInfrastructureReasons.keySet().toSet()
        def failures = []
        (configured - documented).sort().each { type ->
            failures << "${type}: missing technical visibility reason"
        }
        (documented - configured).sort().each { type ->
            failures << "${type}: reason exists but type is not allowlisted as infrastructure"
        }
        technicalInfrastructureReasons.findAll { type, reason ->
            reason == null || reason.toString().isBlank()
        }.keySet().sort().each { type ->
            failures << "${type}: technical visibility reason must not be blank"
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    "Technical infrastructure allowlist failures:\n${failures.join('\n')}")
        }
    }
}

def frameworkMainSources = fileTree(rootDir) {
    include 'spring-boot-service-framework-*/src/main/java/**/*.java'
    include 'spring-boot-service-framework-starters/*/src/main/java/**/*.java'
    include 'build-logic/*/src/main/java/**/*.java'
    exclude '**/build/**'
}
def moduleBoundaryDocuments = files(
        'spring-boot-service-framework-error-core/src/main/java/com/smbtech/serviceframework/error/package-info.java',
        'spring-boot-service-framework-error-core/README.md',
        'spring-boot-service-framework-starters/spring-boot-service-framework-starter-error-handling/src/main/java/com/smbtech/serviceframework/starter/errorhandling/package-info.java',
        'spring-boot-service-framework-starters/spring-boot-service-framework-starter-error-handling/README.md'
)

tasks.register('validateNoMarkerModuleTypes') {
    group = 'verification'
    description = 'Prevents empty Java *Module marker types and verifies their package documentation replacements.'
    inputs.files(frameworkMainSources, moduleBoundaryDocuments)

    doLast {
        def markerPattern = ~/(?m)^(?:public\s+)?(?:(?:final|abstract|sealed|non-sealed)\s+)*class\s+[A-Za-z_$][A-Za-z0-9_$]*Module\b/
        def failures = frameworkMainSources.files.sort().findAll { source ->
            (source.getText('UTF-8') =~ markerPattern).find()
        }.collect { source ->
            "${rootDir.toPath().relativize(source.toPath())}: replace the *Module marker with package-info.java and README documentation"
        }
        failures.addAll(moduleBoundaryDocuments.files.findAll { !it.isFile() }.collect { source ->
            "missing module boundary document ${rootDir.toPath().relativize(source.toPath())}"
        })

        if (!failures.isEmpty()) {
            throw new GradleException("Module marker convention failures:\n${failures.join('\n')}")
        }
    }
}

tasks.matching {
    it.name in ['documentationCheck', 'codeQualityCheck', 'compatibilityCheck', 'check', 'baseline']
}.configureEach {
    dependsOn(
            tasks.named('validateAutoConfigurationEncapsulation'),
            tasks.named('validateEncapsulationRuleFixtures'),
            tasks.named('validateNoMarkerModuleTypes'),
            tasks.named('validateNoPublicImplementationTypes'),
            tasks.named('validateConcreteReplaceableBeans'),
            tasks.named('validateReplaceableBeanContracts'),
            tasks.named('validatePublicApiNullability'),
            tasks.named('validateSupportedApiDependencyBoundaries'),
            tasks.named('validatePublicApiBoundaryRules'),
            tasks.named('validatePublicApiInventory'),
            tasks.named('validatePublicInternalTypeBaseline'),
            tasks.named('validatePublicTypeClassificationBaseline'),
            tasks.named('validateTechnicalInfrastructureAllowlist')
    )
}

tasks.matching {
    it.name in [
            'validateMarkdownLinks',
            'validateMarkdownStructure',
            'validateDocumentationCatalog',
            'validateDocumentationVersions'
    ]
}.configureEach {
    mustRunAfter tasks.named('generatePublicApiInventory')
}
