tasks.register('validateAutoConfigurationEncapsulation') {
    group = 'verification'
    description = 'Validates Spring Boot auto-configuration discovery and bean method visibility.'
    inputs.files(inventoryInputs)
    inputs.files(fileTree('spring-boot-service-framework-starters') {
        include '*/src/main/resources/META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports'
    })

    doLast {
        def failures = []
        publicApiArtifacts.findAll { artifact ->
            artifact.sourceDirectory.startsWith('spring-boot-service-framework-starters/')
        }.each { artifact ->
            def importsPath = artifact.sourceDirectory.replace(
                    '/src/main/java',
                    '/src/main/resources/META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports')
            def importsFile = file(importsPath)
            if (!importsFile.isFile()) {
                failures << "${artifact.artifact}: missing AutoConfiguration.imports"
                return
            }

            def imports = importsFile.readLines('UTF-8')
                    .collect { it.trim() }
                    .findAll { !it.isEmpty() && !it.startsWith('#') }
            def publicTypes = scanPublicTypes(artifact).collect { it.qualifiedName }.toSet()
            def infrastructureTypes = artifact.infrastructureTypes.toSet()
            def annotatedTypes = imports.findAll { type ->
                def source = new File(
                        file(artifact.sourceDirectory),
                        "${type.replace('.', '/')}.java")
                source.isFile() && (source.getText('UTF-8') =~ /@AutoConfiguration\b/).find()
            }.toSet()

            autoConfigurationImportViolations(
                    imports,
                    publicTypes,
                    infrastructureTypes,
                    annotatedTypes).each { violation ->
                failures << "${artifact.artifact}: ${violation}"
            }

            fileTree(artifact.sourceDirectory) { include '**/*.java' }.files.sort().each { source ->
                def text = source.getText('UTF-8')
                if (!(text =~ /@AutoConfiguration\b/).find() ||
                        !(text =~ publicTypePattern).find()) {
                    return
                }
                findPublicBeanMethods(text).each { method ->
                    failures << "${rootDir.toPath().relativize(source.toPath())}:${method.line}: " +
                            "@Bean method '${method.method}' must be package-private"
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    "Auto-configuration encapsulation failures:\n${failures.join('\n')}")
        }
    }
}

tasks.register('validateSupportedApiDependencyBoundaries') {
    group = 'verification'
    description = 'Prevents supported API types from importing framework implementation packages.'
