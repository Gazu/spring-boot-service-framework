def resolveSourceType = { String returnType, String packageName, Map<String, String> imports ->
    def normalized = returnType.replaceAll(/<.*>/, '').replace('[]', '').trim()
    def firstSegment = normalized.contains('.') ? normalized.substring(0, normalized.indexOf('.')) : normalized
    def imported = imports[firstSegment]
    if (imported != null) {
        return imported + normalized.substring(firstSegment.length())
    }
    if (normalized.contains('.') && Character.isLowerCase(normalized.charAt(0))) {
        return normalized
    }
    "${packageName}.${normalized}"
}

def scanReplaceableBeanMethods = {
    def supportedContracts = supportedReplaceableBeanContracts()
    publicApiArtifacts.findAll { !it.buildLogic }.collectMany { artifact ->
        fileTree(artifact.sourceDirectory) { include '**/*.java' }.files.sort().collectMany { source ->
            def text = source.getText('UTF-8')
            def packageMatcher = text =~ packagePattern
            if (!packageMatcher.find()) {
                return []
            }
            def packageName = packageMatcher.group(1)
            def imports = [:]
            (text =~ /(?m)^import\s+(?!static\s)([A-Za-z_$][A-Za-z0-9_$.]*)\s*;/).each { match ->
                def importedType = match[1].toString()
                imports[importedType.substring(importedType.lastIndexOf('.') + 1)] = importedType
            }
            def annotations = []
            int annotationDepth = 0
            def signature = new StringBuilder()
            def methods = []
            text.readLines().each { line ->
                def trimmed = line.trim()
                if (annotationDepth > 0) {
                    annotationDepth += trimmed.count('(') - trimmed.count(')')
                    return
                }
                if (trimmed.startsWith('@')) {
                    if (signature.length() > 0) {
                        signature.setLength(0)
                    }
                    def annotationMatcher = trimmed =~ /^@(?:[A-Za-z_$][A-Za-z0-9_$.]*\.)?([A-Za-z_$][A-Za-z0-9_$]*)/
                    if (annotationMatcher.find()) {
                        annotations << annotationMatcher.group(1)
                    }
                    annotationDepth = trimmed.count('(') - trimmed.count(')')
                    return
                }
                if (annotations.isEmpty() || trimmed.isEmpty() || trimmed.startsWith('//') ||
                        trimmed.startsWith('/*') || trimmed.startsWith('*')) {
                    return
                }
                signature.append(' ').append(trimmed)
                if (!signature.toString().contains('(')) {
                    if (trimmed.contains('{')) {
                        annotations.clear()
                        signature.setLength(0)
                    }
                    return
                }
                def methodMatcher = signature.toString().trim() =~ /^(?:(?:public|protected|private|static|final|synchronized|abstract|native|default)\s+)*(?:<[^>]+>\s+)?([A-Za-z_$][^()=;{}]*?)\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*\(/
                if (methodMatcher.find() && annotations.contains('Bean') &&
                        annotations.contains('ConditionalOnMissingBean')) {
                    def returnType = methodMatcher.group(1).replaceAll(/\s+/, ' ').trim()
                    def resolvedReturnType = resolveSourceType(returnType, packageName, imports)
                    methods << [
                            artifact: artifact.artifact,
                            owner: "${packageName}.${source.name.replaceFirst(/\.java$/, '')}",
                            method: methodMatcher.group(2),
                            returnType: resolvedReturnType,
                            supportedContract: supportedContracts.contains(resolvedReturnType)
                    ]
                }
                annotations.clear()
                signature.setLength(0)
            }
            methods
        }
    }
}

def discoverConcreteReplaceableBeans = {
    scanReplaceableBeanMethods().findAll { !it.supportedContract }.collect { bean ->
        "${bean.artifact}|${bean.owner}#${bean.method}|${bean.returnType}"
    }.toSet().sort()
}

def discoverReplaceableBeanContracts = {
    scanReplaceableBeanMethods().findAll { it.supportedContract }.collect { bean ->
        "${bean.artifact}|${bean.returnType}"
    }.toSet().sort()
}

def renderConcreteReplaceableBeanBaseline = {
    def output = new StringBuilder()
    output << '# Generated by ./gradlew generateConcreteReplaceableBeanBaseline. Do not edit manually.\n'
    output << '# Existing @ConditionalOnMissingBean methods returning concrete types; this baseline may only shrink.\n'
    discoverConcreteReplaceableBeans().each { bean -> output << "${bean}\n" }
    output.toString()
}

