def publicTypePattern = ~/(?m)^public\s+(?:(?:final|abstract|sealed|non-sealed)\s+)*(class|interface|record|enum|@interface)\s+([A-Za-z_$][A-Za-z0-9_$]*)/
def packagePattern = ~/(?m)^package\s+([A-Za-z_$][A-Za-z0-9_$.]*)\s*;/

def scanPublicTypes = { Map artifact ->
    def sourceDirectory = file(artifact.sourceDirectory)
    if (!sourceDirectory.isDirectory()) {
        throw new GradleException("Missing public API source directory: ${artifact.sourceDirectory}")
    }

    fileTree(sourceDirectory) { include '**/*.java' }.files.sort().collectMany { source ->
        def text = source.getText('UTF-8')
        def packageMatcher = text =~ packagePattern
        if (!packageMatcher.find()) {
            return []
        }
        def packageName = packageMatcher.group(1)
        def typeMatcher = text =~ publicTypePattern
        if (!typeMatcher.find()) {
            return []
        }
        def kind = typeMatcher.group(1) == '@interface' ? 'annotation' : typeMatcher.group(1)
        def simpleName = typeMatcher.group(2)
        [[
                packageName: packageName,
                simpleName : simpleName,
                qualifiedName: "${packageName}.${simpleName}".toString(),
                kind       : kind
        ]]
    }.sort { left, right -> left.qualifiedName <=> right.qualifiedName }
}

def readConfigurationProperties = { Map artifact ->
    def properties = new TreeSet<String>()
    properties.addAll(artifact.configurationProperties as Collection<String>)
    if (artifact.propertyReference) {
        def reference = file(artifact.propertyReference)
        if (!reference.isFile()) {
            throw new GradleException("Missing property reference: ${artifact.propertyReference}")
        }
        reference.eachLine('UTF-8') { line ->
            def matcher = line =~ /^\|\s*`([^`]+)`\s*\|/
            if (matcher.find()) {
                properties.add(matcher.group(1))
            }
        }
    }
    properties.toList()
}

def markdownList = { Collection<String> values ->
    values.isEmpty() ? '- None.' : values.collect { "- `${it}`" }.join('\n')
}

def markdownTypeList = { Collection<Map<String, String>> types ->
    types.isEmpty()
            ? '- None.'
            : types.collect { "- `${it.qualifiedName}` (${it.kind})" }.join('\n')
}

def markdownInfrastructureTypeList = { Collection<Map<String, String>> types ->
    types.isEmpty()
            ? '- None.'
            : types.collect {
                "- `${it.qualifiedName}` (${it.kind}): ${technicalInfrastructureReasons[it.qualifiedName]}"
            }.join('\n')
}

def hasPackageSegment = { String packageName, Set<String> segments ->
    packageName.split(/\./).any { segments.contains(it) }
}

def isConventionPublicPackage = { Map artifact, String packageName ->
    !artifact.buildLogic &&
            !hasPackageSegment(packageName, implementationPackageSegments) &&
            hasPackageSegment(packageName, supportedPackageSegments)
}

def classifyPublicType = { Map artifact, Map type ->
    if (artifact.infrastructureTypes.contains(type.qualifiedName)) {
        return 'TECHNICAL_INFRASTRUCTURE'
    }
    boolean supported =
            isConventionPublicPackage(artifact, type.packageName) ||
                    artifact.publicPackageExceptions.contains(type.packageName) ||
                    artifact.publicTypeExceptions.contains(type.qualifiedName)
    if (supported) {
        return type.kind in ['interface', 'annotation']
                ? 'SUPPORTED_EXTENSION_POINT'
                : 'SUPPORTED_API'
    }
    'INTERNAL_IMPLEMENTATION'
}

