tasks.register('validateEncapsulationRuleFixtures') {
    group = 'verification'
    description = 'Verifies public visibility and auto-configuration rules against representative fixtures.'

    doLast {
        def failures = []
        def artifact = [
                buildLogic: false,
                publicPackageExceptions: [],
                publicTypeExceptions: [],
                infrastructureTypes: []
        ]
        def internalType = [
                packageName: 'com.example.internal',
                qualifiedName: 'com.example.internal.AccidentalService',
                kind: 'class'
        ]
        if (classifyPublicType(artifact, internalType) != 'INTERNAL_IMPLEMENTATION') {
            failures << 'a public implementation type must be classified as forbidden internal implementation'
        }
        if (findPublicBeanMethods('@Bean\npublic Object exposedBean() { return null; }').isEmpty()) {
            failures << 'a public @Bean method must be rejected'
        }
        if (!findPublicBeanMethods('@Bean\nObject internalBean() { return null; }').isEmpty()) {
            failures << 'a package-private @Bean method must be accepted'
        }
        if (!isImplementationTypeReference(
                'com.example.adapter.out.spring.DefaultService')) {
            failures << 'an adapter dependency must be classified as implementation'
        }
        if (isImplementationTypeReference('com.example.api.Service')) {
            failures << 'an API dependency must not be classified as implementation'
        }
        def validAutoConfiguration = 'com.example.autoconfigure.ValidAutoConfiguration'
        if (!autoConfigurationImportViolations(
                [validAutoConfiguration],
                [validAutoConfiguration] as Set,
                [validAutoConfiguration] as Set,
                [validAutoConfiguration] as Set).isEmpty()) {
            failures << 'a fully classified auto-configuration import must be accepted'
        }
        if (autoConfigurationImportViolations(
                [validAutoConfiguration, validAutoConfiguration],
                [validAutoConfiguration] as Set,
                [validAutoConfiguration] as Set,
                [validAutoConfiguration] as Set).isEmpty()) {
            failures << 'a duplicate auto-configuration import must be rejected'
        }
        if (!failures.isEmpty()) {
            throw new GradleException("Encapsulation rule fixture failures:\n${failures.join('\n')}")
        }
    }
}

