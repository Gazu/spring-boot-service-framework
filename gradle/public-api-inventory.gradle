]

def discoverPublicInternalTypes = {
    publicApiArtifacts.collectMany { artifact ->
        scanPublicTypes(artifact).findAll { type ->
            classifyPublicType(artifact, type) == 'INTERNAL_IMPLEMENTATION'
        }.collect { type -> "${artifact.artifact}|${type.kind}|${type.qualifiedName}" }
    }.toSet().sort()
}

def findPublicBeanMethods = { String source ->
    def methods = []
    boolean beanAnnotationFound = false
    int annotationDepth = 0
    int declarationLine = 0
    def signature = new StringBuilder()

    source.readLines().eachWithIndex { line, index ->
        def trimmed = line.trim()
        if (annotationDepth > 0) {
            annotationDepth += trimmed.count('(') - trimmed.count(')')
            return
        }
        if (trimmed.startsWith('@')) {
            def annotationMatcher = trimmed =~ /^@(?:[A-Za-z_$][A-Za-z0-9_$.]*\.)?([A-Za-z_$][A-Za-z0-9_$]*)/
            if (annotationMatcher.find() && annotationMatcher.group(1) == 'Bean') {
                beanAnnotationFound = true
                declarationLine = index + 1
            }
            annotationDepth = trimmed.count('(') - trimmed.count(')')
            return
        }
        if (!beanAnnotationFound || trimmed.isEmpty() || trimmed.startsWith('//') ||
                trimmed.startsWith('/*') || trimmed.startsWith('*')) {
            return
        }

        signature.append(' ').append(trimmed)
        if (!signature.toString().contains('(')) {
            if (trimmed.contains('{') || trimmed.contains(';')) {
                beanAnnotationFound = false
                signature.setLength(0)
            }
            return
        }

        def methodMatcher = signature.toString().trim() =~ /^(public|protected)\s+(?:(?:static|final|synchronized|abstract|native)\s+)*(?:<[^>]+>\s+)?[A-Za-z_$][^()=;{}]*?\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*\(/
        if (methodMatcher.find()) {
            methods << [
                    line      : declarationLine,
                    visibility: methodMatcher.group(1),
                    method    : methodMatcher.group(2)
            ]
        }
        beanAnnotationFound = false
        signature.setLength(0)
    }
    methods
}

def autoConfigurationImportViolations = {
    Collection<String> imports,
    Set<String> publicTypes,
    Set<String> infrastructureTypes,
    Set<String> annotatedTypes ->
    def failures = []
    imports.groupBy { it }.findAll { type, occurrences -> occurrences.size() > 1 }.keySet()
            .sort().each { type ->
        failures << "${type}: duplicate auto-configuration import"
    }
    imports.toSet().sort().each { type ->
        if (!publicTypes.contains(type)) {
            failures << "${type}: imported auto-configuration must be a public top-level type"
        }
        if (!infrastructureTypes.contains(type)) {
            failures << "${type}: imported auto-configuration must be explicitly allowlisted as technical infrastructure"
        }
        if (!annotatedTypes.contains(type)) {
            failures << "${type}: imported type must declare @AutoConfiguration"
        }
    }
    (infrastructureTypes.findAll { it.endsWith('AutoConfiguration') }.toSet() - imports.toSet())
            .sort().each { type ->
        failures << "${type}: allowlisted auto-configuration is missing from AutoConfiguration.imports"
    }
    failures
}

