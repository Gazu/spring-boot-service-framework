tasks.register('validatePublicApiBoundaryRules') {
    group = 'verification'
    description = 'Validates supported and implementation package classification rules.'

    doLast {
        def standardArtifact = [buildLogic: false]
        def buildLogicArtifact = [buildLogic: true]
        def expectations = [
                'com.example.domain'        : true,
                'com.example.domain.value'  : true,
                'com.example.port.in'       : true,
                'com.example.api'           : true,
                'com.example.api.oauth2'    : true,
                'com.example.apiclient'     : false,
                'com.example.adapter.out'   : false,
                'com.example.adapter.api'   : false,
                'com.example.autoconfigure' : false,
                'com.example.application'   : false,
                'com.example.serialization' : false,
                'com.example.internal'      : false,
                'com.example.service'       : false
        ]
        def failures = expectations.findAll { packageName, expected ->
            isConventionPublicPackage(standardArtifact, packageName) != expected
        }.collect { packageName, expected -> "${packageName}: expected supported=${expected}" }

        if (isConventionPublicPackage(buildLogicArtifact, 'com.example.api')) {
            failures << 'build logic must remain implementation even when its package contains api'
        }
        def classificationFixtures = [
                [
                        artifact: [
                                buildLogic: false,
                                publicPackageExceptions: [],
                                publicTypeExceptions: [],
                                infrastructureTypes: []
                        ],
                        type: [
                                packageName: 'com.example.api',
                                qualifiedName: 'com.example.api.Extension',
                                kind: 'interface'
                        ],
                        expected: 'SUPPORTED_EXTENSION_POINT'
                ],
                [
                        artifact: [
                                buildLogic: false,
                                publicPackageExceptions: [],
                                publicTypeExceptions: [],
                                infrastructureTypes: []
                        ],
                        type: [
                                packageName: 'com.example.domain',
                                qualifiedName: 'com.example.domain.Value',
                                kind: 'record'
                        ],
                        expected: 'SUPPORTED_API'
                ],
                [
                        artifact: [
                                buildLogic: false,
                                publicPackageExceptions: [],
                                publicTypeExceptions: [],
                                infrastructureTypes: ['com.example.adapter.FrameworkAdapter']
                        ],
                        type: [
                                packageName: 'com.example.adapter',
                                qualifiedName: 'com.example.adapter.FrameworkAdapter',
                                kind: 'class'
                        ],
                        expected: 'TECHNICAL_INFRASTRUCTURE'
                ],
                [
                        artifact: [
                                buildLogic: false,
                                publicPackageExceptions: [],
                                publicTypeExceptions: [],
                                infrastructureTypes: []
                        ],
                        type: [
                                packageName: 'com.example.internal',
                                qualifiedName: 'com.example.internal.DefaultService',
                                kind: 'class'
                        ],
                        expected: 'INTERNAL_IMPLEMENTATION'
                ]
        ]
        classificationFixtures.each { fixture ->
            def actual = classifyPublicType(fixture.artifact, fixture.type)
            if (actual != fixture.expected) {
                failures << "${fixture.type.qualifiedName}: expected classification=${fixture.expected}, actual=${actual}"
            }
        }
        if (unreviewedBaselineAdditions(['new'], []).toList() != ['new']) {
            failures << 'a new implementation must be detected as baseline growth'
        }
        if (!unreviewedBaselineAdditions([], ['removed']).isEmpty()) {
            failures << 'removing reviewed implementation debt must not be treated as baseline growth'
        }
        if (!failures.isEmpty()) {
            throw new GradleException("Public API boundary rule failures:\n${failures.join('\n')}")
        }
    }
}

