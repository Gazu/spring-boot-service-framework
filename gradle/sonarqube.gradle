def sonarProjectKey = providers.gradleProperty('sonarProjectKey')
        .orElse(providers.environmentVariable('SONAR_PROJECT_KEY'))
        .orElse(rootProject.name)
def sonarProjectName = providers.gradleProperty('sonarProjectName')
        .orElse(providers.environmentVariable('SONAR_PROJECT_NAME'))
        .orElse('Spring Boot Service Framework')

sonar {
    properties {
        property 'sonar.projectKey', sonarProjectKey.get()
        property 'sonar.projectName', sonarProjectName.get()
        property 'sonar.projectVersion', providers.gradleProperty('frameworkVersion').get()
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.java.source', '21'
        property 'sonar.scm.provider', 'git'
        property 'sonar.exclusions', [
                '**/build/**',
                '**/generated/**'
        ].join(',')
        property 'sonar.coverage.exclusions', [
                '**/package-info.java',
                '**/generated/**'
        ].join(',')
    }
}

subprojects {
    sonar {
        properties {
            property 'sonar.coverage.jacoco.xmlReportPaths',
                    layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml')
                            .get().asFile.absolutePath
        }
    }
}

tasks.named('sonar') {
    dependsOn tasks.named('baseline')
}
