tasks.register('releaseLifecycleCheck') {
    group = 'verification'
    description = 'Validates the versioned release lifecycle and its CI integration.'

    inputs.files(
            releaseLifecycleContract,
            releaseArtifactManifest,
            releaseWorkflow,
            reusablePublicationWorkflowFile,
            releaseDocumentation,
            layout.projectDirectory.file('gradle/lifecycle.gradle')
    )
    inputs.property('reusablePublicationWorkflow', reusablePublicationWorkflow)

    doLast {
        def contract = new Properties()
        releaseLifecycleContract.asFile.withInputStream { contract.load(it) }
        def expectedContract = [
                schemaVersion   : '1',
                gateTask        : 'releaseGate',
                candidateTask   : 'releaseCandidate',
                bundleTask      : 'releaseBundle',
                releaseNotesTask: 'generateReleaseNotes',
                verifyBundleTask: 'verifyReleaseBundle',
                prepareTask     : 'prepareRelease',
                publishTask     : 'publishRelease',
                artifactManifest: 'gradle/release-artifacts.txt',
                releaseProperty : 'releaseBuild',
                remoteRepository: 'privateRegistry',
                tagPrefix       : 'v',
                bundleManifestSchema: '1',
                bundleChecksumAlgorithm: 'SHA-256'
        ]
        def failures = []
        expectedContract.each { property, expectedValue ->
            if (contract.getProperty(property) != expectedValue) {
                failures.add("${property} must be ${expectedValue}")
            }
        }
        if (contract.size() != expectedContract.size()) {
            failures.add('release lifecycle contract contains unreviewed properties')
        }

        def workflowText = releaseWorkflow.asFile.getText('UTF-8')
        if (!workflowText.contains("uses: ${reusablePublicationWorkflow}")) {
            failures.add('release workflow must call the repository-local reusable publication')
        }
        [
                'artifact-metadata: write',
                'prepare_task: prepareRelease',
                'publish_task: publishRelease',
                'artifact_manifest: gradle/release-artifacts.txt',
                'bundle_basename: spring-boot-service-framework',
                'build/distributions/*.zip.sha256',
                'build/release/documentation/RELEASE_NOTES.md',
                'build/reports/release/lifecycle.txt',
                'release_environment: release',
                'dry_run:'
        ].each { workflowMarker ->
            if (!workflowText.contains(workflowMarker)) {
                failures.add("release workflow must contain ${workflowMarker}")
            }
        }
        if (workflowText =~ /(?m)^    env:\s*$/) {
            failures.add('release secrets must be scoped to the steps that consume them')
        }
        if (workflowText.contains('secrets: inherit')) {
            failures.add('release workflow must use environment-scoped publisher secrets')
        }
        [
                'PRIVATE_MAVEN_URL: ${{ secrets.PRIVATE_MAVEN_URL }}',
                'PRIVATE_MAVEN_USERNAME: ${{ secrets.PRIVATE_MAVEN_USERNAME }}',
                'PRIVATE_MAVEN_PASSWORD: ${{ secrets.PRIVATE_MAVEN_PASSWORD }}',
                'SIGNING_KEY: ${{ secrets.SIGNING_KEY }}',
                'SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}'
        ].each { secretMapping ->
            if (!workflowText.contains(secretMapping)) {
                failures.add("release workflow must explicitly grant ${secretMapping}")
            }
        }

        def reusableWorkflowText = reusablePublicationWorkflowFile.asFile.getText('UTF-8')
        [
                'workflow_call:',
                'environment: ${{ inputs.release_environment }}',
                'https://maven.pkg.github.com/gazu/service-framework-packages',
                'for required_scope in write:packages; do',
                'git verify-tag "${RELEASE_TAG}"',
                './gradlew "${PUBLISH_TASK}"',
                'done <"${ARTIFACT_MANIFEST}"'
        ].each { reusableMarker ->
            if (!reusableWorkflowText.contains(reusableMarker)) {
                failures.add("reusable publication must contain ${reusableMarker}")
            }
        }
        [
                'PRIVATE_MAVEN_URL',
                'PRIVATE_MAVEN_USERNAME',
                'PRIVATE_MAVEN_PASSWORD',
                'SIGNING_KEY',
                'SIGNING_PASSWORD'
        ].each { secretName ->
            def declarationPattern =
                    "(?m)^      ${secretName}:\\n        description: .+\\n        required: true"
            if (!(reusableWorkflowText =~ declarationPattern)) {
                failures.add("reusable publication must require ${secretName}")
            }
        }
        if (reusableWorkflowText =~ /(?m)^  (push|pull_request|workflow_dispatch):/) {
            failures.add('reusable publication must expose workflow_call only')
        }
        if (reusableWorkflowText.contains('secrets: inherit')) {
            failures.add('reusable publication must use release environment secrets')
        }
        (reusableWorkflowText =~ /(?m)^\s+uses:\s+(\S+)/).each { match ->
            if (!(match[1] ==~ /.+@[0-9a-f]{40}/)) {
                failures.add("reusable action must be pinned by commit SHA: ${match[1]}")
            }
        }

        def documentationText = releaseDocumentation.asFile.getText('UTF-8')
        [
                'releaseGate',
                'releaseCandidate',
                'generateReleaseNotes',
                'prepareRelease',
                'publishRelease',
                'release-manifest.json',
                'SHA256SUMS'
        ].each { taskName ->
            if (!documentationText.contains(taskName)) {
                failures.add("release documentation must describe ${taskName}")
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    'Release lifecycle validation failed:\n' + failures.join('\n')
            )
        }
    }
}

tasks.register('validateReleasePreparation') {
    group = 'verification'
    description = 'Validates version and signing inputs required to prepare a release.'
    dependsOn tasks.named('validateReleaseNotes')

    doLast {
        def failures = []
        if (!releaseBuild.get()) {
            failures.add('prepareRelease requires -PreleaseBuild=true')
        }
        if (!(project.version.toString() ==~ /(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)/)) {
            failures.add("frameworkVersion must be a stable SemVer version: ${project.version}")
        }
        if (!signingKey.isPresent()) {
            failures.add('prepareRelease requires SIGNING_KEY or -PsigningKey')
        }
        if (!file('CHANGELOG.md').getText('UTF-8').contains(
                "## ${project.version} -"
        )) {
            failures.add("CHANGELOG.md must contain a ${project.version} release section")
        }
        def changelog = file('CHANGELOG.md').getText('UTF-8')
        def unreleasedMatcher = (changelog =~ /(?s)## Unreleased\s+(.*?)\s+## /)
        if (!unreleasedMatcher.find() ||
                unreleasedMatcher.group(1).trim() != 'No unreleased changes.') {
            failures.add('prepareRelease requires an empty Unreleased changelog section')
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'Release preparation validation failed:\n' + failures.join('\n')
            )
        }
    }
}

tasks.register('validateReleasePublication') {
    group = 'verification'
    description = 'Validates private registry inputs required to publish a release.'
    dependsOn tasks.named('validateReleasePreparation')

    doLast {
        def failures = []
        if (!privateRepositoryUrl.isPresent()) {
            failures.add('publishRelease requires PRIVATE_MAVEN_URL or -PprivateMavenUrl')
        } else {
            try {
                def repositoryUri = new URI(privateRepositoryUrl.get())
                if (!repositoryUri.isAbsolute()) {
                    failures.add('private Maven repository URL must be absolute')
                }
            } catch (Exception ignored) {
                failures.add('private Maven repository URL must be a valid URI')
            }
        }
        if (!privateRepositoryUsername.isPresent()) {
            failures.add(
                    'publishRelease requires PRIVATE_MAVEN_USERNAME or -PprivateMavenUsername'
            )
        }
        if (!privateRepositoryPassword.isPresent()) {
            failures.add(
                    'publishRelease requires PRIVATE_MAVEN_PASSWORD or -PprivateMavenPassword'
            )
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'Release publication validation failed:\n' + failures.join('\n')
            )
        }
    }
}

