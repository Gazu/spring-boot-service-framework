def supportedApiConsumerDirectory = file('gradle/compatibility/consumers/supported-api')
def supportedApiConsumerSources = fileTree(supportedApiConsumerDirectory) {
    include 'src/**/*.java'
}

tasks.register('validateSupportedApiConsumerImports') {
    group = 'verification'
    description = 'Ensures the compile-only contract consumer imports supported API package segments only.'
    inputs.files(supportedApiConsumerSources)

    doLast {
        def supportedImport = ~/^com\.smbtech\.serviceframework(?:\.[A-Za-z_$][A-Za-z0-9_$]*)*\.(?:api|domain|port)(?:\..+)?$/
        def violations = []
        supportedApiConsumerSources.files.sort().each { source ->
            source.eachLine('UTF-8') { line, lineNumber ->
                def matcher = line =~ /^import\s+(com\.smbtech\.serviceframework\.[A-Za-z0-9_$.]+);$/
                if (matcher.find() && !(matcher.group(1) ==~ supportedImport)) {
                    violations << "${rootDir.toPath().relativize(source.toPath())}:${lineNumber}: ${matcher.group(1)}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Supported API consumer imports implementation packages:\n${violations.join('\n')}")
        }
    }
}

