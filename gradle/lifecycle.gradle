tasks.register('verifyReleaseBundle') {
    group = 'verification'
    description = 'Validates the complete release archive, coordinates, and checksums.'
    dependsOn tasks.named('generateReleaseBundleChecksum'), tasks.named('releaseGate')

    def stagedRepository = layout.buildDirectory.dir('release/repository')
    def releaseArchive = layout.buildDirectory.file(
            "distributions/${project.name}-${project.version}.zip"
    )
    def releaseArchiveChecksum = layout.buildDirectory.file(
            "distributions/${project.name}-${project.version}.zip.sha256"
    )
    def lifecycleReport = layout.buildDirectory.file('reports/release/lifecycle.txt')
    inputs.file(releaseArtifactManifest)
    inputs.dir(stagedRepository)
    inputs.file(releaseArchive)
    inputs.file(releaseArchiveChecksum)
    inputs.property('releaseBuild', releaseBuild)
    outputs.file(lifecycleReport)

    doLast {
        def failures = []
        def coordinates = []
        releaseArtifactManifest.asFile.eachLine('UTF-8') { line ->
            def normalized = line.trim()
            if (!normalized || normalized.startsWith('#')) {
                return
            }
            def parts = normalized.split('\\|', -1)*.trim()
            if (parts.size() == 3) {
                coordinates.add([kind: parts[0], groupId: parts[1], artifactId: parts[2]])
            }
        }

        def repositoryDirectory = stagedRepository.get().asFile
        def allowedVersionDirectories = coordinates.collect { coordinate ->
            coordinate.groupId.replace('.', '/') + '/' + coordinate.artifactId +
                    "/${project.version}/"
        } as Set
        repositoryDirectory.eachFileRecurse(FileType.FILES) { repositoryFile ->
            def relativePath = repositoryDirectory.toPath()
                    .relativize(repositoryFile.toPath()).toString().replace('\\', '/')
            if (!allowedVersionDirectories.any { relativePath.startsWith(it) }) {
                failures.add("unexpected staged artifact: ${relativePath}")
            }
        }

        coordinates.each { coordinate ->
            def versionDirectory = new File(
                    repositoryDirectory,
                    coordinate.groupId.replace('.', '/') + '/' + coordinate.artifactId +
                            '/' + project.version
            )
            def artifactBaseName = "${coordinate.artifactId}-${project.version}"
            def requiredSuffixes = ['.pom']
            if (coordinate.kind == 'platform') {
                requiredSuffixes.add('.module')
            } else if (coordinate.kind != 'plugin-marker') {
                requiredSuffixes.addAll([
                        '.module',
                        '.jar',
                        '-sources.jar',
                        '-javadoc.jar'
                ])
            }

            requiredSuffixes.each { suffix ->
                def artifactFile = new File(
                        versionDirectory,
                        "${artifactBaseName}${suffix}"
                )
                if (!artifactFile.isFile()) {
                    failures.add(
                            "missing staged ${suffix}: " +
                                    "${coordinate.groupId}:${coordinate.artifactId}"
                    )
                    return
                }
                def sha256Sidecar = new File("${artifactFile}.sha256")
                if (!sha256Sidecar.isFile() ||
                        sha256Sidecar.getText('UTF-8').trim() != sha256File(artifactFile)) {
                    failures.add(
                            "invalid SHA-256 sidecar for ${artifactFile.name}"
                    )
                }
                if (releaseBuild.get() && !new File("${artifactFile}.asc").isFile()) {
                    failures.add(
                            "missing signature for ${coordinate.groupId}:" +
                                    "${coordinate.artifactId}:${suffix}"
                    )
                }
            }
        }

        def archiveFile = releaseArchive.get().asFile
        def archiveChecksumFile = releaseArchiveChecksum.get().asFile
        if (!archiveFile.isFile()) {
            failures.add('release archive was not generated')
        }
        if (!archiveChecksumFile.isFile()) {
            failures.add('release archive checksum was not generated')
        } else {
            def checksumMatcher = archiveChecksumFile.getText('UTF-8').trim() =~
                    /^([0-9a-f]{64})  (.+)$/
            if (!checksumMatcher.matches() || checksumMatcher.group(2) != archiveFile.name ||
                    checksumMatcher.group(1) != sha256File(archiveFile)) {
                failures.add('release archive checksum is invalid')
            }
        }

        def archiveEntryCount = 0
        if (archiveFile.isFile()) {
            def archive = new ZipFile(archiveFile)
            try {
                def entries = archive.entries().toList()
                def entryNames = entries.collect { it.name }
                archiveEntryCount = entries.count { !it.directory }
                def duplicateEntries = entryNames.groupBy { it }
                        .findAll { ignored, matching -> matching.size() > 1 }
                        .keySet()
                duplicateEntries.each { failures.add("duplicate archive entry: ${it}") }
                entryNames.findAll { name ->
                    name.startsWith('/') || name.contains('../') || name.contains('\\')
                }.each { failures.add("unsafe archive entry: ${it}") }
                if (entryNames.any { it.startsWith('repository/com/smbtech/contracts/') }) {
                    failures.add('release archive contains generated OpenAPI example artifacts')
                }

                def requiredBundleEntries = [
                        'documentation/README.md',
                        'documentation/CHANGELOG.md',
                        'documentation/RELEASE_NOTES.md',
                        'documentation/LICENSE',
                        'documentation/releasing.md',
                        'metadata/release-artifacts.txt',
                        'metadata/release-lifecycle.properties',
                        'metadata/release-manifest.json',
                        'metadata/SHA256SUMS',
                        'sbom/bom.json',
                        'sbom/bom.xml'
                ]
                requiredBundleEntries.findAll { !entryNames.contains(it) }.each {
                    failures.add("missing archive entry: ${it}")
                }

                def checksumEntry = archive.getEntry('metadata/SHA256SUMS')
                if (checksumEntry != null) {
                    def checksumLines = archive.getInputStream(checksumEntry)
                            .getText('UTF-8').readLines().findAll { it }
                    def payloadChecksums = [:]
                    checksumLines.each { checksumLine ->
                        def matcher = checksumLine =~ /^([0-9a-f]{64})  (.+)$/
                        if (!matcher.matches()) {
                            failures.add("invalid SHA256SUMS entry: ${checksumLine}")
                            return
                        }
                        def payloadPath = matcher.group(2)
                        if (payloadChecksums.containsKey(payloadPath)) {
                            failures.add("duplicate SHA256SUMS path: ${payloadPath}")
                        }
                        payloadChecksums[payloadPath] = matcher.group(1)
                    }
                    def expectedPayloadPaths = entries.findAll {
                        !it.directory && it.name != 'metadata/SHA256SUMS'
                    }.collect { it.name }.toSet()
                    if (payloadChecksums.keySet() != expectedPayloadPaths) {
                        failures.add('SHA256SUMS does not cover the exact release payload')
                    }
                    payloadChecksums.each { payloadPath, expectedChecksum ->
                        def payloadEntry = archive.getEntry(payloadPath)
                        if (payloadEntry == null) {
                            return
                        }
                        def actualChecksum = archive.getInputStream(payloadEntry).withCloseable {
                            sha256InputStream(it)
                        }
                        if (actualChecksum != expectedChecksum) {
                            failures.add("checksum mismatch: ${payloadPath}")
                        }
                    }
                }

                def manifestEntry = archive.getEntry('metadata/release-manifest.json')
                if (manifestEntry != null) {
                    def manifest = archive.getInputStream(manifestEntry).withCloseable {
                        new JsonSlurper().parse(it)
                    }
                    if (manifest.schema_version != 1 ||
                            manifest.name != project.name ||
                            manifest.version != project.version.toString() ||
                            manifest.tag != "v${project.version}" ||
                            manifest.release_notes !=
                                    'documentation/RELEASE_NOTES.md') {
                        failures.add('release manifest identity is invalid')
                    }
                    def expectedCoordinates = coordinates.collect {
                        "${it.kind}|${it.groupId}|${it.artifactId}|${project.version}"
                    }.toSet()
                    def manifestCoordinates = (manifest.artifacts ?: []).collect {
                        "${it.kind}|${it.group_id}|${it.artifact_id}|${it.version}"
                    }.toSet()
                    if (manifestCoordinates != expectedCoordinates) {
                        failures.add('release manifest coordinates do not match the contract')
                    }
                }
            } finally {
                archive.close()
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'Release bundle validation failed:\n' + failures.join('\n')
            )
        }

        def reportFile = lifecycleReport.get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.setText(
                "version=${project.version}\n" +
                        "artifacts=${coordinates.size()}\n" +
                        "signed=${releaseBuild.get()}\n" +
                        "archive=${archiveFile.name}\n" +
                        "checksum=${archiveChecksumFile.name}\n" +
                        "files=${archiveEntryCount}\n",
                'UTF-8'
        )
    }
}

tasks.register('releaseCandidate') {
    group = 'publishing'
    description = 'Builds and verifies an unpublished release candidate for review.'
    dependsOn tasks.named('verifyReleaseBundle')

    def archive = layout.buildDirectory.file(
            "distributions/${project.name}-${project.version}.zip"
    )
    def archiveChecksum = layout.buildDirectory.file(
            "distributions/${project.name}-${project.version}.zip.sha256"
    )
    def releaseNotes = layout.buildDirectory.file(
            'release/documentation/RELEASE_NOTES.md'
    )
    def candidateReport = layout.buildDirectory.file(
            'reports/release/candidate.properties'
    )
    inputs.files(archive, archiveChecksum, releaseNotes)
    inputs.property('frameworkVersion', project.version.toString())
    outputs.file(candidateReport)
    outputs.upToDateWhen { false }

    doLast {
        if (releaseBuild.get()) {
            throw new GradleException(
                    'releaseCandidate must run without -PreleaseBuild=true; ' +
                            'use prepareRelease for a signed tag build.'
            )
        }
        def commit = providers.exec {
            commandLine 'git', 'rev-parse', 'HEAD'
        }.standardOutput.asText.get().trim()
        def sourceStatus = providers.exec {
            commandLine 'git', 'status', '--porcelain'
        }.standardOutput.asText.get()
        def checksum = archiveChecksum.get().asFile.getText('UTF-8')
                .trim().split('\\s+', 2)[0]
        def output = candidateReport.get().asFile
        output.parentFile.mkdirs()
        output.setText(
                "schema_version=1\n" +
                        "status=VERIFIED\n" +
                        "version=${project.version}\n" +
                        "tag=v${project.version}\n" +
                        "commit=${commit}\n" +
                        "source_clean=${sourceStatus.trim().isEmpty()}\n" +
                        "signed=false\n" +
                        "published=false\n" +
                        "archive=${archive.get().asFile.name}\n" +
                        "archive_sha256=${checksum}\n" +
                        "release_notes=build/release/documentation/RELEASE_NOTES.md\n",
                'UTF-8'
        )
    }
}

tasks.register('prepareRelease') {
    group = 'publishing'
    description = 'Runs the release gate and creates a verified signed release bundle.'
    dependsOn(
            tasks.named('validateReleasePreparation'),
            tasks.named('verifyReleaseBundle')
    )
}

def mainBuildRemotePublicationTasks = providers.provider {
    subprojects.collectMany { candidate ->
        candidate.tasks.withType(PublishToMavenRepository).findAll { publishTask ->
            publishTask.name.endsWith('ToPrivateRegistryRepository')
        }
    }
}

tasks.register('publishBuildLogicRelease', Exec) {
    group = 'publishing'
    description = 'Publishes the included build-logic artifacts after release preparation.'
    dependsOn(
            tasks.named('prepareRelease'),
            tasks.named('validateReleasePublication')
    )
    workingDir rootDir
    commandLine(
            './gradlew',
            '-p',
            'build-logic',
            'publishReleaseArtifacts',
            '-PreleaseBuild=true',
            '--no-daemon',
            '--stacktrace'
    )
    doFirst {
        environment 'PRIVATE_MAVEN_URL', privateRepositoryUrl.get()
        environment 'PRIVATE_MAVEN_USERNAME', privateRepositoryUsername.get()
        environment 'PRIVATE_MAVEN_PASSWORD', privateRepositoryPassword.get()
        environment 'SIGNING_KEY', signingKey.get()
        environment 'SIGNING_PASSWORD', signingPassword.getOrElse('')
    }
}

subprojects { publishedProject ->
    publishedProject.tasks.withType(PublishToMavenRepository).configureEach { publishTask ->
        if (publishTask.name.endsWith('ToPrivateRegistryRepository')) {
            dependsOn rootProject.tasks.named('validateReleasePublication')
            mustRunAfter rootProject.tasks.named('prepareRelease')
        }
    }
}

tasks.register('publishRelease') {
    group = 'publishing'
    description = 'Publishes every verified and signed framework release artifact.'
    dependsOn(
            mainBuildRemotePublicationTasks,
            tasks.named('prepareRelease'),
            tasks.named('publishBuildLogicRelease'),
            tasks.named('validateReleasePublication')
    )
}

tasks.register('pullRequestGate') {
    group = 'verification'
    description = 'Runs the complete, non-publishing verification contract for pull requests.'
    dependsOn(
            tasks.named('validatePullRequestCiContract'),
            tasks.named('releaseGate')
    )
}
