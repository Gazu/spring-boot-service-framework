plugins {
    id 'com.smbtech.service-framework.java-library'
}

description = 'Framework-independent structured logging domain and ports'

tasks.register('verifyHexagonalBoundaries') {
    group = 'verification'
    description = 'Ensures the logging core does not import framework or adapter APIs.'
    inputs.files(fileTree('src/main/java') {
        include '**/*.java'
    })

    doLast {
        def forbiddenImports = [
                'org.springframework.',
                'org.slf4j.',
                'ch.qos.logback.',
                'jakarta.servlet.',
                'com.fasterxml.jackson.',
                'tools.jackson.'
        ]
        def violations = []
        inputs.files.files.each { source ->
            source.eachLine { line, number ->
                def trimmed = line.trim()
                if (trimmed.startsWith('import ') &&
                        forbiddenImports.any { trimmed.contains(it) }) {
                    violations << "${source}:$number: $trimmed"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Hexagonal boundary violations:\n" + violations.join('\n')
            )
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyHexagonalBoundaries')
}

publishing {
    publications {
        named('mavenJava', MavenPublication) {
            pom {
                name = 'Spring Boot Service Framework - Logging Core'
            }
        }
    }
}
