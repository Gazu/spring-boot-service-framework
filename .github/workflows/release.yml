name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    env:
      PRIVATE_MAVEN_URL: ${{ secrets.PRIVATE_MAVEN_URL }}
      PRIVATE_MAVEN_USERNAME: ${{ secrets.PRIVATE_MAVEN_USERNAME }}
      PRIVATE_MAVEN_PASSWORD: ${{ secrets.PRIVATE_MAVEN_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - name: Check out signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Install Gitleaks
        run: .github/scripts/install-gitleaks.sh

      - name: Scan committed secrets
        env:
          SECURITY_EXECUTION_PROFILE: release
        run: .ci/security/scan.sh secrets

      - name: Upload release secret evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-secret-scan-${{ github.run_id }}
          path: |
            build/reports/security/gitleaks.sarif
            build/reports/security/security-scan-secrets-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify release tag and signing key
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v$(sed -n 's/^frameworkVersion=//p' gradle.properties)"
          test "${GITHUB_REF_NAME}" = "${expected_tag}"
          test -n "${PRIVATE_MAVEN_URL}"
          test -n "${PRIVATE_MAVEN_USERNAME}"
          test -n "${PRIVATE_MAVEN_PASSWORD}"
          test -n "${SIGNING_KEY}"
          test -n "${SIGNING_PASSWORD}"
          printf '%s' "${SIGNING_KEY}" | gpg --batch --import
          git verify-tag "${GITHUB_REF_NAME}"

      - name: Build signed release bundle
        run: ./gradlew clean releaseGate releaseBundle -PreleaseBuild=true --no-daemon --stacktrace

      - name: Install Trivy
        run: .github/scripts/install-trivy.sh

      - name: Scan dependencies and misconfigurations
        env:
          SECURITY_EXECUTION_PROFILE: release
        run: .ci/security/scan.sh trivy

      - name: Upload release Trivy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-trivy-scan-${{ github.run_id }}
          path: |
            build/reports/security/trivy-*.sarif
            build/reports/security/security-scan-trivy-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Attest release bundle provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: build/distributions/*.zip

      - name: Upload release bundle and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spring-boot-service-framework-${{ github.ref_name }}
          path: |
            build/distributions/*.zip
            build/reports/bom.json
            build/reports/bom.xml
            build/reports/security/*.sarif
            build/reports/security/security-scan-*-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed Maven artifacts
        run: ./gradlew publish -PreleaseBuild=true --no-daemon --stacktrace
