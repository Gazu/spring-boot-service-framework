name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag to publish
        required: true
        type: string
      dry_run:
        description: Validate the reusable publication without publishing
        required: true
        default: true
        type: boolean

permissions:
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish signed release
    uses: ./.github/workflows/publish-gradle-maven.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      java_version: "21"
      version_property: frameworkVersion
      artifact_manifest: gradle/release-artifacts.txt
      prepare_task: prepareRelease
      publish_task: publishRelease
      bundle_directory: build/distributions
      bundle_basename: spring-boot-service-framework
      artifact_name: spring-boot-service-framework-${{ inputs.tag || github.ref_name }}
      artifact_paths: |
        build/distributions/*.zip
        build/distributions/*.zip.sha256
        build/release/documentation/RELEASE_NOTES.md
        build/reports/bom.json
        build/reports/bom.xml
        build/reports/release/lifecycle.txt
        build/reports/security/*.sarif
        build/reports/security/security-scan-*-summary.json
      release_environment: release
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
