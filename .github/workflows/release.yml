name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release

    steps:
      - name: Check out signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Install Gitleaks
        run: .github/scripts/install-gitleaks.sh

      - name: Scan committed secrets
        env:
          SECURITY_EXECUTION_PROFILE: release
        run: .ci/security/scan.sh secrets

      - name: Upload release secret evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-secret-scan-${{ github.run_id }}
          path: |
            build/reports/security/gitleaks.sarif
            build/reports/security/security-scan-secrets-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify release tag and signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          expected_tag="v$(sed -n 's/^frameworkVersion=//p' gradle.properties)"
          test "${GITHUB_REF_NAME}" = "${expected_tag}"
          test -n "${SIGNING_KEY}"
          test -n "${SIGNING_PASSWORD}"
          printf '%s' "${SIGNING_KEY}" | gpg --batch --import
          git verify-tag "${GITHUB_REF_NAME}"

      - name: Build signed release bundle
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew clean prepareRelease -PreleaseBuild=true --no-daemon --stacktrace

      - name: Verify release bundle checksum
        shell: bash
        working-directory: build/distributions
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          sha256sum --check "spring-boot-service-framework-${release_version}.zip.sha256"

      - name: Install Trivy
        run: .github/scripts/install-trivy.sh

      - name: Scan dependencies and misconfigurations
        env:
          SECURITY_EXECUTION_PROFILE: release
        run: .ci/security/scan.sh trivy

      - name: Upload release Trivy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-trivy-scan-${{ github.run_id }}
          path: |
            build/reports/security/trivy-*.sarif
            build/reports/security/security-scan-trivy-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Attest release bundle provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: build/distributions/*.zip
          create-storage-record: false

      - name: Upload release bundle and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spring-boot-service-framework-${{ github.ref_name }}
          path: |
            build/distributions/*.zip
            build/distributions/*.zip.sha256
            build/release/documentation/RELEASE_NOTES.md
            build/reports/bom.json
            build/reports/bom.xml
            build/reports/release/lifecycle.txt
            build/reports/security/*.sarif
            build/reports/security/security-scan-*-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed Maven artifacts
        env:
          PRIVATE_MAVEN_URL: https://maven.pkg.github.com/gazu/service-framework-packages
          PRIVATE_MAVEN_USERNAME: ${{ secrets.PACKAGES_USERNAME }}
          PRIVATE_MAVEN_PASSWORD: ${{ secrets.PACKAGES_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishRelease -PreleaseBuild=true --no-daemon --stacktrace

      - name: Verify published Maven artifacts
        shell: bash
        env:
          PACKAGES_URL: https://maven.pkg.github.com/gazu/service-framework-packages
          PACKAGES_USERNAME: ${{ secrets.PACKAGES_USERNAME }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          while IFS='|' read -r kind group_id artifact_id; do
            [[ -z "${kind}" || "${kind}" == \#* ]] && continue
            group_path="${group_id//./\/}"
            artifact_url="${PACKAGES_URL}/${group_path}/${artifact_id}/${release_version}/${artifact_id}-${release_version}.pom"
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --user "${PACKAGES_USERNAME}:${PACKAGES_TOKEN}" \
              --output /dev/null \
              "${artifact_url}"
          done < gradle/release-artifacts.txt
