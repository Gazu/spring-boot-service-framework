name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag to publish
        required: true
        type: string

permissions:
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release

    steps:
      - name: Check out signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Validate publishing identity
        shell: bash
        env:
          PRIVATE_MAVEN_URL: ${{ secrets.PRIVATE_MAVEN_URL }}
          PRIVATE_MAVEN_USERNAME: ${{ secrets.PRIVATE_MAVEN_USERNAME }}
          PRIVATE_MAVEN_PASSWORD: ${{ secrets.PRIVATE_MAVEN_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          expected_url="https://maven.pkg.github.com/gazu/service-framework-packages"
          for variable in PRIVATE_MAVEN_URL PRIVATE_MAVEN_USERNAME \
            PRIVATE_MAVEN_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required release secret ${variable} is empty." >&2
              exit 1
            fi
          done
          if [[ "${PRIVATE_MAVEN_URL}" != "${expected_url}" ]]; then
            echo "PRIVATE_MAVEN_URL must be ${expected_url}." >&2
            exit 1
          fi

          headers="$(mktemp)"
          response="$(mktemp)"
          trap 'rm -f "${headers}" "${response}"' EXIT
          status="$(curl --silent --show-error --location \
            --dump-header "${headers}" --output "${response}" --write-out '%{http_code}' \
            --user "${PRIVATE_MAVEN_USERNAME}:${PRIVATE_MAVEN_PASSWORD}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/user)"
          if [[ "${status}" != "200" ]]; then
            echo "Publishing identity authentication failed with HTTP ${status}." >&2
            exit 1
          fi

          authenticated_user="$(jq -r '.login // empty' "${response}")"
          if [[ "${authenticated_user,,}" != "${PRIVATE_MAVEN_USERNAME,,}" ]]; then
            echo "PRIVATE_MAVEN_USERNAME does not own PRIVATE_MAVEN_PASSWORD." >&2
            exit 1
          fi

          oauth_scopes="$(awk -F': *' 'tolower($1) == "x-oauth-scopes" {
            gsub("\\r", "", $2); print tolower($2)
          }' "${headers}")"
          for required_scope in read:packages write:packages; do
            if [[ ",${oauth_scopes// /}," != *",${required_scope},"* ]]; then
              echo "Publishing PAT must be classic and include ${required_scope}." >&2
              exit 1
            fi
          done

          package_status="$(curl --silent --show-error --location \
            --output "${response}" --write-out '%{http_code}' \
            --user "${PRIVATE_MAVEN_USERNAME}:${PRIVATE_MAVEN_PASSWORD}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/users/Gazu/packages/maven/com.smbtech.spring-boot-service-framework-platform)"
          if [[ "${package_status}" != "200" ]]; then
            echo "Publishing identity cannot read the private Maven registry (HTTP ${package_status})." >&2
            exit 1
          fi
          echo "Publishing identity and private Maven registry access are valid."

      - name: Install Gitleaks
        run: .github/scripts/install-gitleaks.sh

      - name: Scan committed secrets
        env:
          SECURITY_EXECUTION_PROFILE: release
        run: .ci/security/scan.sh secrets

      - name: Upload release secret evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-secret-scan-${{ github.run_id }}
          path: |
            build/reports/security/gitleaks.sarif
            build/reports/security/security-scan-secrets-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify release tag and signing key
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          expected_tag="v$(sed -n 's/^frameworkVersion=//p' gradle.properties)"
          test "${RELEASE_TAG}" = "${expected_tag}"
          test -n "${SIGNING_KEY}"
          test -n "${SIGNING_PASSWORD}"
          printf '%s' "${SIGNING_KEY}" | gpg --batch --import
          git verify-tag "${RELEASE_TAG}"

      - name: Build signed release bundle
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: GITHUB_REF_NAME="${RELEASE_TAG}" ./gradlew clean prepareRelease -PreleaseBuild=true --no-daemon --stacktrace

      - name: Verify release bundle checksum
        shell: bash
        working-directory: build/distributions
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          sha256sum --check "spring-boot-service-framework-${release_version}.zip.sha256"

      - name: Install Trivy
        run: .github/scripts/install-trivy.sh

      - name: Scan dependencies and misconfigurations
        env:
          SECURITY_EXECUTION_PROFILE: release
        run: .ci/security/scan.sh trivy

      - name: Upload release Trivy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-trivy-scan-${{ github.run_id }}
          path: |
            build/reports/security/trivy-*.sarif
            build/reports/security/security-scan-trivy-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Attest release bundle provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: build/distributions/*.zip
          create-storage-record: false

      - name: Upload release bundle and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spring-boot-service-framework-${{ inputs.tag || github.ref_name }}
          path: |
            build/distributions/*.zip
            build/distributions/*.zip.sha256
            build/release/documentation/RELEASE_NOTES.md
            build/reports/bom.json
            build/reports/bom.xml
            build/reports/release/lifecycle.txt
            build/reports/security/*.sarif
            build/reports/security/security-scan-*-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed Maven artifacts
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          PRIVATE_MAVEN_URL: ${{ secrets.PRIVATE_MAVEN_URL }}
          PRIVATE_MAVEN_USERNAME: ${{ secrets.PRIVATE_MAVEN_USERNAME }}
          PRIVATE_MAVEN_PASSWORD: ${{ secrets.PRIVATE_MAVEN_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: GITHUB_REF_NAME="${RELEASE_TAG}" ./gradlew publishRelease -PreleaseBuild=true --no-daemon --stacktrace

      - name: Verify published Maven artifacts
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          PRIVATE_MAVEN_URL: ${{ secrets.PRIVATE_MAVEN_URL }}
          PRIVATE_MAVEN_USERNAME: ${{ secrets.PRIVATE_MAVEN_USERNAME }}
          PRIVATE_MAVEN_PASSWORD: ${{ secrets.PRIVATE_MAVEN_PASSWORD }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          while IFS='|' read -r kind group_id artifact_id; do
            [[ -z "${kind}" || "${kind}" == \#* ]] && continue
            group_path="${group_id//./\/}"
            artifact_url="${PRIVATE_MAVEN_URL}/${group_path}/${artifact_id}/${release_version}/${artifact_id}-${release_version}.pom"
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --user "${PRIVATE_MAVEN_USERNAME}:${PRIVATE_MAVEN_PASSWORD}" \
              --output /dev/null \
              "${artifact_url}"
          done < gradle/release-artifacts.txt
