name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      PULL_REQUEST_TITLE: ${{ github.event.pull_request.title || '' }}

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      - name: Validate pull request contract and commit policy
        run: >-
          ./gradlew validatePullRequestCiContract
          validatePullRequestPolicy
          --no-daemon
          --stacktrace
          --console=plain

  quality:
    name: Quality
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      - name: Run pull request quality gate
        id: quality-gate
        run: >-
          ./gradlew clean pullRequestGate
          --no-daemon
          --stacktrace
          --console=plain

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pull-request-quality-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: |
            **/build/test-results/test/TEST-*.xml
            **/build/reports/jacoco/test/jacocoTestReport.xml
            build/reports/smbtech-openapi/documentation-check.txt
            build/reports/bom.json
            build/reports/bom.xml
            !build/binary-compatibility/**
          if-no-files-found: warn
          retention-days: 7

      - name: Publish quality evidence summary
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.quality-gate.outcome }}
        run: |
          printf '## Pull Request Quality Evidence\n\n' >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Gate outcome: `%s`\n' "${GATE_OUTCOME}" >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Artifact: JUnit XML, JaCoCo XML, OpenAPI documentation report, and CycloneDX SBOM\n' >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Retention: 7 days\n' >> "${GITHUB_STEP_SUMMARY}"

  security:
    name: Security
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECURITY_EXECUTION_PROFILE: pull-request

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      - name: Generate aggregate SBOM
        run: >-
          ./gradlew dependencyTrackSbom
          --no-daemon
          --stacktrace
          --console=plain

      - name: Install Trivy
        run: .github/scripts/install-trivy.sh

      - name: Install Gitleaks
        run: .github/scripts/install-gitleaks.sh

      - name: Run pull request security gate
        id: security-gate
        run: .ci/security/scan.sh all

      - name: Upload redacted security evidence
        if: >-
          ${{
            always() &&
            hashFiles(
              'build/reports/security/*.sarif',
              'build/reports/security/security-scan-*-summary.json'
            ) != ''
          }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pull-request-security-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/security/*.sarif
            build/reports/security/security-scan-*-summary.json
            build/reports/bom.json
            build/reports/bom.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Publish security evidence summary
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.security-gate.outcome }}
        run: |
          printf '## Pull Request Security Evidence\n\n' >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Gate outcome: `%s`\n' "${GATE_OUTCOME}" >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Artifact: redacted SARIF, scan summary, and scanned CycloneDX SBOM\n' >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- Retention: 7 days\n' >> "${GITHUB_STEP_SUMMARY}"
