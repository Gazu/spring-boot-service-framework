name: Scheduled Security Monitor

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Security controls to execute
        required: true
        default: all
        type: choice
        options:
          - all
          - trivy
          - secrets

permissions:
  contents: read

concurrency:
  group: scheduled-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Re-evaluate security evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECURITY_SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'all' }}
      SECURITY_EXECUTION_PROFILE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        if: env.SECURITY_SCAN_MODE != 'secrets'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        if: env.SECURITY_SCAN_MODE != 'secrets'
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up Gradle
        if: env.SECURITY_SCAN_MODE != 'secrets'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Generate aggregate SBOM
        if: env.SECURITY_SCAN_MODE != 'secrets'
        run: ./gradlew dependencyTrackSbom --no-daemon --stacktrace

      - name: Install Trivy
        if: env.SECURITY_SCAN_MODE != 'secrets'
        run: .github/scripts/install-trivy.sh

      - name: Install Gitleaks
        if: env.SECURITY_SCAN_MODE != 'trivy'
        run: .github/scripts/install-gitleaks.sh

      - name: Execute security strategy
        run: .ci/security/scan.sh "${SECURITY_SCAN_MODE}"

      - name: Upload redacted security evidence
        if: >-
          ${{
            always() &&
            hashFiles(
              'build/reports/security/*.sarif',
              'build/reports/security/security-scan-*-summary.json'
            ) != ''
          }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-monitor-${{ github.run_id }}
          path: |
            build/reports/security/*.sarif
            build/reports/security/security-scan-*-summary.json
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'schedule' && 30 || 14 }}
