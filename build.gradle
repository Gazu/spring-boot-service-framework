plugins {
    id 'base'
    id 'com.diffplug.spotless'
    id 'com.smbtech.service-framework.openapi-generator'
    id 'org.cyclonedx.bom'
    id 'org.sonarqube'
    id 'signing'
}

apply from: 'gradle/property-reference.gradle'
apply from: 'gradle/public-api-inventory.gradle'

def frameworkVersion = providers.gradleProperty('frameworkVersion').get()

allprojects {
    group = 'com.smbtech'
    version = frameworkVersion

    repositories {
        mavenCentral()
    }

}

smbtechOpenApi {
    groupId.set('com.smbtech.openapi')
    outputDirectory.set(layout.buildDirectory.dir('generated/smbtech-openapi'))
    repositoryDirectory.set(layout.buildDirectory.dir('repository/openapi'))

    specs {
        register('merchantOrderStatus') {
            input.set(file('docs/openapi/merchant-order-status.yaml'))
        }
        register('retailLoyaltyRewards') {
            input.set(file('docs/openapi/retail-loyalty-rewards.yaml'))
        }
        register('warehouseInventoryCatalog') {
            input.set(file('docs/openapi/warehouse-inventory-catalog.yaml'))
        }
    }
}

apply from: 'gradle/platform-contract.gradle'
apply from: 'gradle/actuator-contract.gradle'
apply from: 'gradle/logging-async-contract.gradle'
apply from: 'gradle/documentation-checks.gradle'
apply from: 'gradle/convention-checks.gradle'
apply from: 'gradle/formatting.gradle'
apply from: 'gradle/code-quality.gradle'
apply from: 'gradle/module-compatibility.gradle'
apply from: 'gradle/binary-compatibility.gradle'
apply from: 'gradle/supply-chain.gradle'
apply from: 'gradle/lifecycle.gradle'
apply from: 'gradle/sonarqube.gradle'
