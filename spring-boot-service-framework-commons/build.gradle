plugins {
    id 'com.smbtech.service-framework.java-library'
}

description = 'Shared, framework-agnostic utilities for SMB Tech services'

publishing {
    publications {
        named('mavenJava', MavenPublication) {
            pom {
                name = 'Spring Boot Service Framework - Commons'
            }
        }
    }
}

tasks.register('verifyCommonsDependencyBoundary') {
    group = 'verification'
    description = 'Verifies that Commons does not publish framework or logging dependencies.'
    dependsOn tasks.named('generatePomFileForMavenJavaPublication')

    def generatedPom = layout.buildDirectory.file('publications/mavenJava/pom-default.xml')
    inputs.file(generatedPom)

    doLast {
        def pomText = generatedPom.get().asFile.getText('UTF-8')
        def forbiddenDependencies = [
                'spring-boot-service-framework-logging-core',
                '<groupId>org.slf4j</groupId>',
                '<groupId>org.springframework</groupId>'
        ]
        def publishedDependencies = forbiddenDependencies.findAll { pomText.contains(it) }
        if (!publishedDependencies.isEmpty()) {
            throw new GradleException(
                    'Commons must remain framework-neutral: '
                            + publishedDependencies.join(', ')
            )
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyCommonsDependencyBoundary')
}
