plugins {
    id 'jacoco'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

def junitVersion = providers.gradleProperty('junitVersion').get()
def jspecifyVersion = providers.gradleProperty('jspecifyVersion').get()
def jacocoVersion = providers.gradleProperty('jacocoVersion').get()
def minimumLineCoverage = providers.gradleProperty('minimumLineCoverage').get()
def projectUrl = 'https://github.com/Gazu/spring-boot-service-framework'
def distributionRepositoryId = 'github'
def distributionRepositoryName = 'SMB Tech GitHub Packages'
def distributionRepositoryUrl = 'https://maven.pkg.github.com/gazu/service-framework-packages'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    compileOnlyApi "org.jspecify:jspecify:${jspecifyVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.memberLevel = org.gradle.external.javadoc.JavadocMemberLevel.PUBLIC
    options.addBooleanOption('Werror', true)
    options.addBooleanOption('notimestamp', true)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification'), tasks.named('javadoc')
}

jacoco {
    toolVersion = jacocoVersion
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = new BigDecimal(minimumLineCoverage)
            }
        }
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = project.name
                description = providers.provider { project.description }
                url = projectUrl
                inceptionYear = '2025'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'Gazu'
                        name = 'Gazu'
                        url = 'https://github.com/Gazu'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/Gazu/spring-boot-service-framework.git'
                    developerConnection = 'scm:git:ssh://git@github.com/Gazu/spring-boot-service-framework.git'
                    url = projectUrl
                    tag = "v${project.version}"
                }
                issueManagement {
                    system = 'GitHub Issues'
                    url = "${projectUrl}/issues"
                }
                withXml {
                    def distributionManagement = asNode().appendNode('distributionManagement')
                    def repository = distributionManagement.appendNode('repository')
                    repository.appendNode('id', distributionRepositoryId)
                    repository.appendNode('name', distributionRepositoryName)
                    repository.appendNode('url', distributionRepositoryUrl)
                }
            }
        }
    }
    repositories {
        maven {
            name = 'localBuild'
            url = layout.buildDirectory.dir('repository')
        }

        def privateRepositoryUrl = providers.gradleProperty('privateMavenUrl')
                .orElse(providers.environmentVariable('PRIVATE_MAVEN_URL'))
                .orNull
        if (privateRepositoryUrl) {
            maven {
                name = 'privateRegistry'
                url = uri(privateRepositoryUrl)
                credentials {
                    username = providers.gradleProperty('privateMavenUsername')
                            .orElse(providers.environmentVariable('PRIVATE_MAVEN_USERNAME'))
                            .getOrElse('')
                    password = providers.gradleProperty('privateMavenPassword')
                            .orElse(providers.environmentVariable('PRIVATE_MAVEN_PASSWORD'))
                            .getOrElse('')
                }
            }
        }
    }
}

def signingKey = providers.gradleProperty('signingKey')
        .orElse(providers.environmentVariable('SIGNING_KEY'))
def signingPassword = providers.gradleProperty('signingPassword')
        .orElse(providers.environmentVariable('SIGNING_PASSWORD'))
def releaseBuild = providers.gradleProperty('releaseBuild')
        .map { it.toBoolean() }
        .getOrElse(false)

signing {
    required = releaseBuild
    if (signingKey.isPresent()) {
        useInMemoryPgpKeys(signingKey.get(), signingPassword.getOrElse(''))
    }
    sign publishing.publications.mavenJava
}

tasks.withType(PublishToMavenRepository).configureEach {
    if (repository.name == 'privateRegistry') {
        dependsOn ':validateReleaseTag'
    }
    doFirst {
        if (repository.name == 'privateRegistry' && !releaseBuild) {
            throw new GradleException('Remote publication requires -PreleaseBuild=true.')
        }
        if (repository.name == 'privateRegistry' && !signingKey.isPresent()) {
            throw new GradleException('Remote publication requires SIGNING_KEY and SIGNING_PASSWORD.')
        }
    }
}
