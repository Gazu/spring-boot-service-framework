buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.21.4'
    }
}

// Gradle-facing OpenAPI generation implementation owned by the plugin.

configurations {
    openApiModelCompileClasspath
    openApiServerApiCompileClasspath
    openApiClientCompileClasspath
}

String relativePath(File source) {
    rootDir.toPath().relativize(source.toPath()).toString()
}

long openApiReproducibleEntryTime() {
    946684800000L
}

dependencies {
    openApiModelCompileClasspath 'com.fasterxml.jackson.core:jackson-annotations:2.19.4'
    openApiModelCompileClasspath 'jakarta.validation:jakarta.validation-api:3.1.1'

    openApiServerApiCompileClasspath 'org.springframework:spring-web:7.0.8'
    openApiServerApiCompileClasspath 'jakarta.validation:jakarta.validation-api:3.1.1'

    openApiClientCompileClasspath 'org.springframework:spring-web:7.0.8'
    openApiClientCompileClasspath 'jakarta.validation:jakarta.validation-api:3.1.1'
}

String normalizeOpenApiTitle(String title) {
    title.trim()
            .toLowerCase(Locale.ROOT)
            .replaceAll(/[\s_.]+/, '-')
            .replaceAll(/[^a-z0-9-]/, '')
            .replaceAll(/-+/, '-')
}

boolean isValidOpenApiArtifactBaseName(String artifactBaseName) {
    !artifactBaseName.isBlank()
            && !artifactBaseName.startsWith('-')
            && !artifactBaseName.endsWith('-')
            && (artifactBaseName ==~ /^[a-z0-9]+(?:-[a-z0-9]+)*$/)
}

String unquoteOpenApiScalar(String value) {
    def scalar = value.trim()
    def commentIndex = scalar.indexOf(' #')
    if (commentIndex >= 0) {
        scalar = scalar.substring(0, commentIndex).trim()
    }
    if ((scalar.startsWith("'") && scalar.endsWith("'"))
            || (scalar.startsWith('"') && scalar.endsWith('"'))) {
        scalar = scalar.substring(1, scalar.length() - 1)
    }
    scalar.trim()
}

Map<String, String> readOpenApiYamlInfo(File source) {
    def inInfo = false
    def infoIndent = -1
    def title = null
    def version = null

    source.eachLine { rawLine ->
        def line = rawLine.replace('\t', '    ')
        def trimmed = line.trim()
        if (trimmed.isBlank() || trimmed.startsWith('#')) {
            return
        }

        def indent = line.indexOf(trimmed)
        if (!inInfo) {
            if (trimmed == 'info:' || trimmed.startsWith('info: #')) {
                inInfo = true
                infoIndent = indent
            }
            return
        }

        if (indent <= infoIndent && (trimmed ==~ /^[A-Za-z0-9_.-]+:.*/)) {
            inInfo = false
            return
        }

        def matcher = trimmed =~ /^(title|version):\s*(.*)$/
        if (matcher.matches()) {
            def key = matcher[0][1]
            def value = unquoteOpenApiScalar(matcher[0][2])
            if (key == 'title') {
                title = value
            } else if (key == 'version') {
                version = value
            }
        }
    }

    [
            title  : title,
            version: version
    ]
}

Map<String, String> readOpenApiJsonInfo(File source) {
    def json = new groovy.json.JsonSlurper().parse(source)
    def info = json instanceof Map ? json.info : null
    [
            title  : info instanceof Map && info.title != null ? info.title.toString() : null,
            version: info instanceof Map && info.version != null ? info.version.toString() : null
    ]
}

Map<String, String> readOpenApiInfo(File source) {
    if (source.name.endsWith('.json')) {
        return readOpenApiJsonInfo(source)
    }
    readOpenApiYamlInfo(source)
}

String sha256(File source) {
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    source.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

void updateDigest(java.security.MessageDigest digest, String value) {
    digest.update(value.getBytes(java.nio.charset.StandardCharsets.UTF_8))
}

String sha256Directory(File source) {
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    if (!source.isDirectory()) {
        return ''
    }
    sortedFiles(source).each { file ->
        def relative = source.toPath().relativize(file.toPath()).toString().replace(File.separator, '/')
        updateDigest(digest, relative)
        updateDigest(digest, '\n')
        file.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        updateDigest(digest, '\n')
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

List<File> sortedFiles(File root) {
    if (!root.isDirectory()) {
        return []
    }
    def files = []
    root.eachFileRecurse { file ->
        if (file.isFile()) {
            files << file
        }
    }
    files.sort { root.toPath().relativize(it.toPath()).toString().replace(File.separator, '/') }
}

void addReproducibleJarEntry(java.util.jar.JarOutputStream jar, String entryName, byte[] content) {
    def entry = new java.util.jar.JarEntry(entryName)
    entry.setTime(openApiReproducibleEntryTime())
    jar.putNextEntry(entry)
    jar.write(content)
    jar.closeEntry()
}

void createOpenApiReproducibleJar(File artifactFile, List<File> roots) {
    artifactFile.parentFile.mkdirs()
    if (artifactFile.exists()) {
        artifactFile.delete()
    }

    def manifest = 'Manifest-Version: 1.0\r\n' +
            'Created-By: spring-boot-service-framework-openapi\r\n' +
            '\r\n'
    def writtenEntries = [] as Set
    artifactFile.withOutputStream { output ->
        def jar = new java.util.jar.JarOutputStream(new BufferedOutputStream(output))
        try {
            addReproducibleJarEntry(
                    jar,
                    'META-INF/MANIFEST.MF',
                    manifest.getBytes(java.nio.charset.StandardCharsets.UTF_8)
            )
            writtenEntries << 'META-INF/MANIFEST.MF'

            def entries = []
            roots.each { root ->
                sortedFiles(root).each { file ->
                    entries << [
                            file     : file,
                            entryName: root.toPath().relativize(file.toPath()).toString().replace(File.separator, '/')
                    ]
                }
            }
            entries.sort { it.entryName }.each { candidate ->
                if (writtenEntries.contains(candidate.entryName)) {
                    throw new GradleException("${artifactFile.name}: duplicate JAR entry ${candidate.entryName}")
                }
                writtenEntries << candidate.entryName
                addReproducibleJarEntry(jar, candidate.entryName.toString(), candidate.file.bytes)
            }
        } finally {
            jar.close()
        }
    }
}

String escapePropertiesValue(String value) {
    value
            .replace('\\', '\\\\')
            .replace('\n', '\\n')
            .replace('\r', '\\r')
            .replace('\t', '\\t')
}

Map<String, String> openApiContractMetadata(File source, String artifactKind) {
    def info = readOpenApiInfo(source)
    def title = info.title
    def version = info.version
    def artifactBaseName = normalizeOpenApiTitle(title)
    [
            'openapi.title'              : title,
            'openapi.version'            : version,
            'openapi.artifact.base-name' : artifactBaseName,
            'openapi.artifact.group-id'  : 'com.smbtech.openapi',
            'openapi.artifact.kind'      : artifactKind,
            'openapi.artifact.models'    : "${artifactBaseName}-models".toString(),
            'openapi.artifact.api'       : "${artifactBaseName}-api".toString(),
            'openapi.artifact.client'    : "${artifactBaseName}-client".toString(),
            'openapi.source'             : relativePath(source),
            'openapi.sha256'             : sha256(source),
            'openapi.generator'          : 'spring-boot-service-framework-openapi',
            'openapi.generator.version'  : rootProject.version.toString()
    ]
}

String formatContractMetadata(Map<String, String> metadata) {
    metadata.collect { key, value ->
        "${key}=${escapePropertiesValue(value ?: '')}".toString()
    }.join('\n') + '\n'
}

String openApiBasePackage(String artifactBaseName) {
    "com.smbtech.openapi.${artifactBaseName.replaceAll('-', '')}".toString()
}

String javaIdentifier(String value) {
    def words = value.split(/[^A-Za-z0-9]+/).findAll { !it.isBlank() }
    if (words.isEmpty()) {
        return 'value'
    }
    def name = words[0].substring(0, 1).toLowerCase(Locale.ROOT) + words[0].substring(1) +
            words.drop(1).collect {
                it.substring(0, 1).toUpperCase(Locale.ROOT) + it.substring(1)
            }.join()
    if (!(name ==~ /^[A-Za-z_$].*/)) {
        name = "_${name}"
    }
    name
}

String javaTypeName(String value) {
    def words = value.split(/[^A-Za-z0-9]+/).findAll { !it.isBlank() }
    if (words.isEmpty()) {
        return 'GeneratedModel'
    }
    words.collect {
        it.substring(0, 1).toUpperCase(Locale.ROOT) + it.substring(1)
    }.join()
}

String javaLiteral(String value) {
    '"' + value
            .replace('\\', '\\\\')
            .replace('"', '\\"')
            .replace('\n', '\\n')
            .replace('\r', '\\r')
            .replace('\t', '\\t') + '"'
}

Map normalizeOpenApiSchemaProperty(String name, Object rawProperty) {
    def property = rawProperty instanceof Map ? rawProperty : [:]
    [
            name                : name,
            type                : property.type?.toString() ?: (property.'$ref' ? 'ref' : 'object'),
            format              : property.format?.toString() ?: '',
            ref                 : property.'$ref'?.toString(),
            enum                : property.enum instanceof Collection ? property.enum.collect { it.toString() } : [],
            items               : property.items instanceof Map ? normalizeOpenApiSchemaProperty('item', property.items) : null,
            additionalProperties: property.additionalProperties instanceof Map
                    ? normalizeOpenApiSchemaProperty('value', property.additionalProperties)
                    : property.additionalProperties,
            minLength           : property.minLength,
            maxLength           : property.maxLength,
            pattern             : property.pattern?.toString(),
            minimum             : property.minimum,
            maximum             : property.maximum,
            minItems            : property.minItems,
            maxItems            : property.maxItems
    ]
}

boolean openApiHasText(Object value) {
    value != null && !value.toString().isBlank()
}

String openApiInlineEnumTypeName(String ownerName, String propertyName) {
    javaTypeName("${ownerName}-${propertyName}")
}

String openApiJavaType(Map property, String ownerName = null) {
    if (openApiHasText(property.ref)) {
        return javaTypeName(schemaRefName(property.ref.toString()))
    }
    if (property.enum instanceof Collection && !property.enum.isEmpty() && ownerName != null) {
        return openApiInlineEnumTypeName(ownerName, property.name.toString())
    }
    def type = property.type ?: 'object'
    def format = property.format ?: ''
    if (type == 'string' && format == 'date') {
        return 'LocalDate'
    }
    if (type == 'string' && format == 'date-time') {
        return 'OffsetDateTime'
    }
    if (type == 'string') {
        return 'String'
    }
    if (type == 'integer' && format == 'int64') {
        return 'Long'
    }
    if (type == 'integer') {
        return 'Integer'
    }
    if (type == 'number' && format == 'float') {
        return 'Float'
    }
    if (type == 'number') {
        return 'Double'
    }
    if (type == 'boolean') {
        return 'Boolean'
    }
    if (type == 'array') {
        def itemType = property.items instanceof Map ? openApiJavaType(property.items as Map, null) : 'Object'
        return "List<${itemType}>".toString()
    }
    if (type == 'object' && property.additionalProperties != null) {
        def valueType = property.additionalProperties instanceof Map
                ? openApiJavaType(property.additionalProperties as Map, null)
                : 'Object'
        return "Map<String, ${valueType}>".toString()
    }
    'Map<String, Object>'
}

String openApiEnumConstantName(String value, Set<String> usedNames) {
    def base = value
            .trim()
            .replaceAll(/([a-z0-9])([A-Z])/, '$1_$2')
            .toUpperCase(Locale.ROOT)
            .replaceAll(/[^A-Z0-9]+/, '_')
            .replaceAll(/^_+|_+$/, '')
    if (base.isBlank()) {
        base = 'VALUE'
    }
    if (base.substring(0, 1) ==~ /[0-9]/) {
        base = "VALUE_${base}"
    }
    def candidate = base
    def suffix = 2
    while (usedNames.contains(candidate)) {
        candidate = "${base}_${suffix}"
        suffix++
    }
    usedNames << candidate
    candidate
}

String renderOpenApiEnumSource(String packageName, String enumName, Collection values) {
    def constants = []
    def usedNames = [] as Set
    values.each { value ->
        constants << [name: openApiEnumConstantName(value.toString(), usedNames), value: value.toString()]
    }

    def builder = new StringBuilder()
    builder << "package ${packageName};\n\n"
    builder << "import com.fasterxml.jackson.annotation.JsonCreator;\n"
    builder << "import com.fasterxml.jackson.annotation.JsonValue;\n\n"
    builder << "public enum ${enumName} {\n\n"
    constants.eachWithIndex { constant, index ->
        builder << "    ${constant.name}(${javaLiteral(constant.value)})"
        builder << (index == constants.size() - 1 ? ";\n\n" : ",\n")
    }
    builder << "    private final String value;\n\n"
    builder << "    ${enumName}(String value) {\n"
    builder << "        this.value = value;\n"
    builder << "    }\n\n"
    builder << "    @JsonValue\n"
    builder << "    public String value() {\n"
    builder << "        return value;\n"
    builder << "    }\n\n"
    builder << "    @JsonCreator\n"
    builder << "    public static ${enumName} fromValue(String value) {\n"
    builder << "        for (${enumName} candidate : values()) {\n"
    builder << "            if (candidate.value.equals(value)) {\n"
    builder << "                return candidate;\n"
    builder << "            }\n"
    builder << "        }\n"
    builder << "        throw new IllegalArgumentException(\"Unknown ${enumName} value: \" + value);\n"
    builder << "    }\n"
    builder << "}\n"
    builder.toString()
}

List<String> openApiValidationAnnotations(Map property) {
    def annotations = []
    if (property.required) {
        annotations << '@NotNull'
    }
    def sizeArguments = []
    if (property.minLength != null) {
        sizeArguments << "min = ${property.minLength}"
    }
    if (property.maxLength != null) {
        sizeArguments << "max = ${property.maxLength}"
    }
    if (property.minItems != null) {
        sizeArguments << "min = ${property.minItems}"
    }
    if (property.maxItems != null) {
        sizeArguments << "max = ${property.maxItems}"
    }
    if (!sizeArguments.isEmpty()) {
        annotations << "@Size(${sizeArguments.join(', ')})"
    }
    if (openApiHasText(property.pattern)) {
        annotations << "@Pattern(regexp = ${javaLiteral(property.pattern.toString())})"
    }
    if (property.minimum != null) {
        annotations << (property.javaType in ['Integer', 'Long']
                ? "@Min(${property.minimum})"
                : "@DecimalMin(${javaLiteral(property.minimum.toString())})")
    }
    if (property.maximum != null) {
        annotations << (property.javaType in ['Integer', 'Long']
                ? "@Max(${property.maximum})"
                : "@DecimalMax(${javaLiteral(property.maximum.toString())})")
    }
    annotations
}

Map<String, Map> readOpenApiYamlSchemas(File source) {
    def schemas = [:]
    def inComponents = false
    def inSchemas = false
    def currentSchema = null
    def currentProperty = null
    def currentNested = null
    def currentEnumTarget = null
    def inRequired = false
    def inProperties = false

    source.eachLine { rawLine ->
        def line = rawLine.replace('\t', '    ')
        def trimmed = line.trim()
        if (trimmed.isBlank() || trimmed.startsWith('#')) {
            return
        }
        def indent = line.indexOf(trimmed)

        if (indent == 0 && trimmed == 'components:') {
            inComponents = true
            inSchemas = false
            return
        }
        if (indent == 0 && inComponents && trimmed != 'components:') {
            inComponents = false
            inSchemas = false
            currentSchema = null
        }
        if (inComponents && indent == 2 && trimmed == 'schemas:') {
            inSchemas = true
            return
        }
        if (!inSchemas) {
            return
        }

        def schemaMatcher = trimmed =~ /^([A-Za-z0-9_.-]+):\s*$/
        if (indent == 4 && schemaMatcher.matches()) {
            currentSchema = schemaMatcher[0][1]
            schemas[currentSchema] = [
                    name      : currentSchema,
                    type      : 'object',
                    enum      : [],
                    required  : [] as Set,
                    properties: []
            ]
            currentProperty = null
            currentNested = null
            currentEnumTarget = null
            inRequired = false
            inProperties = false
            return
        }

        if (currentSchema == null) {
            return
        }

        if (indent == 6 && trimmed.startsWith('type:')) {
            schemas[currentSchema].type = unquoteOpenApiScalar(trimmed.substring('type:'.length()))
            return
        }
        if (indent == 6 && trimmed == 'enum:') {
            currentEnumTarget = 'schema'
            inRequired = false
            inProperties = false
            return
        }
        if (indent == 8 && currentEnumTarget == 'schema' && trimmed.startsWith('- ')) {
            schemas[currentSchema].enum << unquoteOpenApiScalar(trimmed.substring(2))
            return
        }
        if (indent == 6 && trimmed == 'required:') {
            inRequired = true
            inProperties = false
            currentEnumTarget = null
            return
        }
        if (indent == 8 && inRequired && trimmed.startsWith('- ')) {
            schemas[currentSchema].required << unquoteOpenApiScalar(trimmed.substring(2))
            return
        }
        if (indent == 6 && trimmed == 'properties:') {
            inRequired = false
            inProperties = true
            currentEnumTarget = null
            return
        }
        if (indent == 8 && inProperties && schemaMatcher.matches()) {
            currentProperty = schemaMatcher[0][1]
            schemas[currentSchema].properties << [
                    name                : currentProperty,
                    type                : 'object',
                    format              : '',
                    ref                 : null,
                    enum                : [],
                    items               : null,
                    additionalProperties: null,
                    minLength           : null,
                    maxLength           : null,
                    pattern             : null,
                    minimum             : null,
                    maximum             : null,
                    minItems            : null,
                    maxItems            : null
            ]
            currentNested = null
            currentEnumTarget = null
            return
        }
        if (indent == 10 && inProperties && currentProperty != null) {
            def property = schemas[currentSchema].properties.find { it.name == currentProperty }
            if (trimmed == 'enum:') {
                currentEnumTarget = 'property'
                currentNested = null
                return
            }
            if (trimmed == 'items:') {
                property.items = [
                        name                : 'item',
                        type                : 'object',
                        format              : '',
                        ref                 : null,
                        enum                : [],
                        items               : null,
                        additionalProperties: null
                ]
                currentNested = 'items'
                currentEnumTarget = null
                return
            }
            if (trimmed == 'additionalProperties:') {
                property.additionalProperties = [
                        name                : 'value',
                        type                : 'object',
                        format              : '',
                        ref                 : null,
                        enum                : [],
                        items               : null,
                        additionalProperties: null
                ]
                currentNested = 'additionalProperties'
                currentEnumTarget = null
                return
            }
            def additionalPropertiesMatcher = trimmed =~ /^additionalProperties:\s*(.*)$/
            if (additionalPropertiesMatcher.matches()) {
                def value = unquoteOpenApiScalar(additionalPropertiesMatcher[0][1])
                property.additionalProperties = value.equalsIgnoreCase('true') ? true : value
                currentNested = null
                currentEnumTarget = null
                return
            }
            def matcher = trimmed =~ '^(type|format|\\$ref|minLength|maxLength|pattern|minimum|maximum|minItems|maxItems):\\s*(.*)$'
            if (matcher.matches()) {
                def key = matcher[0][1] == '$ref' ? 'ref' : matcher[0][1]
                property[key] = unquoteOpenApiScalar(matcher[0][2])
                currentNested = null
                currentEnumTarget = null
                return
            }
        }
        if (indent == 12 && inProperties && currentProperty != null && currentEnumTarget == 'property' && trimmed.startsWith('- ')) {
            def property = schemas[currentSchema].properties.find { it.name == currentProperty }
            property.enum << unquoteOpenApiScalar(trimmed.substring(2))
            return
        }
        if (indent == 12 && inProperties && currentProperty != null && currentNested != null) {
            def property = schemas[currentSchema].properties.find { it.name == currentProperty }
            def nested = property[currentNested]
            if (nested instanceof Map) {
                if (trimmed == 'enum:') {
                    currentEnumTarget = currentNested
                    return
                }
                def matcher = trimmed =~ '^(type|format|\\$ref|minLength|maxLength|pattern|minimum|maximum|minItems|maxItems):\\s*(.*)$'
                if (matcher.matches()) {
                    def key = matcher[0][1] == '$ref' ? 'ref' : matcher[0][1]
                    nested[key] = unquoteOpenApiScalar(matcher[0][2])
                    return
                }
            }
        }
        if (indent == 14 && inProperties && currentProperty != null && currentNested != null && currentEnumTarget == currentNested && trimmed.startsWith('- ')) {
            def property = schemas[currentSchema].properties.find { it.name == currentProperty }
            def nested = property[currentNested]
            if (nested instanceof Map) {
                nested.enum << unquoteOpenApiScalar(trimmed.substring(2))
            }
        }
    }

    schemas
}

Map<String, Map> readOpenApiJsonSchemas(File source) {
    def json = new groovy.json.JsonSlurper().parse(source)
    def rawSchemas = json?.components?.schemas
    if (!(rawSchemas instanceof Map)) {
        return [:]
    }
    rawSchemas.collectEntries { name, schema ->
        def required = schema.required instanceof Collection ? schema.required.collect { it.toString() } as Set : [] as Set
        def properties = schema.properties instanceof Map
                ? schema.properties.collect { propertyName, property ->
                    normalizeOpenApiSchemaProperty(propertyName.toString(), property)
                }
                : []
        [(name.toString()): [
                name      : name.toString(),
                type      : schema.type?.toString() ?: 'object',
                enum      : schema.enum instanceof Collection ? schema.enum.collect { it.toString() } : [],
                required  : required,
                properties: properties
        ]]
    }
}

Map<String, Map> readOpenApiSchemas(File source) {
    if (source.name.endsWith('.json')) {
        return readOpenApiJsonSchemas(source)
    }
    readOpenApiYamlSchemas(source)
}

String renderOpenApiModelSource(String packageName, Map schema) {
    def className = javaTypeName(schema.name.toString())
    def required = schema.required as Set
    def properties = schema.properties.collect { property ->
        property + [
                fieldName: javaIdentifier(property.name.toString()),
                javaType : openApiJavaType(property, schema.name.toString()),
                required : required.contains(property.name.toString())
        ]
    }
    def imports = [
            'com.fasterxml.jackson.annotation.JsonInclude',
            'com.fasterxml.jackson.annotation.JsonProperty'
    ] as Set
    if (properties.any { it.enum instanceof Collection && !it.enum.isEmpty() }) {
        imports << 'com.fasterxml.jackson.annotation.JsonCreator'
        imports << 'com.fasterxml.jackson.annotation.JsonValue'
    }
    if (properties.any { openApiValidationAnnotations(it).contains('@NotNull') }) {
        imports << 'jakarta.validation.constraints.NotNull'
    }
    if (properties.any { openApiValidationAnnotations(it).any { annotation -> annotation.startsWith('@Size') } }) {
        imports << 'jakarta.validation.constraints.Size'
    }
    if (properties.any { openApiValidationAnnotations(it).any { annotation -> annotation.startsWith('@Pattern') } }) {
        imports << 'jakarta.validation.constraints.Pattern'
    }
    if (properties.any { openApiValidationAnnotations(it).any { annotation -> annotation.startsWith('@Min') } }) {
        imports << 'jakarta.validation.constraints.Min'
    }
    if (properties.any { openApiValidationAnnotations(it).any { annotation -> annotation.startsWith('@Max') } }) {
        imports << 'jakarta.validation.constraints.Max'
    }
    if (properties.any { openApiValidationAnnotations(it).any { annotation -> annotation.startsWith('@DecimalMin') } }) {
        imports << 'jakarta.validation.constraints.DecimalMin'
    }
    if (properties.any { openApiValidationAnnotations(it).any { annotation -> annotation.startsWith('@DecimalMax') } }) {
        imports << 'jakarta.validation.constraints.DecimalMax'
    }
    if (properties.any { it.javaType == 'LocalDate' }) {
        imports << 'java.time.LocalDate'
    }
    if (properties.any { it.javaType == 'OffsetDateTime' }) {
        imports << 'java.time.OffsetDateTime'
    }
    if (properties.any { it.javaType.startsWith('List<') }) {
        imports << 'java.util.List'
    }
    if (properties.any { it.javaType.startsWith('Map<') }) {
        imports << 'java.util.Map'
    }

    def builder = new StringBuilder()
    builder << "package ${packageName};\n\n"
    imports.sort().each { builder << "import ${it};\n" }
    builder << "\n@JsonInclude(JsonInclude.Include.NON_NULL)\n"
    builder << "public class ${className} {\n\n"
    properties.each { property ->
        openApiValidationAnnotations(property).each { annotation ->
            builder << "    ${annotation}\n"
        }
        builder << "    @JsonProperty(${javaLiteral(property.name.toString())})\n"
        builder << "    private ${property.javaType} ${property.fieldName};\n\n"
    }
    builder << "    public ${className}() {\n"
    builder << "    }\n\n"
    if (!properties.isEmpty()) {
        builder << "    public ${className}("
        builder << properties.collect { "${it.javaType} ${it.fieldName}" }.join(', ')
        builder << ") {\n"
        properties.each { property ->
            builder << "        this.${property.fieldName} = ${property.fieldName};\n"
        }
        builder << "    }\n\n"
    }
    properties.each { property ->
        def accessor = property.fieldName.substring(0, 1).toUpperCase(Locale.ROOT) + property.fieldName.substring(1)
        builder << "    public ${property.javaType} get${accessor}() {\n"
        builder << "        return ${property.fieldName};\n"
        builder << "    }\n\n"
        builder << "    public void set${accessor}(${property.javaType} ${property.fieldName}) {\n"
        builder << "        this.${property.fieldName} = ${property.fieldName};\n"
        builder << "    }\n\n"
    }
    properties.findAll { it.enum instanceof Collection && !it.enum.isEmpty() }.each { property ->
        def enumName = property.javaType
        def constants = []
        def usedNames = [] as Set
        property.enum.each { value ->
            constants << [name: openApiEnumConstantName(value.toString(), usedNames), value: value.toString()]
        }
        builder << "    public enum ${enumName} {\n\n"
        constants.eachWithIndex { constant, index ->
            builder << "        ${constant.name}(${javaLiteral(constant.value)})"
            builder << (index == constants.size() - 1 ? ";\n\n" : ",\n")
        }
        builder << "        private final String value;\n\n"
        builder << "        ${enumName}(String value) {\n"
        builder << "            this.value = value;\n"
        builder << "        }\n\n"
        builder << "        @JsonValue\n"
        builder << "        public String value() {\n"
        builder << "            return value;\n"
        builder << "        }\n\n"
        builder << "        @JsonCreator\n"
        builder << "        public static ${enumName} fromValue(String value) {\n"
        builder << "            for (${enumName} candidate : values()) {\n"
        builder << "                if (candidate.value.equals(value)) {\n"
        builder << "                    return candidate;\n"
        builder << "                }\n"
        builder << "            }\n"
        builder << "            throw new IllegalArgumentException(\"Unknown ${enumName} value: \" + value);\n"
        builder << "        }\n"
        builder << "    }\n\n"
    }
    builder << "}\n"
    builder.toString()
}

String schemaRefName(String ref) {
    if (ref == null || ref.isBlank()) {
        return null
    }
    ref.substring(ref.lastIndexOf('/') + 1)
}

Map readOpenApiDocument(File source) {
    def mapper = source.name.toLowerCase(Locale.ROOT).endsWith('.json')
            ? new com.fasterxml.jackson.databind.ObjectMapper()
            : new com.fasterxml.jackson.databind.ObjectMapper(
                    new com.fasterxml.jackson.dataformat.yaml.YAMLFactory()
            )
    mapper.readValue(source, Map)
}

Map resolveOpenApiReference(Map document, Object candidate) {
    if (!(candidate instanceof Map)) {
        return [:]
    }
    def reference = candidate.'$ref'
    if (reference == null) {
        return candidate as Map
    }
    def value = reference.toString()
    if (!value.startsWith('#/')) {
        throw new GradleException("External OpenAPI references are not supported: ${value}")
    }
    Object resolved = document
    value.substring(2).split('/').each { segment ->
        def key = segment.replace('~1', '/').replace('~0', '~')
        resolved = resolved instanceof Map ? resolved[key] : null
    }
    if (!(resolved instanceof Map)) {
        throw new GradleException("OpenAPI reference does not exist: ${value}")
    }
    resolved as Map
}

Map normalizeOpenApiOperationSchema(Object rawSchema, String name) {
    normalizeOpenApiSchemaProperty(name, rawSchema instanceof Map ? rawSchema : [:])
}

Map preferredOpenApiContent(Object rawContent) {
    if (!(rawContent instanceof Map) || rawContent.isEmpty()) {
        return [mediaTypes: [], schema: null]
    }
    def content = rawContent as Map
    def preferred = content.entrySet().find {
        it.key.toString().equalsIgnoreCase('application/json')
    } ?: content.entrySet().find {
        it.key.toString().toLowerCase(Locale.ROOT).endsWith('+json')
    } ?: content.entrySet().first()
    def definition = preferred.value
    [
            mediaTypes: content.keySet().collect { it.toString() },
            schema    : definition instanceof Map
                    ? normalizeOpenApiOperationSchema(definition.schema, 'body')
                    : null
    ]
}

Map normalizeOpenApiOperationParameter(Map document, Object rawParameter) {
    def parameter = resolveOpenApiReference(document, rawParameter)
    def name = parameter.name?.toString()
    def location = parameter.in?.toString()
    if (!openApiHasText(name) || !(location in ['path', 'query', 'header', 'cookie'])) {
        return null
    }
    def parameterContent = preferredOpenApiContent(parameter.content)
    def schema = parameter.schema instanceof Map
            ? normalizeOpenApiOperationSchema(parameter.schema, name)
            : (parameterContent.schema ?: normalizeOpenApiOperationSchema([:], name))
    def required = location == 'path' || parameter.required == true
    schema.required = required
    schema.javaType = openApiJavaType(schema)
    [
            name    : name,
            in      : location,
            required: required,
            schema  : schema,
            javaType: schema.javaType
    ]
}

List<Map> mergeOpenApiOperationParameters(Map document, Map pathDefinition, Map operation, String path) {
    def indexed = new LinkedHashMap<String, Map>()
    [pathDefinition.parameters, operation.parameters].each { group ->
        if (group instanceof Collection) {
            group.each { rawParameter ->
                def parameter = normalizeOpenApiOperationParameter(document, rawParameter)
                if (parameter != null) {
                    def keyName = parameter.in == 'header'
                            ? parameter.name.toString().toLowerCase(Locale.ROOT)
                            : parameter.name.toString()
                    indexed["${parameter.in}:${keyName}".toString()] = parameter
                }
            }
        }
    }
    def placeholders = (path =~ /\{([^}]+)\}/).collect { match -> match[1].toString() }
    placeholders.each { name ->
        def key = "path:${name}".toString()
        if (!indexed.containsKey(key)) {
            indexed[key] = [
                    name    : name,
                    in      : 'path',
                    required: true,
                    schema  : [name: name, type: 'string', format: '', ref: null, enum: [], required: true],
                    javaType: 'String'
            ]
        }
    }

    def usedJavaNames = [] as Set
    indexed.values().each { parameter ->
        def baseName = javaIdentifier(parameter.name.toString())
        def javaName = baseName
        if (usedJavaNames.contains(javaName)) {
            javaName = javaIdentifier("${baseName}-${parameter.in}")
        }
        def suffix = 2
        while (usedJavaNames.contains(javaName)) {
            javaName = "${baseName}${suffix++}".toString()
        }
        usedJavaNames << javaName
        parameter.javaName = javaName
    }
    indexed.values() as List<Map>
}

Map readOpenApiRequestBody(Map document, Map operation, Set<String> usedJavaNames) {
    if (!(operation.requestBody instanceof Map)) {
        return null
    }
    def requestBody = resolveOpenApiReference(document, operation.requestBody)
    def content = preferredOpenApiContent(requestBody.content)
    if (content.schema == null) {
        return null
    }
    def javaName = 'requestBody'
    def suffix = 2
    while (usedJavaNames.contains(javaName)) {
        javaName = "requestBody${suffix++}".toString()
    }
    content.schema.required = requestBody.required == true
    content.schema.javaType = openApiJavaType(content.schema as Map)
    [
            required  : requestBody.required == true,
            mediaTypes: content.mediaTypes,
            schema    : content.schema,
            javaType  : content.schema.javaType,
            javaName  : javaName
    ]
}

Map readOpenApiSuccessfulResponse(Map document, Map operation) {
    if (!(operation.responses instanceof Map)) {
        return [status: 204, mediaTypes: [], schema: null, javaType: 'Void']
    }
    def successful = operation.responses.entrySet()
            .findAll { entry -> entry.key.toString() ==~ /2[0-9]{2}/ }
            .sort { left, right -> left.key.toString().toInteger() <=> right.key.toString().toInteger() }
            .find()
    if (successful == null) {
        return [status: 204, mediaTypes: [], schema: null, javaType: 'Void']
    }
    def response = resolveOpenApiReference(document, successful.value)
    def content = preferredOpenApiContent(response.content)
    [
            status    : successful.key.toString().toInteger(),
            mediaTypes: content.mediaTypes,
            schema    : content.schema,
            javaType  : content.schema == null ? 'Void' : openApiJavaType(content.schema as Map)
    ]
}

List<Map> readOpenApiOperations(File source) {
    def document = readOpenApiDocument(source)
    def paths = document.paths
    if (!(paths instanceof Map)) {
        return []
    }
    def methods = ['get', 'post', 'put', 'patch', 'delete', 'head', 'options', 'trace'] as Set
    def operations = []
    paths.each { rawPath, rawPathDefinition ->
        if (!(rawPathDefinition instanceof Map)) {
            return
        }
        def path = rawPath.toString()
        def pathDefinition = rawPathDefinition as Map
        pathDefinition.each { rawMethod, rawOperation ->
            def methodName = rawMethod.toString().toLowerCase(Locale.ROOT)
            if (!methods.contains(methodName) || !(rawOperation instanceof Map)) {
                return
            }
            def operation = rawOperation as Map
            def parameters = mergeOpenApiOperationParameters(document, pathDefinition, operation, path)
            def usedJavaNames = parameters.collect { it.javaName.toString() } as Set
            operations << [
                    path       : path,
                    method     : methodName.toUpperCase(Locale.ROOT),
                    operationId: operation.operationId?.toString()
                            ?: javaIdentifier("${methodName}-${path}"),
                    deprecated : operation.deprecated == true,
                    parameters : parameters,
                    requestBody: readOpenApiRequestBody(document, operation, usedJavaNames),
                    response   : readOpenApiSuccessfulResponse(document, operation)
            ]
        }
    }
    operations
}

String responseJavaType(Map operation) {
    operation.response.javaType.toString()
}

List<Map> openApiOperationArguments(Map operation) {
    def arguments = new ArrayList<Map>(operation.parameters as List<Map>)
    if (operation.requestBody instanceof Map) {
        arguments << (operation.requestBody + [in: 'body', name: 'requestBody'])
    }
    arguments
}

void addOpenApiTypeImports(Set<String> imports, String modelPackageName, Map schema, String javaType) {
    if (javaType.startsWith('List<')) {
        imports << 'java.util.List'
    }
    if (javaType.startsWith('Map<')) {
        imports << 'java.util.Map'
    }
    if (javaType.contains('LocalDate')) {
        imports << 'java.time.LocalDate'
    }
    if (javaType.contains('OffsetDateTime')) {
        imports << 'java.time.OffsetDateTime'
    }
    if (openApiHasText(schema?.ref)) {
        imports << "${modelPackageName}.${javaTypeName(schemaRefName(schema.ref.toString()))}".toString()
    }
    if (schema?.items instanceof Map) {
        addOpenApiTypeImports(imports, modelPackageName, schema.items as Map, openApiJavaType(schema.items as Map))
    }
}

Set<String> openApiOperationTypeImports(String modelPackageName, List<Map> operations) {
    def imports = [] as Set
    operations.each { operation ->
        openApiOperationArguments(operation).each { argument ->
            addOpenApiTypeImports(imports, modelPackageName, argument.schema as Map, argument.javaType.toString())
        }
        if (operation.response.schema instanceof Map) {
            addOpenApiTypeImports(
                    imports,
                    modelPackageName,
                    operation.response.schema as Map,
                    responseJavaType(operation)
            )
        }
    }
    imports
}

Set<String> openApiOperationValidationImports(List<Map> operations) {
    def imports = [] as Set
    openApiOperationArgumentsForAll(operations).each { argument ->
        def annotations = openApiValidationAnnotations(argument.schema as Map)
        if (annotations.contains('@NotNull')) {
            imports << 'jakarta.validation.constraints.NotNull'
        }
        if (annotations.any { it.startsWith('@Size') }) {
            imports << 'jakarta.validation.constraints.Size'
        }
        if (annotations.any { it.startsWith('@Pattern') }) {
            imports << 'jakarta.validation.constraints.Pattern'
        }
        if (annotations.any { it.startsWith('@Min') }) {
            imports << 'jakarta.validation.constraints.Min'
        }
        if (annotations.any { it.startsWith('@Max') }) {
            imports << 'jakarta.validation.constraints.Max'
        }
        if (annotations.any { it.startsWith('@DecimalMin') }) {
            imports << 'jakarta.validation.constraints.DecimalMin'
        }
        if (annotations.any { it.startsWith('@DecimalMax') }) {
            imports << 'jakarta.validation.constraints.DecimalMax'
        }
        if (argument.in == 'body') {
            imports << 'jakarta.validation.Valid'
        }
    }
    imports
}

List<Map> openApiOperationArgumentsForAll(List<Map> operations) {
    operations.collectMany { openApiOperationArguments(it) }
}

String openApiMediaTypeAttribute(String name, Collection mediaTypes) {
    if (mediaTypes == null || mediaTypes.isEmpty()) {
        return null
    }
    if (mediaTypes.size() == 1) {
        return "${name} = ${javaLiteral(mediaTypes.first().toString())}".toString()
    }
    "${name} = {${mediaTypes.collect { javaLiteral(it.toString()) }.join(', ')}}".toString()
}

String openApiBindingAnnotation(Map argument) {
    def required = argument.required == true
    switch (argument.in) {
        case 'path':
            return "@PathVariable(${javaLiteral(argument.name.toString())})"
        case 'query':
            return "@RequestParam(name = ${javaLiteral(argument.name.toString())}, required = ${required})"
        case 'header':
            return "@RequestHeader(name = ${javaLiteral(argument.name.toString())}, required = ${required})"
        case 'cookie':
            return "@CookieValue(name = ${javaLiteral(argument.name.toString())}, required = ${required})"
        case 'body':
            return "@RequestBody(required = ${required})"
        default:
            throw new GradleException("Unsupported OpenAPI parameter location: ${argument.in}")
    }
}

String renderOpenApiOperationParameters(Map operation, boolean annotated) {
    openApiOperationArguments(operation).collect { argument ->
        def typeAndName = "${argument.javaType} ${argument.javaName}".toString()
        if (!annotated) {
            return typeAndName
        }
        def annotations = openApiValidationAnnotations(argument.schema as Map)
        if (argument.in == 'body') {
            annotations = ['@Valid'] + annotations
        }
        annotations << openApiBindingAnnotation(argument)
        "${annotations.join(' ')} ${typeAndName}".toString()
    }.join(', ')
}

String renderOpenApiOperationArguments(Map operation) {
    openApiOperationArguments(operation).collect { it.javaName.toString() }.join(', ')
}

String renderOpenApiDelegateSource(String packageName, String modelPackageName, String interfaceName, List<Map> operations) {
    def imports = openApiOperationTypeImports(modelPackageName, operations)
    def builder = new StringBuilder()
    builder << "package ${packageName};\n\n"
    imports.sort().each { builder << "import ${it};\n" }
    if (!imports.isEmpty()) {
        builder << "\n"
    }
    builder << "public interface ${interfaceName} {\n\n"
    operations.each { operation ->
        def returnType = responseJavaType(operation)
        def parameters = renderOpenApiOperationParameters(operation, false)
        if (operation.deprecated) {
            builder << "    @Deprecated\n"
        }
        builder << "    ${returnType} ${javaIdentifier(operation.operationId.toString())}(${parameters});\n\n"
    }
    builder << "}\n"
    builder.toString()
}

String renderOpenApiControllerSource(String packageName, String modelPackageName, String interfaceName, String controllerName, List<Map> operations) {
    def imports = [
            'org.springframework.http.ResponseEntity',
            'org.springframework.web.bind.annotation.RequestMapping',
            'org.springframework.web.bind.annotation.RequestMethod',
            'org.springframework.web.bind.annotation.RestController'
    ] as Set
    imports.addAll(openApiOperationTypeImports(modelPackageName, operations))
    imports.addAll(openApiOperationValidationImports(operations))
    operations.each { operation ->
        operation.parameters.each { parameter ->
            switch (parameter.in) {
                case 'path':
                    imports << 'org.springframework.web.bind.annotation.PathVariable'
                    break
                case 'query':
                    imports << 'org.springframework.web.bind.annotation.RequestParam'
                    break
                case 'header':
                    imports << 'org.springframework.web.bind.annotation.RequestHeader'
                    break
                case 'cookie':
                    imports << 'org.springframework.web.bind.annotation.CookieValue'
                    break
            }
        }
        if (operation.requestBody instanceof Map) {
            imports << 'org.springframework.web.bind.annotation.RequestBody'
        }
    }

    def builder = new StringBuilder()
    builder << "package ${packageName};\n\n"
    imports.sort().each { builder << "import ${it};\n" }
    builder << "\n@RestController\n"
    builder << "@RequestMapping\n"
    builder << "public class ${controllerName} {\n\n"
    builder << "    private final ${interfaceName} delegate;\n\n"
    builder << "    public ${controllerName}(${interfaceName} delegate) {\n"
    builder << "        this.delegate = delegate;\n"
    builder << "    }\n\n"
    operations.each { operation ->
        def returnType = responseJavaType(operation)
        def methodName = javaIdentifier(operation.operationId.toString())
        def parameters = renderOpenApiOperationParameters(operation, true)
        def delegateArgs = renderOpenApiOperationArguments(operation)
        def mappingAttributes = [
                "path = ${javaLiteral(operation.path.toString())}",
                "method = RequestMethod.${operation.method}"
        ]
        def consumes = openApiMediaTypeAttribute('consumes', operation.requestBody?.mediaTypes as Collection)
        def produces = openApiMediaTypeAttribute('produces', operation.response.mediaTypes as Collection)
        if (consumes != null) {
            mappingAttributes << consumes
        }
        if (produces != null) {
            mappingAttributes << produces
        }
        if (operation.deprecated) {
            builder << "    @Deprecated\n"
        }
        builder << "    @RequestMapping(${mappingAttributes.join(', ')})\n"
        builder << "    public ResponseEntity<${returnType}> ${methodName}(${parameters}) {\n"
        if (returnType == 'Void') {
            builder << "        delegate.${methodName}(${delegateArgs});\n"
            builder << "        return ResponseEntity.status(${operation.response.status}).build();\n"
        } else {
            builder << "        return ResponseEntity.status(${operation.response.status})\n"
            builder << "                .body(delegate.${methodName}(${delegateArgs}));\n"
        }
        builder << "    }\n\n"
    }
    builder << "}\n"
    builder.toString()
}

String openApiClientExchangeAnnotation(String method) {
    switch (method) {
        case 'GET':
            return 'GetExchange'
        case 'POST':
            return 'PostExchange'
        case 'PUT':
            return 'PutExchange'
        case 'PATCH':
            return 'PatchExchange'
        case 'DELETE':
            return 'DeleteExchange'
        default:
            return 'HttpExchange'
    }
}

String renderOpenApiClientSource(
        String packageName,
        String modelPackageName,
        String interfaceName,
        String clientName,
        List<Map> operations
) {
    def imports = [
            'com.smbtech.serviceframework.starter.restclient.api.HttpApiClient',
            'org.springframework.web.service.annotation.HttpExchange'
    ] as Set
    imports.addAll(openApiOperationTypeImports(modelPackageName, operations))
    imports.addAll(openApiOperationValidationImports(operations))
    operations.each { operation ->
        operation.parameters.each { parameter ->
            switch (parameter.in) {
                case 'path':
                    imports << 'org.springframework.web.bind.annotation.PathVariable'
                    break
                case 'query':
                    imports << 'org.springframework.web.bind.annotation.RequestParam'
                    break
                case 'header':
                    imports << 'org.springframework.web.bind.annotation.RequestHeader'
                    break
                case 'cookie':
                    imports << 'org.springframework.web.bind.annotation.CookieValue'
                    break
            }
        }
        if (operation.requestBody instanceof Map) {
            imports << 'org.springframework.web.bind.annotation.RequestBody'
        }
    }

    def builder = new StringBuilder()
    builder << "package ${packageName};\n\n"
    imports.sort().each { builder << "import ${it};\n" }
    builder << "\n@HttpApiClient(${javaLiteral(clientName)})\n"
    builder << "@HttpExchange\n"
    builder << "public interface ${interfaceName} {\n\n"
    operations.each { operation ->
        def returnType = responseJavaType(operation)
        def methodName = javaIdentifier(operation.operationId.toString())
        def parameters = renderOpenApiOperationParameters(operation, true)
        def exchangeAttributes = [
                "url = ${javaLiteral(operation.path.toString())}",
                "method = ${javaLiteral(operation.method.toString())}"
        ]
        if (operation.requestBody?.mediaTypes instanceof Collection
                && !operation.requestBody.mediaTypes.isEmpty()) {
            exchangeAttributes << "contentType = ${javaLiteral(operation.requestBody.mediaTypes.first().toString())}"
        }
        def accept = openApiMediaTypeAttribute('accept', operation.response.mediaTypes as Collection)
        if (accept != null) {
            exchangeAttributes << accept
        }
        if (operation.deprecated) {
            builder << "    @Deprecated\n"
        }
        builder << "    @HttpExchange(${exchangeAttributes.join(', ')})\n"
        builder << "    ${returnType == 'Void' ? 'void' : returnType} ${methodName}(${parameters});\n\n"
    }
    builder << "}\n"
    builder.toString()
}

String renderOpenApiCompilationTestSource(
        String packageName,
        String modelPackageName,
        String apiPackageName,
        String clientPackageName,
        String typePrefix,
        List<Map> operations
) {
    def imports = [
            "${apiPackageName}.${typePrefix}ApiController".toString(),
            "${apiPackageName}.${typePrefix}ApiDelegate".toString(),
            "${clientPackageName}.${typePrefix}Client".toString(),
            'org.springframework.http.ResponseEntity'
    ] as Set
    imports.addAll(openApiOperationTypeImports(modelPackageName, operations))

    def builder = new StringBuilder()
    builder << "package ${packageName};\n\n"
    imports.sort().each { builder << "import ${it};\n" }
    builder << "\npublic final class ${typePrefix}GeneratedArtifactsCompileTest {\n\n"
    builder << "    private ${typePrefix}GeneratedArtifactsCompileTest() {\n"
    builder << "    }\n\n"

    operations.each { operation ->
        def responseType = responseJavaType(operation)
        def methodName = javaIdentifier(operation.operationId.toString())
        def methodSuffix = javaTypeName(operation.operationId.toString())
        def invocationArguments = openApiOperationArguments(operation).collect { 'null' }.join(', ')
        if (responseType == 'Void') {
            builder << "    public static void compileClient${methodSuffix}(${typePrefix}Client client) {\n"
            builder << "        client.${methodName}(${invocationArguments});\n"
            builder << "    }\n\n"
            builder << "    public static ResponseEntity<Void> compileServerController${methodSuffix}() {\n"
            builder << "        return new ${typePrefix}ApiController(new CompileDelegate()).${methodName}(${invocationArguments});\n"
            builder << "    }\n\n"
        } else {
            builder << "    public static ${responseType} compileClient${methodSuffix}(${typePrefix}Client client) {\n"
            builder << "        return client.${methodName}(${invocationArguments});\n"
            builder << "    }\n\n"
            builder << "    public static ResponseEntity<${responseType}> compileServerController${methodSuffix}() {\n"
            builder << "        return new ${typePrefix}ApiController(new CompileDelegate()).${methodName}(${invocationArguments});\n"
            builder << "    }\n\n"
        }
    }

    builder << "    private static final class CompileDelegate implements ${typePrefix}ApiDelegate {\n"
    operations.each { operation ->
        def responseType = responseJavaType(operation)
        def methodName = javaIdentifier(operation.operationId.toString())
        def parameters = renderOpenApiOperationParameters(operation, false)
        builder << "        @Override\n"
        builder << "        public ${responseType} ${methodName}(${parameters}) {\n"
        builder << "            return null;\n"
        builder << "        }\n\n"
    }
    builder << "    }\n"
    builder << "}\n"
    builder.toString()
}

def openApiSpecFiles = {
    fileTree(rootDir) {
        include '**/src/main/openapi/*.yaml'
        include '**/src/main/openapi/*.yml'
        include '**/src/main/openapi/*.json'
        include '**/openapi/*.yaml'
        include '**/openapi/*.yml'
        include '**/openapi/*.json'
        include '**/swagger/*.yaml'
        include '**/swagger/*.yml'
        include '**/swagger/*.json'
        exclude '**/.git/**'
        exclude '**/.gradle/**'
        exclude '**/build/**'
    }
}


tasks.register('validateOpenApiNameNormalization') {
    group = 'verification'
    description = 'Validates the OpenAPI info.title normalization contract.'

    doLast {
        def failures = []
        def validExamples = [
                'merchant-order-status': 'merchant-order-status',
                'Merchant Order Status': 'merchant-order-status',
                'merchant_order_status': 'merchant-order-status',
                'Merchant.Order.Status': 'merchant-order-status',
                '  Merchant   Order__Status  ': 'merchant-order-status',
                'payments-v2': 'payments-v2',
                'Payments 2 API': 'payments-2-api'
        ]
        def invalidExamples = [
                '',
                '   ',
                '---',
                '_merchant-order-status_',
                '.merchant-order-status.',
                '@@@'
        ]

        validExamples.each { title, expected ->
            def actual = normalizeOpenApiTitle(title)
            if (actual != expected) {
                failures << "expected '${title}' to normalize to '${expected}', found '${actual}'"
            }
            if (!isValidOpenApiArtifactBaseName(actual)) {
                failures << "expected normalized title '${actual}' to be a valid artifact base name"
            }
        }

        invalidExamples.each { title ->
            def normalized = normalizeOpenApiTitle(title)
            if (isValidOpenApiArtifactBaseName(normalized)) {
                failures << "expected '${title}' to normalize to an invalid artifact base name, found '${normalized}'"
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("OpenAPI name normalization issues found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('validateOpenApiSpecs') {
    group = 'verification'
    description = 'Validates OpenAPI info.title and info.version for generated artifact coordinates.'

    inputs.files(openApiSpecFiles())

    doLast {
        def failures = []
        def resolvedCoordinates = [:]
        def versionPattern = ~/^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z][0-9A-Za-z.-]*)?$/
        def frameworkArtifactNames = [
                'spring-boot-service-framework-commons',
                'spring-boot-service-framework-logging-core',
                'spring-boot-service-framework-http-client-core',
                'spring-boot-service-framework-mock-core',
                'spring-boot-service-framework-starter-logging',
                'spring-boot-service-framework-starter-rest-client',
                'spring-boot-service-framework-starter-mock'
        ] as Set

        inputs.files.files.sort().each { source ->
            def info
            try {
                if (source.name.endsWith('.json')) {
                    info = readOpenApiJsonInfo(source)
                } else {
                    info = readOpenApiYamlInfo(source)
                }
            } catch (Exception ex) {
                failures << "${relativePath(source)}: cannot parse OpenAPI info.title/info.version (${ex.message})"
                return
            }

            def title = info.title
            def version = info.version
            if (title == null || title.trim().isBlank()) {
                failures << "${relativePath(source)}: info.title is required"
            }
            if (version == null || version.trim().isBlank()) {
                failures << "${relativePath(source)}: info.version is required"
            }

            if (title != null && !title.trim().isBlank()) {
                def artifactBaseName = normalizeOpenApiTitle(title)
                if (!isValidOpenApiArtifactBaseName(artifactBaseName)) {
                    failures << "${relativePath(source)}: normalized info.title must match [a-z0-9]+(-[a-z0-9]+)*, found '${artifactBaseName}'"
                }

                ['models', 'api', 'client'].each { suffix ->
                    def artifactName = "${artifactBaseName}-${suffix}".toString()
                    if (frameworkArtifactNames.contains(artifactName)) {
                        failures << "${relativePath(source)}: generated artifact ${artifactName} collides with a framework artifact"
                    }
                    if (version != null && !version.trim().isBlank()) {
                        def coordinate = "com.smbtech.openapi:${artifactName}:${version.trim()}".toString()
                        def previous = resolvedCoordinates.putIfAbsent(coordinate, relativePath(source))
                        if (previous != null) {
                            failures << "${relativePath(source)}: generated coordinate ${coordinate} duplicates ${previous}"
                        }
                    }
                }
            }

            if (version != null && !version.trim().isBlank() && !(version.trim() ==~ versionPattern)) {
                failures << "${relativePath(source)}: info.version must be SemVer/Maven compatible, found '${version}'"
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("OpenAPI spec validation issues found:\n" + failures.join('\n'))
        }
    }
}

File openApiSpecVersionCatalogFile() {
    file('docs/openapi/spec-versions.properties')
}

String openApiSpecVersionCatalogKey(String artifactBaseName, String version) {
    "${artifactBaseName}/${version}".toString()
}

String openApiPropertyValue(String value) {
    value
            .replace('\\', '\\\\')
            .replace('\n', '\\n')
            .replace('\r', '\\r')
            .replace('\t', '\\t')
}

tasks.register('generateOpenApiSpecVersionCatalog') {
    group = 'openapi'
    description = 'Updates the committed OpenAPI spec version catalog for current specs.'

    dependsOn tasks.named('validateOpenApiSpecs')
    inputs.files(openApiSpecFiles())
    outputs.file(openApiSpecVersionCatalogFile())

    doLast {
        def catalogFile = openApiSpecVersionCatalogFile()
        def catalog = new Properties()
        if (catalogFile.isFile()) {
            catalogFile.withInputStream { catalog.load(it) }
        }

        openApiSpecFiles().files.findAll { it.isFile() }.sort().each { source ->
            def info = readOpenApiInfo(source)
            def artifactBaseName = normalizeOpenApiTitle(info.title)
            def key = openApiSpecVersionCatalogKey(artifactBaseName, info.version)
            catalog.setProperty("${key}/title", info.title)
            catalog.setProperty("${key}/source", relativePath(source).replace(File.separator, '/'))
            catalog.setProperty("${key}/sha256", sha256(source))
        }

        catalogFile.parentFile.mkdirs()
        def body = catalog.stringPropertyNames().sort().collect { key ->
            "${key}=${openApiPropertyValue(catalog.getProperty(key))}".toString()
        }.join('\n')
        catalogFile.text = '# OpenAPI spec version catalog' + '\n' +
                '# Update with ./gradlew generateOpenApiSpecVersionCatalog after intentional info.version changes.' + '\n' +
                body + '\n'
    }
}

tasks.register('validateOpenApiSpecVersionCatalog') {
    group = 'verification'
    description = 'Validates that OpenAPI spec content matches the committed version catalog.'

    dependsOn tasks.named('validateOpenApiSpecs')
    inputs.files(openApiSpecFiles())
    inputs.file(openApiSpecVersionCatalogFile())

    doLast {
        def failures = []
        def catalogFile = openApiSpecVersionCatalogFile()
        if (!catalogFile.isFile()) {
            throw new GradleException(
                    "OpenAPI spec version catalog is missing: ${relativePath(catalogFile)}\n" +
                            "Run ./gradlew generateOpenApiSpecVersionCatalog and commit the generated file."
            )
        }

        def catalog = new Properties()
        catalogFile.withInputStream { catalog.load(it) }

        def entryFields = [:].withDefault { [] as Set }
        def entryPattern = ~/^([a-z0-9]+(?:-[a-z0-9]+)*)\/([^\/]+)\/(title|source|sha256)$/
        catalog.stringPropertyNames().sort().each { propertyName ->
            def matcher = propertyName =~ entryPattern
            if (!matcher.matches()) {
                failures << "${relativePath(catalogFile)}: unsupported key '${propertyName}'"
            } else {
                entryFields["${matcher[0][1]}/${matcher[0][2]}"] << matcher[0][3]
            }
        }
        entryFields.each { key, fields ->
            ['title', 'source', 'sha256'].each { requiredField ->
                if (!fields.contains(requiredField)) {
                    failures << "${relativePath(catalogFile)}: ${key} is missing ${requiredField}"
                }
            }
        }

        openApiSpecFiles().files.findAll { it.isFile() }.sort().each { source ->
            def info = readOpenApiInfo(source)
            def artifactBaseName = normalizeOpenApiTitle(info.title)
            def key = openApiSpecVersionCatalogKey(artifactBaseName, info.version)
            def expectedSource = relativePath(source).replace(File.separator, '/')
            def expectedSha = sha256(source)
            def catalogTitle = catalog.getProperty("${key}/title")
            def catalogSource = catalog.getProperty("${key}/source")
            def catalogSha = catalog.getProperty("${key}/sha256")

            if (catalogTitle == null || catalogSource == null || catalogSha == null) {
                failures << "${relativePath(source)}: missing catalog entry for ${key}; run ./gradlew generateOpenApiSpecVersionCatalog after confirming the spec version"
                return
            }
            if (catalogTitle != info.title) {
                failures << "${relativePath(source)}: catalog title for ${key} must be '${info.title}', found '${catalogTitle}'"
            }
            if (catalogSource != expectedSource) {
                failures << "${relativePath(source)}: catalog source for ${key} must be '${expectedSource}', found '${catalogSource}'"
            }
            if (catalogSha != expectedSha) {
                failures << "${relativePath(source)}: content changed for ${key} without a catalog update. If this is a contract change, bump info.version and run ./gradlew generateOpenApiSpecVersionCatalog"
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("OpenAPI spec version catalog issues found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('generateOpenApiMetadata') {
    group = 'documentation'
    description = 'Generates deterministic OpenAPI contract metadata for models, api, and client artifacts.'

    dependsOn tasks.named('validateOpenApiSpecVersionCatalog')
    inputs.files(openApiSpecFiles())
    outputs.dir(layout.buildDirectory.dir('generated/smbtech-openapi/metadata'))

    doLast {
        def outputRoot = layout.buildDirectory.dir('generated/smbtech-openapi/metadata').get().asFile
        delete outputRoot

        inputs.files.files.sort().each { source ->
            def info = readOpenApiInfo(source)
            def artifactBaseName = normalizeOpenApiTitle(info.title)
            ['models', 'api', 'client'].each { artifactKind ->
                def metadata = openApiContractMetadata(source, artifactKind)
                def metadataFile = new File(
                        outputRoot,
                        "${artifactBaseName}/${artifactKind}/META-INF/smbtech/openapi/contract.properties"
                )
                metadataFile.parentFile.mkdirs()
                metadataFile.text = formatContractMetadata(metadata)
            }
        }
    }
}

tasks.register('validateOpenApiMetadata') {
    group = 'verification'
    description = 'Validates generated OpenAPI contract metadata files.'

    dependsOn tasks.named('generateOpenApiMetadata')
    inputs.files(openApiSpecFiles())
    inputs.dir(layout.buildDirectory.dir('generated/smbtech-openapi/metadata'))

    doLast {
        def failures = []
        def outputRoot = layout.buildDirectory.dir('generated/smbtech-openapi/metadata').get().asFile
        def requiredKeys = [
                'openapi.title',
                'openapi.version',
                'openapi.artifact.base-name',
                'openapi.artifact.group-id',
                'openapi.artifact.kind',
                'openapi.artifact.models',
                'openapi.artifact.api',
                'openapi.artifact.client',
                'openapi.source',
                'openapi.sha256',
                'openapi.generator',
                'openapi.generator.version'
        ]

        openApiSpecFiles().files.findAll { it.isFile() }.sort().each { source ->
            def info = readOpenApiInfo(source)
            def artifactBaseName = normalizeOpenApiTitle(info.title)
            ['models', 'api', 'client'].each { artifactKind ->
                def metadataFile = new File(
                        outputRoot,
                        "${artifactBaseName}/${artifactKind}/META-INF/smbtech/openapi/contract.properties"
                )
                if (!metadataFile.isFile()) {
                    failures << "${relativePath(source)}: missing metadata file for ${artifactKind}"
                    return
                }

                def properties = new Properties()
                metadataFile.withInputStream { properties.load(it) }
                requiredKeys.each { key ->
                    if (!properties.getProperty(key)) {
                        failures << "${relativePath(metadataFile)}: missing ${key}"
                    }
                }

                def expected = openApiContractMetadata(source, artifactKind)
                expected.each { key, value ->
                    if (properties.getProperty(key) != value) {
                        failures << "${relativePath(metadataFile)}: expected ${key}=${value}, found ${properties.getProperty(key)}"
                    }
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("OpenAPI metadata issues found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('generateOpenApiModels') {
    group = 'openapi'
    description = 'Generates Java model sources from OpenAPI component schemas.'

    dependsOn tasks.named('validateOpenApiSpecs')
    inputs.files(openApiSpecFiles())
    outputs.dir(layout.buildDirectory.dir('generated/smbtech-openapi/models'))

    doLast {
        def outputRoot = layout.buildDirectory.dir('generated/smbtech-openapi/models').get().asFile
        delete outputRoot

        inputs.files.files.sort().each { source ->
            def info = readOpenApiInfo(source)
            def artifactBaseName = normalizeOpenApiTitle(info.title)
            def packageName = "${openApiBasePackage(artifactBaseName)}.model".toString()
            def sourceRoot = new File(outputRoot, "${artifactBaseName}/src/main/java")
            def packageDir = new File(sourceRoot, packageName.replace('.', '/'))
            packageDir.mkdirs()

            def schemas = readOpenApiSchemas(source)
            schemas.values()
                    .findAll { it.type == 'object' || (it.enum instanceof Collection && !it.enum.isEmpty()) }
                    .sort { it.name }
                    .each { schema ->
                        def className = javaTypeName(schema.name.toString())
                        def sourceFile = new File(packageDir, "${className}.java")
                        if (schema.enum instanceof Collection && !schema.enum.isEmpty() && schema.type != 'object') {
                            sourceFile.text = renderOpenApiEnumSource(packageName, className, schema.enum)
                        } else {
                            sourceFile.text = renderOpenApiModelSource(packageName, schema)
                        }
                    }
        }
    }
}

tasks.register('openApiModelsJar') {
    group = 'openapi'
    description = 'Compiles generated OpenAPI model sources and packages one models JAR per contract.'

    dependsOn(
            tasks.named('generateOpenApiModels'),
            tasks.named('generateOpenApiMetadata')
    )
    inputs.files(openApiSpecFiles())
    inputs.files(configurations.openApiModelCompileClasspath)
    outputs.dir(layout.buildDirectory.dir('libs/openapi/models'))
    outputs.dir(layout.buildDirectory.dir('classes/smbtech-openapi/models'))

    doLast {
        def generatedRoot = layout.buildDirectory.dir('generated/smbtech-openapi/models').get().asFile
        def metadataRoot = layout.buildDirectory.dir('generated/smbtech-openapi/metadata').get().asFile
        def classesRoot = layout.buildDirectory.dir('classes/smbtech-openapi/models').get().asFile
        def libsRoot = layout.buildDirectory.dir('libs/openapi/models').get().asFile
        delete classesRoot
        delete libsRoot
        classesRoot.mkdirs()
        libsRoot.mkdirs()

        openApiSpecFiles().files.sort().each { source ->
            def info = readOpenApiInfo(source)
            def artifactBaseName = normalizeOpenApiTitle(info.title)
            def sourceRoot = new File(generatedRoot, "${artifactBaseName}/src/main/java")
            def classesDir = new File(classesRoot, artifactBaseName)
            classesDir.mkdirs()

            if (!sourceRoot.exists() || sourceRoot.listFiles()?.length == 0) {
                throw new GradleException("${relativePath(source)}: no OpenAPI model sources were generated")
            }

            ant.javac(
                    srcdir: sourceRoot,
                    destdir: classesDir,
                    release: '21',
                    includeantruntime: 'false',
                    encoding: 'UTF-8',
                    classpath: configurations.openApiModelCompileClasspath.asPath
            )

            def artifactFile = new File(libsRoot, "${artifactBaseName}-models-${info.version}.jar")
            createOpenApiReproducibleJar(
                    artifactFile,
                    [classesDir, new File(metadataRoot, "${artifactBaseName}/models")]
            )
        }
    }
}

tasks.register('validateOpenApiModelsJar') {
    group = 'verification'
    description = 'Validates generated OpenAPI models JAR contents.'

    dependsOn tasks.named('openApiModelsJar')
    inputs.files(openApiSpecFiles())
    inputs.dir(layout.buildDirectory.dir('libs/openapi/models'))

    doLast {
        def failures = []
        def libsRoot = layout.buildDirectory.dir('libs/openapi/models').get().asFile

        openApiSpecFiles().files.sort().each { source ->
            def info = readOpenApiInfo(source)
            def artifactBaseName = normalizeOpenApiTitle(info.title)
            def packageName = "${openApiBasePackage(artifactBaseName)}.model".toString()
            def artifactFile = new File(libsRoot, "${artifactBaseName}-models-${info.version}.jar")
            if (!artifactFile.isFile()) {
                failures << "${relativePath(source)}: missing models JAR ${artifactFile.name}"
                return
            }

            def jar = new java.util.jar.JarFile(artifactFile)
            try {
                def metadataEntry = jar.getEntry('META-INF/smbtech/openapi/contract.properties')
                if (metadataEntry == null) {
                    failures << "${artifactFile.name}: missing META-INF/smbtech/openapi/contract.properties"
                }

                def schemas = readOpenApiSchemas(source)
                schemas.values()
                        .findAll { it.type == 'object' || (it.enum instanceof Collection && !it.enum.isEmpty()) }
                        .each { schema ->
                            def classEntry = "${packageName.replace('.', '/')}/${javaTypeName(schema.name.toString())}.class"
                            if (jar.getEntry(classEntry) == null) {
                                failures << "${artifactFile.name}: missing ${classEntry}"
                            }
                        }
            } finally {
                jar.close()
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("OpenAPI models JAR issues found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('validateOpenApiAdvancedModelGeneration') {
    group = 'verification'
    description = 'Validates advanced OpenAPI model generation for refs, enums, arrays, maps, and validation annotations.'

    dependsOn tasks.named('generateOpenApiModels')
    inputs.file(file('docs/openapi/warehouse-inventory-catalog.yaml'))
    inputs.dir(layout.buildDirectory.dir('generated/smbtech-openapi/models'))

    doLast {
        def failures = []
        def sourceRoot = layout.buildDirectory.dir('generated/smbtech-openapi/models').get().asFile
        def modelPackagePath = 'warehouse-inventory-catalog/src/main/java/com/smbtech/openapi/warehouseinventorycatalog/model'
        def itemSource = new File(sourceRoot, "${modelPackagePath}/InventoryItemResponse.java")
        def statusSource = new File(sourceRoot, "${modelPackagePath}/InventoryStatus.java")

        if (!itemSource.isFile()) {
            failures << "${relativePath(itemSource)}: generated advanced model source is missing"
        } else {
            def text = itemSource.text
            [
                    'private InventoryStatus status;',
                    'private WarehouseSummary warehouse;',
                    'private List<String> tags;',
                    'private Map<String, String> attributes;',
                    'private InventoryItemResponseLifecycleState lifecycleState;',
                    '@Size(min = 3, max = 32)',
                    '@Pattern(regexp = "^[A-Z0-9-]+$")',
                    '@Min(0)',
                    '@Max(999999)',
                    '@DecimalMin("0.01")',
                    '@DecimalMax("99999.99")',
                    '@Size(min = 1, max = 10)',
                    'public enum InventoryItemResponseLifecycleState',
                    '@JsonCreator',
                    '@JsonValue'
            ].each { expected ->
                if (!text.contains(expected)) {
                    failures << "${relativePath(itemSource)}: missing generated snippet ${expected}"
                }
            }
        }

        if (!statusSource.isFile()) {
            failures << "${relativePath(statusSource)}: generated top-level enum source is missing"
        } else {
            def text = statusSource.text
            ['public enum InventoryStatus', 'AVAILABLE("available")', 'DISCONTINUED("discontinued")'].each { expected ->
                if (!text.contains(expected)) {
                    failures << "${relativePath(statusSource)}: missing generated snippet ${expected}"
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("OpenAPI advanced model generation issues found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('generateOpenApiServerApi') {
    group = 'openapi'
    description = 'Generates Spring server API delegate and controller sources from OpenAPI paths.'

    dependsOn(
            tasks.named('validateOpenApiSpecs'),
            tasks.named('generateOpenApiModels')
    )
    inputs.files(openApiSpecFiles())
    outputs.dir(layout.buildDirectory.dir('generated/smbtech-openapi/server-api'))

