            }

            new File(packageDir, "${clientName}.java").text = renderOpenApiClientSource(
                    clientPackageName,
                    modelPackageName,
                    clientName,
                    artifactBaseName,
                    operations
            )
        }
    }
}

tasks.register('openApiClientJar') {
    group = 'openapi'
    description = 'Compiles generated OpenAPI REST client sources and packages one client JAR per contract.'

    dependsOn(
            tasks.named('generateOpenApiClient'),
            tasks.named('openApiModelsJar'),
            tasks.named('generateOpenApiMetadata'),
            ':spring-boot-service-framework-starters:spring-boot-service-framework-starter-rest-client:jar'
    )
    inputs.files(openApiSpecFiles())
    inputs.files(configurations.openApiClientCompileClasspath)
    inputs.file(project(':spring-boot-service-framework-starters:spring-boot-service-framework-starter-rest-client')
            .tasks.named('jar')
            .flatMap { it.archiveFile })
    outputs.dir(layout.buildDirectory.dir('libs/openapi/client'))
    outputs.dir(layout.buildDirectory.dir('classes/smbtech-openapi/client'))

    doLast {
        def generatedRoot = layout.buildDirectory.dir('generated/smbtech-openapi/client').get().asFile
        def metadataRoot = layout.buildDirectory.dir('generated/smbtech-openapi/metadata').get().asFile
        def classesRoot = layout.buildDirectory.dir('classes/smbtech-openapi/client').get().asFile
        def modelsLibsRoot = layout.buildDirectory.dir('libs/openapi/models').get().asFile
        def libsRoot = layout.buildDirectory.dir('libs/openapi/client').get().asFile
        def restClientStarterJar = project(':spring-boot-service-framework-starters:spring-boot-service-framework-starter-rest-client')
                .tasks.named('jar')
                .get()
                .archiveFile
                .get()
                .asFile
        delete classesRoot
        delete libsRoot
        classesRoot.mkdirs()
        libsRoot.mkdirs()

        openApiSpecFiles().files.sort().each { source ->
            def info = readOpenApiInfo(source)
            def artifactBaseName = normalizeOpenApiTitle(info.title)
            def sourceRoot = new File(generatedRoot, "${artifactBaseName}/src/main/java")
            def classesDir = new File(classesRoot, artifactBaseName)
            def modelsJar = new File(modelsLibsRoot, "${artifactBaseName}-models-${info.version}.jar")
            classesDir.mkdirs()

            if (!modelsJar.isFile()) {
                throw new GradleException("${relativePath(source)}: missing models JAR ${modelsJar.name}")
            }
            if (!restClientStarterJar.isFile()) {
                throw new GradleException("${relativePath(source)}: missing REST client starter JAR ${restClientStarterJar.name}")
            }
            if (!sourceRoot.exists() || sourceRoot.listFiles()?.length == 0) {
                throw new GradleException("${relativePath(source)}: no OpenAPI client sources were generated")
            }

            def compileClasspath = (configurations.openApiClientCompileClasspath.files
                    + configurations.openApiModelCompileClasspath.files
                    + [modelsJar, restClientStarterJar])
                    .collect { it.absolutePath }
                    .join(File.pathSeparator)
            ant.javac(
                    srcdir: sourceRoot,
                    destdir: classesDir,
                    release: '21',
                    includeantruntime: 'false',
                    encoding: 'UTF-8',
                    classpath: compileClasspath
            )

            def artifactFile = new File(libsRoot, "${artifactBaseName}-client-${info.version}.jar")
            createOpenApiReproducibleJar(
                    artifactFile,
                    [classesDir, new File(metadataRoot, "${artifactBaseName}/client")]
            )
        }
    }
}

tasks.register('validateOpenApiClientJar') {
    group = 'verification'
    description = 'Validates generated OpenAPI client JAR contents.'

    dependsOn tasks.named('openApiClientJar')
    inputs.files(openApiSpecFiles())
    inputs.dir(layout.buildDirectory.dir('libs/openapi/client'))

    doLast {
        def failures = []
        def libsRoot = layout.buildDirectory.dir('libs/openapi/client').get().asFile

        openApiSpecFiles().files.sort().each { source ->
            def info = readOpenApiInfo(source)
            def artifactBaseName = normalizeOpenApiTitle(info.title)
            def basePackage = openApiBasePackage(artifactBaseName)
            def clientPackageName = "${basePackage}.client".toString()
            def typePrefix = javaTypeName(info.title)
            def clientEntry = "${clientPackageName.replace('.', '/')}/${typePrefix}Client.class"
            def artifactFile = new File(libsRoot, "${artifactBaseName}-client-${info.version}.jar")
            if (!artifactFile.isFile()) {
                failures << "${relativePath(source)}: missing client JAR ${artifactFile.name}"
                return
            }

            def jar = new java.util.jar.JarFile(artifactFile)
            try {
                [clientEntry, 'META-INF/smbtech/openapi/contract.properties'].each { entry ->
                    if (jar.getEntry(entry) == null) {
                        failures << "${artifactFile.name}: missing ${entry}"
                    }
                }
                def metadataEntry = jar.getEntry('META-INF/smbtech/openapi/contract.properties')
                if (metadataEntry != null) {
                    def properties = new Properties()
                    jar.getInputStream(metadataEntry).withCloseable { properties.load(it) }
                    if (properties.getProperty('openapi.artifact.kind') != 'client') {
                        failures << "${artifactFile.name}: metadata openapi.artifact.kind must be client"
                    }
                }
                def modelPrefix = "${basePackage.replace('.', '/')}/model/"
                def apiPrefix = "${basePackage.replace('.', '/')}/api/"
                def embeddedModel = jar.entries().find { it.name.startsWith(modelPrefix) && it.name.endsWith('.class') }
                def embeddedApi = jar.entries().find { it.name.startsWith(apiPrefix) && it.name.endsWith('.class') }
                if (embeddedModel != null) {
                    failures << "${artifactFile.name}: must not embed model class ${embeddedModel.name}"
                }
                if (embeddedApi != null) {
                    failures << "${artifactFile.name}: must not embed server API class ${embeddedApi.name}"
                }
            } finally {
                jar.close()
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("OpenAPI client JAR issues found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('validateOpenApiArtifactSeparation') {
    group = 'verification'
    description = 'Validates that generated OpenAPI models, server API, and client artifacts stay separated.'

    dependsOn(
            tasks.named('validateOpenApiModelsJar'),
            tasks.named('validateOpenApiServerApiJar'),
            tasks.named('validateOpenApiClientJar')
    )
    inputs.files(openApiSpecFiles())
    inputs.dir(layout.buildDirectory.dir('libs/openapi'))

    doLast {
        def failures = []
        def libsRoot = layout.buildDirectory.dir('libs/openapi').get().asFile

        openApiSpecFiles().files.findAll { it.isFile() }.sort().each { source ->
            def info = readOpenApiInfo(source)
            def artifactBaseName = normalizeOpenApiTitle(info.title)
            def basePackagePath = openApiBasePackage(artifactBaseName).replace('.', '/')
            def artifactDescriptors = [
                    models: [
                            jarFile       : new File(libsRoot, "models/${artifactBaseName}-models-${info.version}.jar"),
                            artifactKind  : 'models',
                            artifactId    : "${artifactBaseName}-models".toString(),
                            allowedPrefix : "${basePackagePath}/model/".toString(),
                            forbiddenTypes: [
                                    ("${basePackagePath}/api/".toString())   : 'server API',
                                    ("${basePackagePath}/client/".toString()): 'client'
                            ]
                    ],
                    api   : [
                            jarFile       : new File(libsRoot, "api/${artifactBaseName}-api-${info.version}.jar"),
                            artifactKind  : 'api',
                            artifactId    : "${artifactBaseName}-api".toString(),
                            allowedPrefix : "${basePackagePath}/api/".toString(),
                            forbiddenTypes: [
                                    ("${basePackagePath}/model/".toString()) : 'model',
                                    ("${basePackagePath}/client/".toString()): 'client'
                            ]
                    ],
                    client: [
                            jarFile       : new File(libsRoot, "client/${artifactBaseName}-client-${info.version}.jar"),
                            artifactKind  : 'client',
                            artifactId    : "${artifactBaseName}-client".toString(),
                            allowedPrefix : "${basePackagePath}/client/".toString(),
                            forbiddenTypes: [
                                    ("${basePackagePath}/model/".toString()): 'model',
                                    ("${basePackagePath}/api/".toString())  : 'server API'
                            ]
                    ]
            ]
            def classOwners = [:].withDefault { [] }

            artifactDescriptors.each { artifactName, descriptor ->
                def jarFile = descriptor.jarFile as File
                if (!jarFile.isFile()) {
                    failures << "${relativePath(source)}: missing ${artifactName} artifact ${jarFile.name}"
                    return
                }

                def jar = new java.util.jar.JarFile(jarFile)
                try {
                    def metadataEntry = jar.getEntry('META-INF/smbtech/openapi/contract.properties')
                    if (metadataEntry == null) {
                        failures << "${jarFile.name}: missing META-INF/smbtech/openapi/contract.properties"
                    } else {
                        def properties = new Properties()
                        jar.getInputStream(metadataEntry).withCloseable { properties.load(it) }
                        if (properties.getProperty('openapi.artifact.kind') != descriptor.artifactKind) {
                            failures << "${jarFile.name}: metadata openapi.artifact.kind must be ${descriptor.artifactKind}"
                        }
                        if (properties.getProperty("openapi.artifact.${descriptor.artifactKind}") != descriptor.artifactId) {
                            failures << "${jarFile.name}: metadata openapi.artifact.${descriptor.artifactKind} must be ${descriptor.artifactId}"
                        }
                    }

                    jar.entries().toList().findAll { !it.directory }.each { entry ->
                        def entryName = entry.name
                        if (entryName.endsWith('.class')) {
                            classOwners[entryName] << descriptor.artifactKind
                            if (!entryName.startsWith(descriptor.allowedPrefix.toString())) {
                                failures << "${jarFile.name}: class ${entryName} must live under ${descriptor.allowedPrefix}"
                            }
                        }
                        descriptor.forbiddenTypes.each { prefix, label ->
                            if (entryName.startsWith(prefix.toString()) && entryName.endsWith('.class')) {
                                failures << "${jarFile.name}: must not embed ${label} class ${entryName}"
                            }
                        }
                    }
                } finally {
                    jar.close()
                }
            }

            classOwners.each { className, owners ->
                if (owners.size() > 1) {
                    failures << "${artifactBaseName}: class ${className} appears in multiple artifacts: ${owners.join(', ')}"
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("OpenAPI artifact separation issues found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('validateOpenApiReproducibleGeneration') {
    group = 'verification'
    description = 'Validates reproducible OpenAPI generated sources, metadata, and JAR artifacts.'

    dependsOn(
            tasks.named('openApiModelsJar'),
            tasks.named('openApiServerApiJar'),
            tasks.named('openApiClientJar')
    )
    inputs.files(openApiSpecFiles())
    inputs.dir(layout.buildDirectory.dir('generated/smbtech-openapi/models'))
    inputs.dir(layout.buildDirectory.dir('generated/smbtech-openapi/server-api'))
    inputs.dir(layout.buildDirectory.dir('generated/smbtech-openapi/client'))
    inputs.dir(layout.buildDirectory.dir('generated/smbtech-openapi/metadata'))
    inputs.dir(layout.buildDirectory.dir('classes/smbtech-openapi/models'))
    inputs.dir(layout.buildDirectory.dir('classes/smbtech-openapi/server-api'))
    inputs.dir(layout.buildDirectory.dir('classes/smbtech-openapi/client'))
    inputs.dir(layout.buildDirectory.dir('libs/openapi'))

    doLast {
        def failures = []
        def generatedRoot = layout.buildDirectory.dir('generated/smbtech-openapi').get().asFile
        def classesRoot = layout.buildDirectory.dir('classes/smbtech-openapi').get().asFile
        def libsRoot = layout.buildDirectory.dir('libs/openapi').get().asFile
        def tempRoot = layout.buildDirectory.dir('tmp/openapi-reproducible').get().asFile
        delete tempRoot
        tempRoot.mkdirs()

        def volatilePatterns = [
                ~/(?i)Generated on/,
                ~/(?i)Generated at/,
                ~/(?i)timestamp/,
                ~/(?i)build time/
        ]
        ['models', 'server-api', 'client', 'metadata'].each { generatedDirectory ->
            sortedFiles(new File(generatedRoot, generatedDirectory)).each { generatedFile ->
                if (generatedFile.name.endsWith('.java') || generatedFile.name.endsWith('.properties')) {
                    def text = generatedFile.text
                    volatilePatterns.each { pattern ->
                        if ((text =~ pattern).find()) {
                            failures << "${relativePath(generatedFile)}: generated output contains volatile marker '${pattern.pattern()}'"
                        }
                    }
                }
            }
        }

        def generatedHash = ['models', 'server-api', 'client', 'metadata'].collect {
            sha256Directory(new File(generatedRoot, it))
        }.join(':')
        if (generatedHash.isBlank()) {
            failures << "${relativePath(generatedRoot)}: generated output hash is empty"
        }

        def artifactKinds = [
                [kind: 'models', libDir: 'models', classDir: 'models'],
                [kind: 'api', libDir: 'api', classDir: 'server-api'],
                [kind: 'client', libDir: 'client', classDir: 'client']
        ]

        openApiSpecFiles().files.findAll { it.isFile() }.sort().each { source ->
            def info = readOpenApiInfo(source)
            def artifactBaseName = normalizeOpenApiTitle(info.title)
            artifactKinds.each { artifactKind ->
                def kind = artifactKind.kind.toString()
                def artifactFile = new File(
                        libsRoot,
                        "${artifactKind.libDir}/${artifactBaseName}-${kind}-${info.version}.jar"
                )
                def classRoot = new File(classesRoot, "${artifactKind.classDir}/${artifactBaseName}")
                def metadataRoot = new File(generatedRoot, "metadata/${artifactBaseName}/${kind}")
                if (!artifactFile.isFile()) {
                    failures << "${relativePath(source)}: missing ${kind} artifact for reproducibility check"
                    return
                }

                def jar = new java.util.jar.JarFile(artifactFile)
                try {
                    def entries = jar.entries().toList().findAll { !it.directory }.collect { it.name }
                    def sortedEntries = entries.toList().sort()
                    if (entries != sortedEntries) {
                        failures << "${artifactFile.name}: JAR entries must be sorted for reproducibility"
                    }
                    jar.entries().toList().findAll { !it.directory }.each { entry ->
                        if (entry.time != openApiReproducibleEntryTime()) {
                            failures << "${artifactFile.name}: ${entry.name} timestamp must be ${openApiReproducibleEntryTime()}, found ${entry.time}"
                        }
                    }
                } finally {
                    jar.close()
                }

                def firstJar = new File(tempRoot, "${artifactBaseName}-${kind}-first.jar")
                def secondJar = new File(tempRoot, "${artifactBaseName}-${kind}-second.jar")
                createOpenApiReproducibleJar(firstJar, [classRoot, metadataRoot])
                createOpenApiReproducibleJar(secondJar, [classRoot, metadataRoot])

                def actualHash = sha256(artifactFile)
                def firstHash = sha256(firstJar)
                def secondHash = sha256(secondJar)
                if (firstHash != secondHash) {
                    failures << "${artifactFile.name}: repeated reproducible packaging produced different hashes"
                }
                if (actualHash != firstHash) {
                    failures << "${artifactFile.name}: packaged artifact hash does not match reproducible rebuild"
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("OpenAPI reproducible generation issues found:\n" + failures.join('\n'))
        }
    }
}

