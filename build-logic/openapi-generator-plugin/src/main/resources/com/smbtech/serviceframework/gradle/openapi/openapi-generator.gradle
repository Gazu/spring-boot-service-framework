void appendPomDependency(
        groovy.util.Node dependencies,
        String groupId,
        String artifactId,
        String version,
        String scope = 'compile'
) {
    def dependency = dependencies.appendNode('dependency')
    dependency.appendNode('groupId', groupId)
    dependency.appendNode('artifactId', artifactId)
    dependency.appendNode('version', version)
    dependency.appendNode('scope', scope)
}

void configureOpenApiPomDependencies(
        MavenPublication publication,
        String artifactKind,
        String artifactBaseName,
        String artifactVersion
) {
    publication.pom.withXml {
        def root = asNode()
        def dependencies = root.dependencies ? root.dependencies[0] : root.appendNode('dependencies')
        if (artifactKind == 'models') {
            appendPomDependency(dependencies, 'com.fasterxml.jackson.core', 'jackson-annotations', '2.19.4')
            appendPomDependency(dependencies, 'jakarta.validation', 'jakarta.validation-api', '3.1.1')
        } else {
            appendPomDependency(
                    dependencies,
                    'com.smbtech.openapi',
                    "${artifactBaseName}-models".toString(),
                    artifactVersion
            )
            if (artifactKind == 'api') {
                appendPomDependency(dependencies, 'org.springframework', 'spring-web', '7.0.8')
                appendPomDependency(dependencies, 'jakarta.validation', 'jakarta.validation-api', '3.1.1')
            }
            if (artifactKind == 'client') {
                appendPomDependency(
                        dependencies,
                        'com.smbtech',
                        'spring-boot-service-framework-starter-rest-client',
                        rootProject.version.toString()
                )
                appendPomDependency(dependencies, 'jakarta.validation', 'jakarta.validation-api', '3.1.1')
            }
        }
    }
}

publishing {
    publications {
        openApiSpecFiles().files.findAll { it.isFile() }.sort().each { source ->
            def info = readOpenApiInfo(source)
            def artifactBaseName = normalizeOpenApiTitle(info.title)
            def artifactVersion = info.version
            def artifactDirectories = [
                    models: 'models',
                    api   : 'api',
                    client: 'client'
            ]
            def builtByTasks = [
                    models: tasks.named('openApiModelsJar'),
                    api   : tasks.named('openApiServerApiJar'),
                    client: tasks.named('openApiClientJar')
            ]

            artifactDirectories.each { artifactKind, artifactDirectory ->
                def publicationName = "${javaIdentifier(artifactBaseName)}OpenApi${artifactKind.substring(0, 1).toUpperCase(Locale.ROOT)}${artifactKind.substring(1)}"
                create(publicationName, MavenPublication) {
                    groupId = 'com.smbtech.openapi'
                    artifactId = "${artifactBaseName}-${artifactKind == 'models' ? 'models' : artifactKind}".toString()
                    version = artifactVersion
                    artifact(layout.buildDirectory.file("libs/openapi/${artifactDirectory}/${artifactBaseName}-${artifactKind == 'api' ? 'api' : artifactKind}-${artifactVersion}.jar")) {
                        builtBy builtByTasks[artifactKind]
                    }
                    pom {
                        name = "${artifactBaseName} ${artifactKind}".toString()
                        description = "Generated OpenAPI ${artifactKind} artifact for ${info.title}.".toString()
                    }
                    configureOpenApiPomDependencies(delegate, artifactKind.toString(), artifactBaseName, artifactVersion.toString())
                }
            }
        }
    }
    repositories {
        maven {
            name = 'localBuild'
            url = layout.buildDirectory.dir('repository/openapi')
        }

        def privateRepositoryUrl = providers.gradleProperty('privateMavenUrl')
                .orElse(providers.environmentVariable('PRIVATE_MAVEN_URL'))
                .orNull
        if (privateRepositoryUrl) {
            maven {
                name = 'privateRegistry'
                url = uri(privateRepositoryUrl)
                credentials {
                    username = providers.gradleProperty('privateMavenUsername')
                            .orElse(providers.environmentVariable('PRIVATE_MAVEN_USERNAME'))
                            .getOrElse('')
                    password = providers.gradleProperty('privateMavenPassword')
                            .orElse(providers.environmentVariable('PRIVATE_MAVEN_PASSWORD'))
                            .getOrElse('')
                }
            }
        }
    }
}

