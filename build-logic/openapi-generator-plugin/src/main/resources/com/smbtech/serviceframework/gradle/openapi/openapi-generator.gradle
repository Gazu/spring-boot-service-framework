tasks.register('validateOpenApiServerApiJar') {
    group = 'verification'
    description = 'Validates generated OpenAPI server API JAR contents.'

    dependsOn tasks.named('openApiServerApiJar')
    inputs.files(openApiSpecFiles())
    inputs.dir(layout.buildDirectory.dir('libs/openapi/api'))

    doLast {
        def failures = []
        def libsRoot = layout.buildDirectory.dir('libs/openapi/api').get().asFile

        openApiSpecFiles().files.sort().each { source ->
            def info = readOpenApiInfo(source)
            def artifactBaseName = normalizeOpenApiTitle(info.title)
            def apiPackageName = "${openApiBasePackage(artifactBaseName)}.api".toString()
            def typePrefix = javaTypeName(info.title)
            def delegateEntry = "${apiPackageName.replace('.', '/')}/${typePrefix}ApiDelegate.class"
            def controllerEntry = "${apiPackageName.replace('.', '/')}/${typePrefix}ApiController.class"
            def artifactFile = new File(libsRoot, "${artifactBaseName}-api-${info.version}.jar")
            if (!artifactFile.isFile()) {
                failures << "${relativePath(source)}: missing server API JAR ${artifactFile.name}"
                return
            }

            def jar = new java.util.jar.JarFile(artifactFile)
            try {
                [delegateEntry, controllerEntry, 'META-INF/smbtech/openapi/contract.properties'].each { entry ->
                    if (jar.getEntry(entry) == null) {
                        failures << "${artifactFile.name}: missing ${entry}"
                    }
                }
                def modelPrefix = "${openApiBasePackage(artifactBaseName).replace('.', '/')}/model/"
                def embeddedModel = jar.entries().find { it.name.startsWith(modelPrefix) && it.name.endsWith('.class') }
                if (embeddedModel != null) {
                    failures << "${artifactFile.name}: must not embed model class ${embeddedModel.name}"
                }
            } finally {
                jar.close()
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("OpenAPI server API JAR issues found:\n" + failures.join('\n'))
        }
    }
}

