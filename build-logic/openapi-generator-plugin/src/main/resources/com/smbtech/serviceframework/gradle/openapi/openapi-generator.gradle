tasks.register('validateOpenApiCompleteOperationGeneration') {
    group = 'verification'
    description = 'Validates complete Spring server and HTTP client operation generation.'
    def fixture = file('gradle/fixtures/openapi-complete-operations.yaml')
    inputs.file(fixture)

    doLast {
        def failures = []
        def operations = readOpenApiOperations(fixture)
        def post = operations.find { it.operationId == 'replaceOrder' }
        if (operations.collect { it.method } as Set != ['POST', 'HEAD', 'OPTIONS', 'TRACE'] as Set) {
            failures << 'all supported HTTP operation methods were not parsed'
        }
        if (post == null) {
            failures << 'replaceOrder operation was not parsed'
        } else {
            if (post.parameters.collect { "${it.in}:${it.name}" } != [
                    'path:orderId',
                    'query:priority',
                    'header:X-Correlation-Id',
                    'cookie:session'
            ]) {
                failures << 'path, query, header, and cookie parameters were not preserved'
            }
            if (post.requestBody?.javaType != 'ReplaceOrderRequest' || post.requestBody?.required != true) {
                failures << 'referenced required request body was not resolved'
            }
            if (post.response?.status != 201 || post.response?.javaType != 'OrderResponse') {
                failures << 'referenced 201 response was not resolved'
            }
        }

        if (post != null) {
            def modelPackage = 'com.smbtech.fixture.model'
            def controller = renderOpenApiControllerSource(
                    'com.smbtech.fixture.api', modelPackage, 'FixtureApiDelegate', 'FixtureApiController', operations
            )
            def client = renderOpenApiClientSource(
                    'com.smbtech.fixture.client', modelPackage, 'FixtureClient', 'fixture', operations
            )
            def delegate = renderOpenApiDelegateSource(
                    'com.smbtech.fixture.api', modelPackage, 'FixtureApiDelegate', operations
            )
            [
                    '@RequestMapping(path = "/orders/{orderId}", method = RequestMethod.POST, consumes = "application/json", produces = "application/json")',
                    '@RequestParam(name = "priority", required = true)',
                    '@RequestHeader(name = "X-Correlation-Id", required = false)',
                    '@CookieValue(name = "session", required = true)',
                    '@Valid @NotNull @RequestBody(required = true) ReplaceOrderRequest requestBody',
                    'ResponseEntity.status(201)',
                    'method = RequestMethod.HEAD',
                    'method = RequestMethod.OPTIONS',
                    'method = RequestMethod.TRACE'
            ].each { expected ->
                if (!controller.contains(expected)) {
                    failures << "generated controller is missing ${expected}"
                }
            }
            [
                    '@HttpExchange(url = "/orders/{orderId}", method = "POST", contentType = "application/json", accept = "application/json")',
                    '@RequestParam(name = "priority", required = true)',
                    '@RequestHeader(name = "X-Correlation-Id", required = false)',
                    '@CookieValue(name = "session", required = true)',
                    '@RequestBody(required = true) ReplaceOrderRequest requestBody',
                    'method = "HEAD"',
                    'method = "OPTIONS"',
                    'method = "TRACE"'
            ].each { expected ->
                if (!client.contains(expected)) {
                    failures << "generated client is missing ${expected}"
                }
            }
            if (!delegate.contains(
                    'OrderResponse replaceOrder(String orderId, Integer priority, String xCorrelationId, String session, ReplaceOrderRequest requestBody);'
            )) {
                failures << 'generated delegate does not expose the complete operation signature'
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("OpenAPI complete operation generation issues found:\n" + failures.join('\n'))
        }
    }
}

