tasks.register('validateOpenApiLocalPublication') {
    group = 'verification'
    description = 'Validates generated OpenAPI artifacts and POMs published to the root local build repository.'

    dependsOn tasks.named('publishOpenApiArtifactsToLocalBuildRepository')
    inputs.files(openApiSpecFiles())
    inputs.dir(layout.buildDirectory.dir('repository/openapi'))

    doLast {
        def failures = []
        def repositoryRoot = layout.buildDirectory.dir('repository/openapi').get().asFile

        openApiSpecFiles().files.findAll { it.isFile() }.sort().each { source ->
            def info = readOpenApiInfo(source)
            def artifactBaseName = normalizeOpenApiTitle(info.title)
            ['models', 'api', 'client'].each { artifactKind ->
                def artifactId = "${artifactBaseName}-${artifactKind}".toString()
                def artifactPath = new File(
                        repositoryRoot,
                        "com/smbtech/openapi/${artifactId}/${info.version}/${artifactId}-${info.version}.jar"
                )
                def pomPath = new File(
                        repositoryRoot,
                        "com/smbtech/openapi/${artifactId}/${info.version}/${artifactId}-${info.version}.pom"
                )
                if (!artifactPath.isFile()) {
                    failures << "${relativePath(source)}: missing published ${artifactKind} JAR ${artifactPath}"
                }
                if (!pomPath.isFile()) {
                    failures << "${relativePath(source)}: missing published ${artifactKind} POM ${pomPath}"
                }
                if (pomPath.isFile()) {
                    def pom = new groovy.xml.XmlSlurper(false, false).parse(pomPath)
                    def dependencyArtifactIds = pom.dependencies.dependency.artifactId.collect { it.text() } as Set
                    def forbiddenArtifactIds = [
                            "${artifactBaseName}-api".toString(),
                            "${artifactBaseName}-client".toString(),
                            'spring-boot-service-framework-starter-rest-client'
                    ] as Set
                    if (artifactKind == 'models') {
                        forbiddenArtifactIds.each { forbiddenArtifactId ->
                            if (dependencyArtifactIds.contains(forbiddenArtifactId)) {
                                failures << "${relativePath(pomPath)}: models artifact must not depend on ${forbiddenArtifactId}"
                            }
                        }
                    }
                    if (artifactKind == 'api') {
                        if (!dependencyArtifactIds.contains("${artifactBaseName}-models".toString())) {
                            failures << "${relativePath(pomPath)}: missing generated models dependency"
                        }
                        if (!dependencyArtifactIds.contains('spring-web')) {
                            failures << "${relativePath(pomPath)}: missing Spring Web dependency"
                        }
                        ['spring-boot-service-framework-starter-rest-client', "${artifactBaseName}-client".toString()].each { forbiddenArtifactId ->
                            if (dependencyArtifactIds.contains(forbiddenArtifactId)) {
                                failures << "${relativePath(pomPath)}: server API artifact must not depend on ${forbiddenArtifactId}"
                            }
                        }
                    }
                    if (artifactKind == 'client') {
                        if (!dependencyArtifactIds.contains("${artifactBaseName}-models".toString())) {
                            failures << "${relativePath(pomPath)}: missing generated models dependency"
                        }
                        if (!dependencyArtifactIds.contains('spring-boot-service-framework-starter-rest-client')) {
                            failures << "${relativePath(pomPath)}: missing REST client starter dependency"
                        }
                        if (dependencyArtifactIds.contains("${artifactBaseName}-api".toString())) {
                            failures << "${relativePath(pomPath)}: client artifact must not depend on server API artifact"
                        }
                    }
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("OpenAPI local publication issues found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('validateOpenApiTaskCompatibility') {
    group = 'verification'
    description = 'Validates that public OpenAPI Gradle task names remain backward-compatible.'

    doLast {
        def publicTaskNames = [
                'validateOpenApiNameNormalization',
                'validateOpenApiSpecs',
                'generateOpenApiSpecVersionCatalog',
                'validateOpenApiSpecVersionCatalog',
                'generateOpenApiMetadata',
                'validateOpenApiMetadata',
                'generateOpenApiModels',
                'openApiModelsJar',
                'validateOpenApiModelsJar',
                'generateOpenApiServerApi',
                'openApiServerApiJar',
                'validateOpenApiServerApiJar',
                'generateOpenApiClient',
                'openApiClientJar',
                'validateOpenApiClientJar',
                'validateOpenApiArtifactSeparation',
                'validateOpenApiReproducibleGeneration',
                'generateOpenApiCompilationTests',
                'validateOpenApiCompilationTests',
                'openApiBreakingChangeCheck',
                'publishOpenApiArtifactsToLocalBuildRepository',
                'validateOpenApiLocalPublication',
                'smbtechOpenApiBuildLogicCheck',
                'validateOpenApiGeneratorModuleCompatibility',
                'openApiBuildLogicCheck',
                'openApiCompatibilityCheck',
                'validateOpenApiTaskCompatibility'
        ]
        def failures = []

        publicTaskNames.each { taskName ->
            def task = tasks.findByName(taskName)
            if (task == null) {
                failures << "missing public OpenAPI task '${taskName}'"
            } else {
                if (task.group == null || task.group.toString().isBlank()) {
                    failures << "${taskName}: public task must declare a group"
                }
                if (task.description == null || task.description.toString().isBlank()) {
                    failures << "${taskName}: public task must declare a description"
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("OpenAPI task compatibility issues found:\n" + failures.join('\n'))
        }
    }
}

tasks.register('validateOpenApiGeneratorModuleCompatibility') {
    group = 'verification'
    description = 'Validates the reusable OpenAPI generator module compatibility contract.'

    dependsOn ':spring-boot-service-framework-openapi-generator:check'

    doLast {
        def generatorProject = project(':spring-boot-service-framework-openapi-generator')
        def requiredClasses = [
                'OpenApiArtifactKind',
                'OpenApiSpecInfo',
                'OpenApiSpecReader',
                'OpenApiNameNormalizer',
                'OpenApiContractMetadata',
                'OpenApiMetadataGenerator',
                'OpenApiModelGenerator',
                'OpenApiServerApiGenerator',
                'OpenApiClientGenerator',
                'OpenApiJarPackager',
                'OpenApiPublicationDescriptor',
                'OpenApiChangeSeverity',
                'OpenApiChangeCode',
                'OpenApiChange',
                'OpenApiSemanticVersion',
                'OpenApiCompatibilityReport',
                'OpenApiBaselineResolver',
                'OpenApiBreakingChangeDetector',
                'OpenApiBreakingChangeCli'
        ]
        def sourceRoot = generatorProject.file('src/main/java/com/smbtech/serviceframework/openapi/generator')
        def failures = []

        requiredClasses.each { className ->
            def sourceFile = new File(sourceRoot, "${className}.java")
            if (!sourceFile.isFile()) {
                failures << "missing reusable OpenAPI generator public type ${className}"
            }
        }

        def checkTask = generatorProject.tasks.findByName('check')
        if (checkTask == null) {
            failures << 'spring-boot-service-framework-openapi-generator must expose a check task'
        }

        if (!failures.isEmpty()) {
            throw new GradleException("OpenAPI generator module compatibility issues found:\n" + failures.join('\n'))
        }
    }
}

